<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2444">
<title>销售智助 · 小程序原型 · 商汤 AI 销售管理平台 · LBS Demo</title>
<meta name="description" content="商汤 AI 销售管理平台 · LBS 一线销售智能留痕方案 Demo 原型（微信小程序「销售智助」，纯前端模拟数据）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e5bd8'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23fff'%3E智%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<button class="presenter-toggle" onclick="App.togglePresenter()" aria-label="演示导览">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>

<div class="app">
  <!-- 左侧：演示导览 -->
  <aside class="presenter" id="presenter">
    <div class="p-head">
      <div class="p-brand">
        <div class="logo">智</div>
        <div>
          <div class="t">销售智助 · 小程序原型</div>
          <div class="s">商汤 AI 销售管理平台 · LBS 一线销售智能留痕 Demo</div>
        </div>
      </div>
    </div>
    <div class="p-scroll">
      <div class="p-sec">
        <h4>切换演示账号（均虚构）</h4>
        <div class="roles" id="p-roles"></div>
      </div>
      <div class="p-sec">
        <h4>一名地推销售的一天 · 十分钟八步</h4>
        <div class="steps" id="p-steps"></div>
      </div>
      <div class="p-sec">
        <h4>当前页面 · 对应 deck 页与规则</h4>
        <div id="p-cur"></div>
      </div>
      <div class="p-sec">
        <h4>演示动作</h4>
        <div class="p-actions" id="p-demo-actions"></div>
      </div>
      <div class="p-sec">
        <h4>工具</h4>
        <div class="p-actions">
          <button class="p-btn" onclick="App.tab('home')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>回到首页</button>
          <a class="p-btn" href="requirements.html" target="_blank"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>需求梳理文档</a>
          <button class="p-btn danger" onclick="App.confirm('重置演示数据','将清除本次演示中产生的留痕、任务、方案等记录，恢复初始样本。',()=>App.reset())"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>重置演示数据</button>
        </div>
      </div>
    </div>
    <div class="p-foot">演示数据均为虚构，不代表真实客户；三端名称「销售智助」「销售工作台」「企业管理后台」为暂用名。演示日期固定为 2026-09-07（周一）。</div>
  </aside>

  <!-- 右侧：手机 -->
  <main class="stage-wrap">
    <div class="phone">
      <div class="phone-screen">
        <div class="island"></div>
        <div class="statusbar" id="statusbar"></div>
        <div class="stage" id="stage"></div>
        <div id="overlay"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
    <div class="stage-caption">微信小程序「销售智助」原型 · 390×844 · 点击左侧步骤可直接跳转 · 演示数据均为虚构</div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/route.js"></script>
<script src="js/screens/customers.js"></script>
<script src="js/screens/visit.js"></script>
<script src="js/screens/confirm.js"></script>
<script src="js/screens/kb.js"></script>
<script src="js/screens/gtm.js"></script>
<script src="js/screens/team.js"></script>
<script src="js/screens/me.js"></script>
<script>App.boot();</script>
</body>
</html>
