.tm-kv .v { flex: 1; min-width: 0; color: var(--ink); }
.tm-kv.ai .v { color: #3b3bb0; }
.tm-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.tm-cmp > div { border-radius: 12px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.tm-cmp > div.ai { background: var(--ai-soft); border-color: #dfe2ff; }
.tm-cmp .e { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.tm-cmp .big { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tm-cmp .ai .big { color: var(--ai); }
.tm-cmp .s { font-size: 11px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
  `);
  const TODAY = '2026-09-07';
  const WEEK_START = '2026-09-01';
  const PERIOD = '本周 9/1–9/7';
  const UPDATED = '更新 09:30';
  const KIND_TONE = { 停滞: 'warn', 服务风险: 'danger', 承诺差异: 'violet', 逾期: 'danger' };
  const STAGES = { 地推: ['待触达', '已触达', '需求确认', '方案沟通', '报价商务'], KA: ['需求确认', '方案沟通', '报价商务', '待签约'] };
  const GROUPS = [{ id: '餐饮单店', icon: 'store' }, { id: '食品工厂', icon: 'building' }, { id: '全部客群', icon: 'layers' }];
  const DEFAULT_GROUP = { 地推: '餐饮单店', KA: '食品工厂' };
  const ORG = { 地推: '华东一区 · 地推组', KA: '华东 KA 组' };

  /* ---------- 取数与小工具 ---------- */
  const ui = () => (App.state.ui = App.state.ui || {});
  const seg = () => ui().teamSeg || '地推';
  const group = () => ui().teamGroup || DEFAULT_GROUP[seg()];
  const team = () => App.state.team;
  const members = (s) => team().members.filter((m) => m.role === (s || seg()));
  const member = (id) => App.by(team().members, 'id', id);
  const memberByName = (name) => team().members.find((m) => m.name === name);
  // 王磊 / 赵敏 的门店与任务在样本里以 ownerName 关联（ownerId 为 u_other），按 id 或姓名匹配
  const ownsTask = (m, t) => t.ownerId === m.id || t.ownerName === m.name;
  const ownsStore = (m, s) => s.ownerId === m.id || s.ownerName === m.name;
  const inSeg = (owner, ms) => ms.some((m) => m.name === owner);
  const hasData = () => group() === '全部客群' || group() === DEFAULT_GROUP[seg()];
  const av = (m, cls = '') => `<div class="avatar ${cls}" style="background:${m.color}">${App.esc(App.initials(m.name))}</div>`;
  const roleChip = (m) => App.ui.chip(m.role, m.role === 'KA' ? 'info' : 'brand', { sm: true });
  const sum = (arr, k) => arr.reduce((a, m) => a + (m[k] || 0), 0);
  const chev = (size = 16) => App.icon('chevron-right', size);
  const esc = App.esc;
  const noPerm = () => App.ui.empty({ icon: 'lock', title: '无权限查看团队数据', sub: `团队统计与下钻仅对授权主管开放（当前：${App.me().name} · ${App.me().roleName}）`, action: App.ui.btn('切换为销售主管', { tone: 'secondary', size: 'sm', onclick: "App.setRole('mgr')" }) });
  const note = (text, icon = 'shield') => `<div class="tm-note">${App.icon(icon, 13)}<span>${text}</span></div>`;
  const FOOT_NOTES = () => `<div class="mt8">${note('仅显示已授权团队（华东一区）范围内数据；不显示未经授权的跨区数据。')}${note('地推 / KA 分开比较，KA 不采用地推次数门槛；AI 不生成销售个人能力排名或自动绩效结论。', 'sparkle')}</div>`;

  /* ---------- 筛选 ---------- */
  T.setSeg = function (s) { ui().teamSeg = s; ui().teamGroup = DEFAULT_GROUP[s]; App.save(); App.refresh(); };
  T.pickGroup = function () {
    App.sheet({
      title: `按客群筛选 · 与地推 / KA 分开比较（当前 ${seg()}）`,
      items: GROUPS.map((g) => ({ label: g.id, icon: g.icon, right: g.id === group() ? '当前' : '', sub: g.id === '全部客群' ? '不跨区、不跨授权范围' : (g.id === DEFAULT_GROUP[seg()] ? `${seg()}团队本周样本所在客群` : `${seg()}团队本周无该客群样本`), onSelect() { ui().teamGroup = g.id; App.save(); App.refresh(); } })),
    });
  };
  T.drill = function (kind) {
    const ms = members();
    const def = kind === 'coverage'
      ? { t: '覆盖门店 · 计算明细：期间产生至少一条已确认触达记录的去重门店数（同店多次只算一次，纯拍照不算）', k: 'coverage' }
      : { t: '有效拜访 · 计算明细：符合已发布有效拜访规则且已生效的活动数（共同拜访按活动去重）', k: 'effective' };
    App.sheet({ title: def.t, items: ms.map((m) => ({ label: m.name, sub: `${m.role} · 覆盖 ${m.coverage} · 有效拜访 ${m.effective}`, icon: 'user', right: String(m[def.k]), onSelect() { App.go('team-member', { id: m.id }); } })) });
  };

  /* ---------- 计算 ---------- */
  function taskStats(ms) {
    const mine = App.state.tasks.filter((t) => ms.some((m) => ownsTask(m, t)));
    const day = (t) => (t.doneAt || t.due || '').slice(0, 10);
    const inWeek = (d) => d >= WEEK_START && d <= TODAY;
    const overdue = mine.filter((t) => t.status === 'todo' && t.due < TODAY).length;
    const today = { done: mine.filter((t) => t.status === 'done' && day(t) === TODAY).length, todo: mine.filter((t) => t.status === 'todo' && t.due === TODAY).length, overdue };
    const week = { done: mine.filter((t) => t.status === 'done' && inWeek(day(t))).length, todo: mine.filter((t) => t.status === 'todo' && t.due >= TODAY && inWeek(t.due)).length, overdue };
    const resched = mine.filter((t) => t.status === 'rescheduled' || t.status === 'cancelled').length;
    return { today, week, resched, onTime: { n: week.done, d: week.done + overdue } };
  }
  function stack(s) {
    const total = s.done + s.todo + s.overdue;
    if (!total) return '<div class="tm-stack empty"><span>暂无任务</span></div>';
    const w = (n) => ((n / total) * 100).toFixed(1) + '%';
    return `<div class="tm-stack">${s.done ? `<i class="ok" style="width:${w(s.done)}"></i>` : ''}${s.todo ? `<i class="info" style="width:${w(s.todo)}"></i>` : ''}${s.overdue ? `<i class="danger" style="width:${w(s.overdue)}"></i>` : ''}</div>`;
  }
  const trow = (label, s) => `<div class="tm-trow"><div class="row between"><span class="small bold">${label}</span><span class="tiny muted num"><b class="tm-c-ok">${s.done}</b> 完成 · <b class="tm-c-info">${s.todo}</b> 待办 · <b class="tm-c-danger">${s.overdue}</b> 逾期</span></div>${stack(s)}</div>`;
  function stageRows(ms, s) {
    const agg = {};
    ms.forEach((m) => Object.keys(m.stages || {}).forEach((k) => { agg[k] = (agg[k] || 0) + m.stages[k]; }));
    const total = Object.values(agg).reduce((a, b) => a + b, 0);
    return { total, rows: STAGES[s].map((st) => ({ label: st, value: agg[st] || 0, display: total ? `${agg[st] || 0} · ${Math.round(((agg[st] || 0) / total) * 100)}%` : '暂无数据' })) };
  }
  const fbRows = (ms) => ms.map((m) => ({ label: m.name, value: m.proposalsSent ? m.feedback / m.proposalsSent : 0, display: m.proposalsSent ? `${Math.round((m.feedback / m.proposalsSent) * 100)}%（${m.feedback}/${m.proposalsSent}）` : '暂无数据' }));

  /* ---------- 趋势图（内联 SVG，330 宽） ---------- */
  function trendSvg(tr) {
    const W = 330, H = 158, L = 30, R = 14, TP = 20, B = 26;
    const n = tr.weeks.length;
    const top = Math.ceil(Math.max(...tr.coverage, ...tr.effective) / 10) * 10 || 10;
    const x = (i) => L + (i * (W - L - R)) / (n - 1);
    const y = (v) => TP + (H - TP - B) * (1 - v / top);
    const f = (v) => v.toFixed(1);
    const pathOf = (a) => a.map((v, i) => `${i ? 'L' : 'M'}${f(x(i))},${f(y(v))}`).join(' ');
    const grid = [0, top / 2, top].map((v) => `<line x1="${L}" x2="${W - R}" y1="${f(y(v))}" y2="${f(y(v))}" stroke="#e2e6eb" stroke-width="1"${v ? ' stroke-dasharray="3 3"' : ''}/><text x="${L - 7}" y="${f(y(v) + 3.5)}" text-anchor="end" font-size="10.5" fill="#8a94a6">${v}</text>`).join('');
    const xl = tr.weeks.map((w, i) => `<text x="${f(x(i))}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="#8a94a6">${esc(w)}</text>`).join('');
    const series = (arr, color, above) => `<path d="${pathOf(arr)}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` + arr.map((v, i) => `<circle cx="${f(x(i))}" cy="${f(y(v))}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/><text x="${f(x(i))}" y="${f(y(v) + (above ? -8 : 15))}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${color}">${v}</text>`).join('');
    return `<svg class="tm-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 4 周覆盖门店与有效拜访趋势">${grid}${series(tr.coverage, '#0e8f6e', false)}${series(tr.effective, '#2563eb', true)}${xl}</svg>`;
  }

  /* ---------- 片段 ---------- */
  function blockerCell(b) {
    const m = memberByName(b.owner);
    const go = b.oppId ? `App.go('opportunity',{id:'${b.oppId}'})` : `App.go('customer',{id:'${b.storeId}'})`;
    return `<div class="cell pressable tm-blocker" onclick="${go}"><div class="cell-body"><div class="row gap6">${App.ui.chip(b.kind, KIND_TONE[b.kind] || 'gray', { sm: true })}<span class="cell-title ellipsis grow">${esc(b.title)}</span></div><div class="cell-sub row gap6 mt4">${m ? av(m, 'sm tm-av-xs') : ''}<span class="tm-owner">${esc(b.owner)}</span><span class="tm-dot"></span><span class="ellipsis grow">${esc(b.evidence)}</span></div></div><div class="cell-right">${chev()}</div></div>`;
  }
  function unfollowedCell(u) {
    const st = App.store(u.storeId);
    const hot = u.days >= 21;
    return App.ui.cell({
      title: esc(st ? st.name : u.storeId), icon: 'store', iconTone: hot ? 'danger' : 'warn',
      sub: `${st && st.street ? esc(st.street) + ' · ' : ''}负责人 ${esc(u.owner)} · ${st && st.lastVisit ? '上次 ' + App.fmt.md(st.lastVisit.date) + ' ' + esc(st.lastVisit.type) : '无有效触达记录'}`,
      right: App.ui.chip(`${u.days} 天未跟进`, hot ? 'danger' : 'warn', { sm: true }),
      onclick: `App.go('customer',{id:'${u.storeId}'})`,
    });
  }
  function memberCard(m) {
    return `<div class="card tight pressable tm-member" onclick="App.go('team-member',{id:'${m.id}'})"><div class="row gap12">${av(m)}<div class="grow"><div class="row gap6"><span class="bold ellipsis">${esc(m.name)}</span>${roleChip(m)}${m.overdue ? App.ui.chip(`超期 ${m.overdue}`, 'danger', { sm: true }) : ''}</div><div class="tiny muted mt4 ellipsis">${m.pendingConfirm ? `待确认记录 ${m.pendingConfirm}` : '无待确认记录'} · 方案反馈 ${m.proposalsSent ? `${m.feedback}/${m.proposalsSent}` : '暂无数据'}</div></div><div class="tm-mini"><div><div class="n">${m.coverage}</div><div class="l">覆盖</div></div><div><div class="n">${m.effective}</div><div class="l">有效</div></div></div>${chev()}</div></div>`;
  }
  const kpiDash = () => App.ui.kpis([
    { label: '覆盖门店', value: '—', sub: '暂无数据' }, { label: '有效拜访', value: '—', sub: '暂无数据' }, { label: '跟进超期', value: '—', sub: '暂无数据' }, { label: '待复核', value: '—', sub: '暂无数据' },
  ], true);
  const filterRow = (s, g, ok) => `<div class="row between tm-filter"><div class="seg" role="tablist"><button class="${s === '地推' ? 'active' : ''}" onclick="S_TEAM.setSeg('地推')">地推</button><button class="${s === 'KA' ? 'active' : ''}" onclick="S_TEAM.setSeg('KA')">KA</button></div><button class="tm-chip ${ok ? '' : 'warn'}" onclick="S_TEAM.pickGroup()">${App.icon('filter', 14)}${esc(g)}${App.icon('chevron-down', 14)}</button></div>`;

  /* ---------- 团队工作台正文 ---------- */
  T.render = function () {
    if (!App.isMgr()) return noPerm();
    const s = seg(), g = group(), ok = hasData(), ms = members(s), tm = team();
    if (!ok) {
      return filterRow(s, g, ok) + kpiDash() + `<div class="tm-cap">${PERIOD} · ${UPDATED} · 样本量 0</div>` +
        App.ui.empty({ icon: 'filter', title: '该筛选下暂无数据', sub: `${s} · ${g}：本周样本量 0，分母为零不显示 0%`, action: App.ui.btn(`恢复 ${DEFAULT_GROUP[s]}`, { tone: 'secondary', size: 'sm', onclick: `S_TEAM.setSeg('${s}')` }) }) + FOOT_NOTES();
    }
    const blockers = tm.blockers.filter((b) => inSeg(b.owner, ms));
    const unfollowed = tm.unfollowed.filter((u) => inSeg(u.owner, ms));
    const reviews = tm.reviews.filter((r) => inSeg(r.owner, ms));
    const cov = sum(ms, 'coverage'), eff = sum(ms, 'effective'), od = sum(ms, 'overdue');
    const ts = taskStats(ms);

  /* ---------- 复核（采纳 / 维持均需原因并留痕） ---------- */
  T.review = function (rid, decision) {
    const tm = team(); const r = App.by(tm.reviews, 'id', rid); if (!r) return;
    const o = App.opp(r.oppId); if (!o || !o.ai) { App.toast('缺少 AI 建议记录'); return; }
    const adopt = decision === 'adopt';
    App.prompt(adopt ? '采纳 AI 建议 · 复核原因（必填）' : '维持正式值 · 复核原因（必填）',
      adopt ? '例如：已与刘晓芸核实，吴总明确表示正在比较其他供应商' : '例如：客户口头不满但合同正常履行，先核实原因再定',
      (txt) => {
        const reason = (txt || '').trim();
        if (!reason) { App.toast('复核原因不能为空', { icon: 'alert' }); return; }
        const before = o.tier;
        if (adopt) { o.tier = o.ai.tier; o.tierSource = '主管复核 · 9/7'; }
        o.review = { decision: adopt ? '采纳建议' : '维持正式值', reason, by: App.me().name, at: '2026-09-07 09:45', officialBefore: before, aiTier: o.ai.tier };
        o.reviewNote = `${o.review.decision} · ${reason}（${App.me().name} 9/7）`;
        o.ai.reviewStatus = adopt ? '已采纳（主管复核）' : '已维持正式值（主管复核）';
        tm.reviews = tm.reviews.filter((x) => x.id !== rid);
        (tm.reviewed = tm.reviewed || []).unshift(Object.assign({}, r, { status: o.review.decision, reason, at: o.review.at, before, after: o.tier }));
        App.save(); App.refresh();
        App.toast(adopt ? `已采纳：分层 ${App.tierLabel(before)} → ${App.tierLabel(o.tier)}，已留痕` : '已维持正式值，原因已留痕', { icon: 'check-circle' });
      }, adopt ? '采纳并留痕' : '维持并留痕');
  };

        if (!o || !ai) return `<div class="card">${esc(r.title)}<div class="small muted">缺少商机或 AI 建议记录</div></div>`;
        return `<div class="card">
          <div class="row top gap12">${m ? av(m) : ''}<div class="grow"><div class="tm-btitle">${esc(r.title)}</div><div class="small muted mt4">${esc(st ? st.name : '')} · 负责人 ${esc(r.owner)} · ${esc(o.service)} · ${esc(o.kind)}</div></div>${App.ui.chip(r.status, 'warn', { sm: true })}</div>
          <div class="mt12">${App.ui.notice('warn', `<b>冲突</b>：${esc(r.reason)}${ai.conflict ? '<br><span class="tiny">' + esc(ai.conflict) + '</span>' : ''}`)}</div>
          <div class="tm-cmp"><div><div class="e"><span>正式分层</span>${App.ui.factTag('official')}</div><div class="big">${App.tierLabel(o.tier)}</div><div class="s">${esc(o.tierSource)} · 阶段 ${esc(o.stage)}</div></div><div class="ai"><div class="e"><span>AI 建议</span>${App.ui.factTag('derived')}</div><div class="big">${App.tierLabel(ai.tier)}</div><div class="s">置信度 ${esc(ai.confidence)} · 不改正式值</div></div></div>
          <div class="tm-kv"><div class="k">依据</div><div class="v">${(ai.basis || []).map(esc).join('；')}</div></div>
          <div class="tm-kv"><div class="k">缺失</div><div class="v">${(ai.missing || []).map(esc).join('、') || '—'}</div></div>
          <div class="tm-kv"><div class="k">下一步</div><div class="v">${(ai.next || []).map(esc).join('；')}</div></div>
          <div class="mt12">${App.ui.btn('查看商机推进卡', { tone: 'outline', size: 'sm', icon: 'briefcase', block: true, onclick: `App.go('opportunity',{id:'${o.id}'})` })}</div>
          <div class="btn-row mt8">${App.ui.btn('维持正式值', { tone: 'ghost', onclick: `S_TEAM.review('${r.id}','keep')` })}${App.ui.btn('采纳建议', { tone: 'primary', icon: 'check', onclick: `S_TEAM.review('${r.id}','adopt')` })}</div>
          <div class="mt8">${note('两种结论均需填写原因并留痕；采纳后正式分层来源记为"主管复核 · 9/7"，AI 建议原文保留。', 'info')}</div>
        </div>`;
      }).join('');
      if (done.length) {
        h += App.ui.section('已处理', `<span class="muted">${done.length} 项 · 已留痕</span>`);
        h += `<div class="list">${done.map((d) => App.ui.cell({ title: esc(d.title), icon: 'history', iconTone: 'gray', sub: `${esc(d.status)} · ${App.tierLabel(d.before)} → ${App.tierLabel(d.after)} · 原因：${esc(d.reason)}`, right: App.ui.chip(d.status === '采纳建议' ? '已采纳' : '已维持', d.status === '采纳建议' ? 'brand' : 'gray', { sm: true }), onclick: `App.go('opportunity',{id:'${d.oppId}'})` })).join('')}</div>`;
      }
      h += `<div class="mt8">${note('修正事实优先：若冲突源于拜访事实错误，应先纠错（需原因）再复核分层；人工结论与 AI 建议分别存储。')}</div>`;
      return h;
    },
  });
})();

</script>
<script>
/* ============================================================
   P1 预览（包 B）：报价 / 承诺一致性 / 合同 / 履约续约 / KA 经营卡 / 虫害识别
   页面：p1-hub · p1-quote · p1-commitments · p1-contract · p1-service · p1-ka-card · p1-pest
   所有页面带 App.ui.p1Banner()：依赖接口与规则，首期不承诺
   ============================================================ */
(function () {
  'use strict';
  const S = window.S_P1 = {};
  const ui = () => App.ui;
  const P = () => App.state.p1;
  const isApprover = () => App.state.role === 'mgr';
  const NOW = '2026-09-07 09:41';
  const money = (n) => '¥ ' + Number(n).toLocaleString('zh-CN');

  /* 运行时字段补齐（data.js 只读；演示交互状态挂在 App.state.p1 上） */
  function ensure() {
    const p = P();
    const q = p.quote;
    if (q.version == null) q.version = 1;
    if (q.filled === undefined) q.filled = null;
    if (!q.history) q.history = [{ t: '2026-09-06 17:20', title: 'v1 草稿创建', body: '规则：单店标准报价规则 v1 · 缺失参数 2 项' }];
    const c = p.contract;
    if (!c.log) c.log = [{ t: '2026-09-07 09:10', title: '合同草稿创建', body: '模板 v2026.1 · 合同主体来自 CRM · 账期差异待处理', tone: 'gray' }];
    if (c.approvalApi == null) c.approvalApi = true;
    if (p.pest.result === undefined) p.pest.result = null;
    if (!p.service.flags) p.service.flags = { handoverMissing: false };
  }

  const srcTone = (s) => ({ CRM: 'info', 方案域: 'brand', 报价域: 'warn', 差异: 'danger' }[s] || 'gray');

  /* ============================================================
     p1-hub
     ============================================================ */
  const HUB = [
    { id: 'p1-quote', icon: 'yuan', tone: 'brand', title: '按类别报价', f: 'F09', sub: '规则计算 · 缺参数不出价 · 成本 / 毛利分权', need: 'LBS 成本核算逻辑、单店标准报价规则、审批权限配置' },
    { id: 'p1-commitments', icon: 'compare', tone: 'danger', title: '承诺—方案—报价—合同一致性', f: 'F10', sub: '逐项比对 · 差异状态 · 重要差异阻断提交', need: '承诺条目字段、文档抽取接口、授权例外流程' },
    { id: 'p1-contract', icon: 'contract', tone: 'info', title: '合同一键生成与审批接入', f: 'F11', sub: '一键生成 · 一键发起审批 · 请求 ID 去重', need: '标准合同模板、CRM 合同主体、审批发起 / 状态接口' },
    { id: 'p1-service', icon: 'truck', tone: 'warn', title: '履约 / 回款 / 续约摘要', f: 'F12', sub: '首服交接 · 服务状态 · 到期窗口 · 续约商机', need: '服务系统 / 财务系统摘要接口、到期窗口配置' },
    { id: 'p1-ka-card', icon: 'building', tone: 'violet', title: 'KA 客户经营卡', f: 'F12 / 6.5', sub: '关系覆盖 · 服务线空间 · 交付质量 · 续约风险（定性）', need: '集团—门店关系、服务线目录、客诉与合同数据' },
    { id: 'p1-pest', icon: 'bug', tone: 'ai', title: '虫害拍照辅助识别', f: 'F13', sub: '候选 / 未知 / 补拍 / 人工协助 · 不推定处置', need: '技术团队样本与审核知识、准确性验收阈值' },
  ];
  App.register('p1-hub', {
    title: 'P1 预览', tab: 'me',
    prd: ['5.2 交付包 B', '9 P1 详细功能需求', '11 系统集成与上线门槛', '16 实施顺序'],
    rules: ['P1 依赖接口 / 规则，首期不承诺', '每项能力单独设上线门槛', '未通过验收只开放人工辅助入口'],
    render() {
      return `
        ${ui().p1Banner()}
        <div class="hero dark">
          <div class="h-eyebrow">包 B / P1 · 预览</div>
          <div class="h-title" style="font-size:18px">报价合同闭环 · KA 经营 · 专业辅助</div>
          <div class="h-sub">依赖接口与规则，单独设上线门槛；本页各项均为能力边界演示</div>
          <div class="h-metrics"><div class="m"><div class="v">6</div><div class="l">能力项</div></div><div class="m"><div class="v">3</div><div class="l">外部接口依赖</div></div><div class="m"><div class="v">0</div><div class="l">首期承诺</div></div></div>
        </div>
        ${ui().section('能力清单', `<span class="tiny">点击进入演示</span>`)}
        <div class="list">
          ${HUB.map((h) => `<div class="cell pressable p1-hubcell" onclick="App.go('${h.id}')">
            <div class="cell-icon ${h.tone}">${App.icon(h.icon, 20)}</div>
            <div class="cell-body">
              <div class="cell-title p1-hubtitle">${App.esc(h.title)} ${ui().chip(h.f, 'outline', { sm: true })}</div>
              <div class="cell-sub">${App.esc(h.sub)}</div>
              <div class="p1-need">${App.icon('link', 11)}<span>需要：${App.esc(h.need)}</span></div>
            </div>
            <div class="cell-right">${App.icon('chevron-right', 16)}</div>
          </div>`).join('')}
        </div>
        ${ui().notice('gray', '上线门槛：每项 P1 能力分别评估接口、规则与验收阈值；只有状态查询而无发起接口的方案，不满足"不再切系统"的完整验收（PRD 11 / F11）。', 'shield')}
      `;
    },
  });

  /* ============================================================
     p1-quote  按类别报价
     ============================================================ */
  S._cat = null;
  function quoteCalc(q) {
    const bait = q.filled ? q.filled.bait : 0;
    const base = 12 * 260, first = 480, baitAmt = bait * 60, travel = 360;
    const total = base + first + baitAmt + travel;
    const taxIncl = q.filled && /含/.test(q.filled.tax);
    const shown = taxIncl ? Math.round(total * 1.06) : total;
    const cost = 12 * 195 + 360 + bait * 45 + 270;
    const margin = total > 0 ? (total - cost) / total : null;
    return { lines: [['月度服务费', '12 次 × ¥260', base], ['首次强化', '1 次', first], ['诱饵站', `${bait} 个 × ¥60`, baitAmt], ['人工 / 交通', '区域标准', travel]], total, shown, taxIncl, cost, margin };
  }
  const quoteStepIdx = (st) => ({ 草稿: 0, 待审批: 1, 已批准: 2, 已驳回: 2, 已失效: 3 }[st] ?? 0);
  const quoteChip = (st) => ui().chip(st, ({ 草稿: 'gray', 待审批: 'warn', 已批准: 'ok', 已驳回: 'danger', 已失效: 'gray' }[st] || 'gray'));

  App.register('p1-quote', {
    title: '按类别报价', tab: 'me',
    prd: ['F09 按类别报价', 'U11 修改已批准报价', '13.1 看成本 / 毛利'],
    rules: ['缺必需参数不出正式价格', '金额由规则计算，AI 仅解释', '成本 / 毛利仅审批角色可见', '关键参数修改产生新版本并重新审批', '未批准报价不能标成正式对客报价'],
    render(params) {
      ensure();
      const cat = S._cat || (params.oppId === 'o_ka1' ? 'factory' : 'single');
      const seg = `<div class="seg block mb12">${[['single', '单店'], ['chain', '连锁'], ['factory', '工厂']].map(([k, l]) => `<button class="${cat === k ? 'active' : ''}" onclick="S_P1.setCat('${k}')">${l}</button>`).join('')}</div>`;
      let body = '';
      if (cat === 'single') body = renderSingleQuote();
      else if (cat === 'chain') body = ui().empty({ icon: 'layers', title: '连锁规则待接入', sub: '先承接 LBS 单店标准报价，后扩展连锁规则（F09）；未接入前不出价' });
      else body = renderFactoryQuote();
      return `${ui().p1Banner()}${seg}${body}`;
    },
  });
  S.setCat = function (k) { S._cat = k; App.refresh(); };

  function renderSingleQuote() {
    const q = P().quote;
    const opp = App.opp(q.oppId); const st = opp && App.store(opp.storeId);
    const missing = q.params.filter((p) => !p.ok).map((p) => p.k);
    const complete = !missing.length && q.filled;
    const calc = complete ? quoteCalc(q) : null;
    const approved = q.status === '已批准';
    let result;
    if (!complete) {
      result = `<div class="card">
        <div class="card-title">报价结果</div>
        ${ui().notice('warn', `<b>未出正式价格</b> · 缺失：${App.esc(missing.join('、'))}`, 'alert')}
        <div class="small muted">金额由规则程序计算；AI 只负责解释与模板表达。缺失必需参数时不输出任何价格数字。</div>
        <div class="mt12">${ui().btn('补充参数', { block: true, icon: 'edit', onclick: 'S_P1.fillParams()' })}</div>
      </div>`;
    } else {
      result = `<div class="card">
        <div class="row between"><div class="card-title" style="margin:0">建议售价（规则计算）</div>${approved ? ui().chip('正式对客报价', 'brand', { sm: true, icon: 'check' }) : ui().chip('内部草稿 · 不可对客', 'gray', { sm: true })}</div>
        <div class="p1-price">${money(calc.shown)}<span class="u">/ 年（${calc.taxIncl ? '含税' : '未税'}）</span></div>
        <div class="tiny muted">${q.status === '草稿' ? '待提交审批' : q.status} · 规则：${App.esc(q.rule)} · v${q.version}${calc.taxIncl ? ' · 含税 = 未税 × 1.06（演示口径，须财务确认）' : ''}</div>
        <div class="divider"></div>
        <table class="table"><thead><tr><th>项目</th><th>口径</th><th class="r">金额</th></tr></thead><tbody>
          ${calc.lines.map(([k, d, v]) => `<tr><td>${App.esc(k)}</td><td class="muted">${App.esc(d)}</td><td class="r">${money(v)}</td></tr>`).join('')}
          <tr><td class="bold">合计（未税）</td><td></td><td class="r bold">${money(calc.total)}</td></tr>
        </tbody></table>
        <div class="mt12">${isApprover()
          ? `<div class="p1-margin"><div class="row between"><span class="bold">成本 / 毛利</span>${ui().chip('演示口径', 'warn', { sm: true })}</div>
              <div class="small mt4">同口径成本 <b>${money(calc.cost)}</b> · 毛利率 <b>${App.fmt.pct(calc.margin)}</b></div>
              <div class="tiny muted mt4">毛利率 =（同口径售价 ${money(calc.total)} − 同口径成本 ${money(calc.cost)}）÷ 同口径售价 ${money(calc.total)}；含税 / 未税、周期及成本项须财务确认；售价为 0 或不可比时不计算</div></div>`
          : `<div class="p1-lock">${App.icon('lock', 16)}<span>成本 / 毛利：仅审批角色可见</span></div>`}</div>
      </div>`;
    }
    const actions = [];
    if (q.status === '草稿') actions.push(ui().btn('提交审批', { block: true, icon: 'send', disabled: !complete, onclick: 'S_P1.submitQuote()' }));
    if (q.status === '待审批') {
      if (isApprover()) actions.push(`<div class="btn-row">${ui().btn('驳回', { tone: 'danger', onclick: 'S_P1.approveQuote(false)' })}${ui().btn('批准', { onclick: 'S_P1.approveQuote(true)' })}</div>`);
      actions.push(ui().btn('修改关键参数（产生新版本）', { tone: 'ghost', block: true, size: 'sm', icon: 'edit', onclick: 'S_P1.reviseQuote()' }));
    }
    if (q.status === '已批准') actions.push(ui().btn('修改关键参数（新版本重新审批）', { tone: 'ghost', block: true, size: 'sm', icon: 'edit', onclick: 'S_P1.reviseQuote()' }));
    if (q.status === '已驳回') actions.push(ui().btn('修改参数并重新提交', { tone: 'secondary', block: true, icon: 'edit', onclick: 'S_P1.reviseQuote()' }));
    return `
      <div class="card">
        <div class="row between"><div><div class="card-title" style="margin:0">${App.esc(st ? st.name : '')}</div><div class="card-sub">${App.esc(opp ? opp.service + ' · ' + opp.kind : '')} · ${App.esc(q.category)}</div></div>${opp ? ui().stageChip(opp.stage) : ''}</div>
        <div class="row mt8 gap6 wrap">${ui().chip(q.rule, 'outline', { sm: true, icon: 'template' })}${ui().chip('v' + q.version, 'gray', { sm: true })}</div>
      </div>
      ${ui().section('输入参数', `<span class="tiny">${q.params.filter((p) => p.ok).length}/${q.params.length} 已确认</span>`)}
      <div class="list">${q.params.map((p) => `<div class="form-item required ${p.ok ? '' : 'missing'}"><label>${App.esc(p.k)}</label><div class="fv ${p.ok ? '' : 'muted'}">${App.esc(p.v)}</div>${p.ok ? App.icon('check', 16, 'p1-okico') : ui().chip('缺参数', 'warn', { sm: true })}</div>`).join('')}</div>
      <div class="tiny muted mb12" style="padding:0 4px">${App.esc(q.note)}</div>
      ${result}
      <div class="card">
        <div class="row between"><div class="card-title" style="margin:0">报价状态</div>${quoteChip(q.status)}</div>
        ${ui().stepper(['草稿', '待审批', '已批准 / 已驳回', '已失效'], quoteStepIdx(q.status), { error: q.status === '已驳回' })}
        ${q.status === '已驳回' ? ui().notice('danger', `驳回原因：${App.esc(q.rejectReason || '未填写')} · 修改后重新走审批`, 'alert') : ''}
        ${actions.length ? `<div class="mt12 col gap6">${actions.join('')}</div>` : ''}
        <div class="tiny muted mt8">关键参数修改将产生新版本并重新审批，不能沿用原批准；未批准报价不能标成正式对客报价。</div>
      </div>
      ${q.history.length ? `${ui().section('版本记录')}<div class="card">${ui().timeline(q.history.map((h) => ({ time: h.t, title: App.esc(h.title), body: App.esc(h.body), tone: h.tone || '' })))}</div>` : ''}
      <div class="list">${ui().cell({ title: 'KA 报价示例 · 华信食品张江工厂', sub: '成本核算表 v2 · 待审批 · 成本行按权限锁定', icon: 'building', iconTone: 'violet', onclick: "S_P1.setCat('factory')" })}</div>
    `;
  }
  function renderFactoryQuote() {
    const k = P().kaQuote;
    const opp = App.opp(k.oppId); const st = opp && App.store(opp.storeId);
    const approver = isApprover();
    const cost = 61200, price = 86400;
    return `
      ${ui().notice('warn', '工厂 / 连锁规则待接入：先承接 LBS 现有成本核算逻辑及单店标准报价，后扩展连锁、工厂规则（F09）。以下为 KA 报价审批示例。', 'alert')}
      <div class="card">
        <div class="row between"><div><div class="card-title" style="margin:0">${App.esc(st ? st.name : '')}</div><div class="card-sub">${App.esc(k.category)} · ${App.esc(opp ? opp.service : '')} · 提交 ${App.esc(k.submittedAt)}</div></div>${quoteChip(k.status)}</div>
        <div class="row mt8 gap6 wrap">${ui().chip(k.rule, 'outline', { sm: true, icon: 'template' })}${ui().chip(k.version, 'gray', { sm: true })}</div>
        <div class="divider"></div>
        ${k.lines.map((l) => l.locked
          ? (approver
            ? `<div class="p1-line"><span class="k">${App.esc(l.k)}</span><span class="v">${l.k.includes('毛利') ? `${App.fmt.pct((price - cost) / price)} <span class="tiny muted">=（${money(price)} − ${money(cost)}）÷ ${money(price)}</span>` : money(cost)} ${ui().chip('演示口径', 'warn', { sm: true })}</span></div>`
            : `<div class="p1-line"><span class="k">${App.esc(l.k)}</span><span class="v muted">${App.icon('lock', 14)} 仅审批人可见</span></div>`)
          : `<div class="p1-line"><span class="k">${App.esc(l.k)}</span><span class="v">${App.esc(l.v)}</span></div>`).join('')}
        <div class="tiny muted mt8">不预置 LBS 未提供的成本或毛利线；成本核算表口径由 LBS 提供，演示数值仅占位。</div>
      </div>
      ${ui().section('审批进度')}
      <div class="card">
        ${ui().timeline(k.approvals.map((a) => ({ time: a.at || '进行中', title: `${App.esc(a.who)} ${ui().chip(a.status, a.status === '已批准' ? 'ok' : 'warn', { sm: true })}`, tone: a.status === '已批准' ? '' : 'warn' })))}
        <div class="tiny muted">按额度 / 服务 / 组织授权的审批人在小程序内审批；非本系统权限的审批人不可代批。</div>
      </div>
      <div class="list">${ui().cell({ title: '查看商机推进卡', sub: '华信张江工厂 · 报价商务 · 80%', icon: 'trend', onclick: `App.go('opportunity',{id:'${k.oppId}'})` })}${ui().cell({ title: '承诺一致性核对', sub: '一年两次风险勘查未计入报价 v2', icon: 'compare', iconTone: 'danger', onclick: "App.go('p1-commitments',{oppId:'o_ka1'})" })}</div>
    `;
  }
  S.fillParams = function () {
    App.prompt('诱饵站数量（勘查确认）', '例如：12（个）', (v1) => {
      const n = parseInt(v1, 10);
      const bait = n > 0 ? n : 12;
      App.prompt('税口径（财务确认）', '未税 / 含税（默认未税）', (v2) => {
        const tax = /含/.test(v2 || '') ? '含税' : '未税';
        const q = P().quote;
        q.filled = { bait, tax };

  App.register('p1-pest', {
    title: '虫害辅助识别', tab: 'me',
    prd: ['F13 虫害拍照辅助识别', 'U13 模糊 / 未支持虫害照片'],
    rules: ['返回候选、依据、图片质量、知识来源', '无法识别明确返回未知，不强制唯一答案', '习性 / 来源 / 危害仅引用审核知识库', '照片不推定侵害程度、服务频次或报价', '候选不自动写成已确认勘查结论'],
    render() {
      ensure();
      const pest = P().pest;
      const cur = pest.result ? pest.samples.find((s) => s.id === pest.result) : null;
      const tiles = pest.samples.map((s) => `<div class="p1-sample pressable ${cur && cur.id === s.id ? 'sel' : ''}" onclick="S_P1.identify('${s.id}')">${ui().scene(s.kind, s.label)}<div class="p1-sample-foot"><span>${cur && cur.id === s.id ? '已识别' : '点击识别'}</span>${App.icon(cur && cur.id === s.id ? 'check-circle' : 'scan', 14)}</div></div>`).join('');
      let result = '';
      if (cur && !cur.unknown) {
        result = `
          <div class="ai-card">
            <div class="ai-head"><div class="ai-logo">${App.icon('sparkle', 15)}</div><div class="grow"><div class="t">候选识别结果</div><div class="m">派生数据 · 不写入勘查结论 · ${App.esc(cur.label)}</div></div>${ui().chip('候选', 'ai', { sm: true })}</div>
            <div class="ai-body">
              ${cur.candidates.map((c) => `<div class="p1-conf"><span class="n">${App.esc(c.name)}</span><div class="b"><i style="width:${Math.round(c.conf * 100)}%"></i></div><span class="p">${Math.round(c.conf * 100)}%</span></div>`).join('')}
              ${ui().kv([['判断依据', App.esc(cur.basis)], ['图片质量', ui().chip(cur.quality, 'ok', { sm: true })], ['建议补充', App.esc(cur.knowledge.advice)]])}
            </div>
            <div class="ai-note">${App.icon('info', 12)}候选识别 · 非勘查结论 · 专业处置由技术复核</div>
          </div>
          <div class="card">
            <div class="row between"><div class="card-title" style="margin:0">审核知识引用</div>${ui().chip('已发布', 'brand', { sm: true })}</div>
            ${ui().kv([['习性', App.esc(cur.knowledge.habits)], ['危害', App.esc(cur.knowledge.harm)], ['来源', `${App.icon('doc', 12)} ${App.esc(cur.knowledge.source)}`]])}
            <div class="tiny muted mt8">仅引用审核知识库；不据此推定侵害程度、服务频次或报价。</div>
          </div>
          <div class="btn-row">${ui().btn('加入拜访记录（作为候选）', { tone: 'secondary', size: 'sm', icon: 'plus', onclick: 'S_P1.addCandidate()' })}${ui().btn('申请技术复核', { size: 'sm', icon: 'coach', onclick: 'S_P1.techReview()' })}</div>`;
      } else if (cur && cur.unknown) {
        result = `
          <div class="card p1-unknown">
            <div class="row between"><div class="card-title" style="margin:0">无法识别（未知）</div>${ui().chip('未知', 'gray', { sm: true, icon: 'question' })}</div>
            ${ui().kv([['图片质量', ui().chip(cur.quality, 'warn', { sm: true })], ['候选', '<span class="muted">不强制给出唯一答案</span>']])}
            ${ui().notice('gray', App.esc(cur.advice), 'camera')}
            <div class="btn-row">${ui().btn('补拍', { tone: 'secondary', size: 'sm', icon: 'camera', onclick: 'S_P1.retake()' })}${ui().btn('人工协助', { size: 'sm', icon: 'hand', onclick: 'S_P1.humanHelp()' })}</div>
          </div>`;
      }
      return `
        ${ui().p1Banner('包 B / P1 预览 · 受控试点：技术团队提供样本与审核知识，验收未通过只开放人工辅助入口')}
        <div class="card">
          <div class="row between"><div class="card-title" style="margin:0">拍照识别（受控试点）</div>${ui().chip('人工辅助', 'ai', { sm: true, icon: 'sparkle' })}</div>
          <div class="small muted">候选识别 · 非勘查结论 · 专业处置由技术复核</div>
          <div class="p1-ctx mt8">${App.icon('store', 13)}<span>关联客户：金牌烤鸭店 · 方案沟通（共享客户上下文，不自动写入勘查结论）</span></div>
        </div>
        ${ui().section('样本照片', `<span class="tiny">点击运行识别</span>`)}
        <div class="grid2 mb12">${tiles}</div>
        ${result || ui().empty({ icon: 'bug', title: '选择一张样本照片', sub: '识别只返回候选与依据；无法识别时明确返回未知' })}
        ${ui().notice('warn', '照片不推定现场侵害程度、服务频次或报价；候选识别不自动写成已确认勘查结论。', 'alert')}
      `;
    },
    demoActions: [{ label: '清除识别结果', icon: 'refresh', run() { P().pest.result = null; App.save(); App.refresh(); } }],
  });
  S.identify = function (id) {
    const close = App.loading('识别中…');
    setTimeout(() => { close(); P().pest.result = id; App.save(); App.refresh(); }, 1000);
  };
  S.addCandidate = function () { App.toast('已作为候选写入拜访草稿 · 不是已确认勘查结论', { icon: 'edit', duration: 2200 }); };
  S.techReview = function () {
    const cur = P().pest.samples.find((s) => s.id === P().pest.result);
    const top = cur && cur.candidates[0];
    App.go('tech-request', { q: `虫害候选识别复核：${top ? top.name + ' ' + Math.round(top.conf * 100) + '%' : ''}（${cur ? cur.label : ''}）` });
  };
  S.retake = function () { App.toast('请靠近目标、打光后补拍（演示）', { icon: 'camera' }); };
  S.humanHelp = function () { App.go('tech-request', { q: '虫害照片无法识别（仓库 · 模糊），申请人工协助' }); };
})();

</script>
<script>App.boot();</script>
</body>
</html>
