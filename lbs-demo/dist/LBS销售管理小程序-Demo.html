.tdy-fix .cell-sub .chip { vertical-align: -5px; margin-right: 2px; }
.tdy-empty .empty { padding: 18px 16px; }
.tdy-empty .empty .ico { width: 42px; height: 42px; border-radius: 13px; margin-bottom: 8px; }
.tdy-empty .empty .ico svg { width: 22px; height: 22px; }
.tdy-empty .empty .t { font-size: 14px; }
.tdy-empty .empty .s { font-size: 12px; }
.tdy-caption { display: flex; align-items: flex-start; gap: 5px; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; padding: 0 4px; margin: -4px 0 14px; }
.tdy-caption svg { flex: none; margin-top: 3px; }
.tdy-caption.center { justify-content: center; margin-top: 6px; }
.cell .cell-sub .fact-tag { vertical-align: 1px; }
`;
  if (typeof App.css === 'function') App.css('tdy', CSS);
  else { const st = document.createElement('style'); st.id = 'css-tdy'; st.textContent = CSS; document.head.appendChild(st); }

  /* ---------- 工具 ---------- */
  const esc = (s) => App.esc(s);
  const TODAY = () => App.TODAY;
  const uiState = () => { App.state.ui = App.state.ui || {}; return App.state.ui; };
  const isActive = (t) => t.status === 'todo' || t.status === 'doing';
  const pad = (x) => String(x).padStart(2, '0');
  const addDays = (s, n) => { const d = App.dayjs(s); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const APPT_TYPES = ['约访', '勘查'];
  const TYPE_ICON = { 约访: 'calendar', 勘查: 'search', 回访: 'history', 陌拜: 'map-pin', 商务: 'briefcase', 承诺核对: 'contract', 辅导: 'coach', 客诉跟进: 'alert', 方案: 'doc' };
  const COOP = { active: '服务中', paused: '停做', none: '未合作' };
  const DATA_UPDATED = '09:30';
  // 通知归属（data.js 的通知无 ownerId；已知样本按门店/拜访归属推断，未知的对所有角色可见；主管看全部）
  const NOTIF_OWNER = { n1: 'u_dj', n2: 'u_dj', n3: 'u_dj' };

  /* ---------- 取数（按当前角色） ---------- */
  T.myTasks = () => App.state.tasks.filter((t) => t.ownerId === App.me().id);
  T.myStores = () => App.state.stores.filter((s) => s.perm === 'full' && (App.isMgr() || s.ownerId === App.me().id));
  T.notifs = function () {
    const me = App.me();
    return (App.state.notifications || []).filter((n) => {
      if (App.isMgr()) return true;
      const st = n.storeId ? App.store(n.storeId) : null;
      const owner = n.ownerId || NOTIF_OWNER[n.id] || (st && st.ownerId) || null;
      return !owner || owner === me.id;
    });
  };
  T.risks = function () {
    const me = App.me(); const out = []; const seen = {};
    App.state.stores.forEach((s) => {
      if (!(App.isMgr() || s.ownerId === me.id) || !s.complaint) return;
      if (s.complaint.status === 'open') { seen[s.id] = 1; out.push({ kind: 'open', order: 0, store: s }); }
      else if (s.complaint.status === 'stale') { seen[s.id] = 1; out.push({ kind: 'stale', order: 2, store: s }); }
    });
    T.notifs().filter((n) => n.kind === 'risk' && !(n.storeId && seen[n.storeId])).forEach((n) => out.push({ kind: 'notif', order: 1, n, store: n.storeId ? App.store(n.storeId) : null }));
    return out.sort((a, b) => a.order - b.order);
  };
  T.data = function () {
    const me = App.me(), today = TODAY(), horizon = addDays(today, 2);
    const mine = T.myTasks();
    const appts = mine.filter((t) => t.due === today && APPT_TYPES.includes(t.type) && t.status !== 'cancelled')
      .sort((a, b) => ((a.time || '') < (b.time || '') ? -1 : 1));
    const apptIds = appts.map((t) => t.id);
    const overdue = mine.filter((t) => isActive(t) && t.due < today).sort((a, b) => (a.due < b.due ? -1 : 1));
    const todos = mine.filter((t) => isActive(t) && t.due >= today && t.due <= horizon && !apptIds.includes(t.id))
      .sort((a, b) => (a.due !== b.due ? (a.due < b.due ? -1 : 1) : ((a.time || '') < (b.time || '') ? -1 : 1)));
    const pending = App.state.visits.filter((v) => v.status === 'pending_confirm' && v.by === me.name);
    return { appts, overdue, todos, pending, risks: T.risks(), unread: T.notifs().filter((n) => !n.read).length };
  };

  /* ---------- 片段 ---------- */
  const link = (label, onclick) => `<span class="tdy-link" onclick="${onclick}">${esc(label)}${App.icon('chevron-right', 14)}</span>`;
  const compactEmpty = (icon, title, sub) => `<div class="list tdy-empty">${App.ui.empty({ icon, title, sub })}</div>`;
  const greeting = () => '早上好'; // 演示时刻固定 09:41

  function hero(d) {
    const me = App.me();
    const metrics = [
      { v: d.appts.length, l: '今日约访' }, { v: d.overdue.length, l: '超期回访', warn: d.overdue.length > 0 },
      { v: d.pending.length, l: '待确认', warn: d.pending.length > 0 }, { v: d.todos.length, l: '今日待办' },
    ];
    return `<div class="hero tdy-hero">
      <div class="tdy-bell" onclick="App.go('notifications')" aria-label="通知">${App.icon('bell', 20)}${d.unread ? `<span class="n">${d.unread}</span>` : ''}</div>
      <div class="h-eyebrow">${esc(App.fmt.mdw(TODAY()))} · ${esc(me.org)}</div>
      <div class="h-title">${greeting()}，${esc(me.name)}</div>
      <div class="h-sub">${esc(me.scope)}</div>
      <div class="h-metrics">${metrics.map((m) => `<div class="m ${m.warn ? 'warn' : ''}"><div class="v">${m.v}</div><div class="l">${esc(m.l)}</div></div>`).join('')}</div>
      <div class="tdy-foot"><span>${App.icon('refresh', 11)}数据更新 ${DATA_UPDATED} · 演示数据</span><span>${esc(me.roleName)}</span></div>
    </div>`;
  }
  function quickGrid() {
    const q = (label, icon, tone, onclick) => `<div class="quick" onclick="${onclick}"><div class="qi ${tone}">${App.icon(icon, 20)}</div>${esc(label)}</div>`;
    return `<div class="quick-grid tdy-quick">${q('记录拜访', 'camera', 'brand', 'S_TODAY.pickStore()')}${q('选街道', 'road', 'info', "App.tab('customers')")}${q('工作助手', 'sparkle', 'ai', "App.tab('assistant')")}${q('我的任务', 'list', 'warn', "App.go('tasks')")}</div>`;
  }

  function riskCell(r) {
    const s = r.store || {};
    const go = s.id ? `App.go('customer',{id:'${s.id}'})` : '';
    if (r.kind === 'open') {
      const c = s.complaint || {};
      return App.ui.cell({
        title: esc(s.name), badge: App.ui.chip('未结客诉', 'danger', { sm: true, icon: 'alert' }),
        sub: `<span class="tdy-em">先了解/协调服务问题</span> · ${esc(c.summary || '')}<div class="tiny muted mt4">${esc(c.source || '')} · 未结客诉期间不建立额外收费商机</div>`,
        icon: 'alert', iconTone: 'danger', onclick: go,
      });
    }
    if (r.kind === 'stale') {
      const c = s.complaint || {};
      return App.ui.cell({
        title: esc(s.name), badge: App.ui.chip('数据待更新', 'warn', { sm: true, icon: 'clock' }),
        sub: `客诉数据最近同步 ${esc(App.fmt.md(c.date))}，回访前先核实${s.lastVisit && s.lastVisit.result ? ` · ${esc(s.lastVisit.result)}` : ''}`,
        icon: 'clock', iconTone: 'warn', onclick: go,
      });
    }
    return App.ui.cell({ title: esc(r.n.title), sub: esc(r.n.body), icon: 'alert', iconTone: 'danger', right: `<span class="tiny">${esc(r.n.time || '')}</span>`, onclick: go || "App.go('notifications')" });
  }

  function apptCell(t) {
    const st = App.store(t.storeId) || {};
    const done = t.status === 'done';
    const who = st.appointment && st.appointment.with ? ` · ${esc(st.appointment.with)}` : '';
    const sub = done
      ? `${esc(t.title)} · ${esc(App.fmt.hm(t.doneAt) || '')} 已确认拜访记录${st.lastVisit && st.lastVisit.result ? `<div class="tiny muted mt4">${esc(st.lastVisit.result)}</div>` : ''}`
      : `${esc(t.title)}${who}${st.address ? `<div class="tiny muted mt4">${App.icon('map-pin', 11)} ${esc(st.address)}${t.reason ? ` · ${esc(t.reason)}` : ''}</div>` : ''}`;
    const badge = done ? App.ui.chip('已完成', 'ok', { sm: true, icon: 'check' }) : App.ui.chip(t.source || t.type, 'outline', { sm: true });
    return `<div class="cell pressable" onclick="App.go('task',{id:'${t.id}'})">
      <div class="tdy-time ${done ? 'done' : ''}">${done ? App.icon('check', 20) : esc(t.time || '全天')}</div>
      <div class="cell-body"><div class="cell-title row"><span class="ellipsis">${esc(st.name || t.title)}</span>${badge}</div><div class="cell-sub">${sub}</div></div>
      <div class="cell-right">${App.icon('chevron-right', 16)}</div></div>`;
  }
  function oppShortcut() {
    const o = App.opp('o_bing'); if (!o) return '';
    const confirmed = !!(App.state.demo && App.state.demo.oppConfirmed);
    const ai = o.ai || {};
    const sub = confirmed
      ? `已确认：${esc(o.stage)} · 分层 ${esc(App.tierLabel(o.tier))} · 下一步任务已生成（客户约定 9/15）`
      : `AI 建议 ${esc(App.tierLabel(o.tier))}→${esc(App.tierLabel(ai.tier || 50))} · ${esc(ai.stage || '需求确认')} · 置信度${esc(ai.confidence || '中')} · 待你确认，不改正式值`;
    return App.ui.cell({
      title: '商机推进卡 · 蜀香居川菜馆', sub, icon: 'sparkle', iconTone: confirmed ? '' : 'ai',
      badge: confirmed ? App.ui.chip('已确认', 'ok', { sm: true, icon: 'check' }) : App.ui.chip('AI 建议', 'ai', { sm: true, icon: 'sparkle' }),
      onclick: "App.go('opportunity',{id:'o_bing'})",
    });
  }
  function overdueCell(t) {
    const st = App.store(t.storeId) || {};
    const n = -App.fmt.days(t.due);
    const isComplaint = t.type === '客诉跟进';
    return App.ui.cell({
      title: esc(t.title), sub: `${esc(st.name || '')} · ${esc(t.source || '')}${t.reason ? ` · ${esc(t.reason)}` : ''}`,
      icon: isComplaint ? 'alert' : (TYPE_ICON[t.type] || 'history'), iconTone: isComplaint ? 'danger' : 'warn',
      right: App.ui.chip(`逾期${n}天`, 'danger', { sm: true }), onclick: `App.go('task',{id:'${t.id}'})`,
    });
  }
  function pendingCell(v) {
    const st = App.store(v.storeId) || {};
    const miss = v.aiMissing || [];
    const missTxt = miss.length ? `缺少：${esc(miss[0])}${miss.length > 1 ? ` 等 ${miss.length} 项` : ''}` : '请核对 AI 草稿';
    return App.ui.cell({
      title: esc(st.name || '拜访记录'), badge: App.ui.chip('待确认', 'warn', { sm: true }),
      sub: `${esc(v.type)} · ${esc(App.fmt.md(v.time))} ${esc(App.fmt.hm(v.time))} · ${App.ui.factTag('derived')} ${missTxt}`,
      icon: 'edit', iconTone: 'warn', onclick: `App.go('visit-confirm',{id:'${v.id}'})`,
    });
  }
  function todoCell(t) {
    const st = App.store(t.storeId) || {};
    const n = App.fmt.days(t.due);
    const isAI = t.source === 'AI建议';
    return App.ui.cell({
      title: esc(t.title),
      sub: `${isAI ? App.ui.chip('AI 建议 · 待确认', 'ai', { sm: true, icon: 'sparkle' }) + ' ' : ''}${esc(st.name || '')}${isAI ? '' : ` · ${esc(t.source || '')}`}${t.time ? ` · ${esc(t.time)}` : ''}`,
      icon: TYPE_ICON[t.type] || 'list', iconTone: isAI ? 'ai' : (n === 0 ? 'warn' : 'info'),
      right: App.ui.chip(App.fmt.dueLabel(t.due), n === 0 ? 'warn' : (n === 1 ? 'info' : 'gray'), { sm: true }),
      onclick: `App.go('task',{id:'${t.id}'})`,
    });
  }

  /* ---------- 今日工作台（我的） ---------- */
  function myBody() {
    const d = T.data();
    const rule = (App.state.settings && App.state.settings.revisitRule) || {};
    const visitConfirmed = !!(App.state.demo && App.state.demo.visitConfirmed);
    const noTasks = !d.appts.length && !d.overdue.length && !d.todos.length;
    let h = hero(d) + quickGrid();

    // 1. 服务风险提醒（未结客诉优先）
    h += App.ui.section('服务风险提醒', link('通知', "App.go('notifications')"));
    h += d.risks.length
      ? `<div class="list">${d.risks.slice(0, 3).map(riskCell).join('')}</div>`
      : compactEmpty('check-circle', '暂无服务风险提醒', '客诉数据来自服务系统 · 9/7 08:30 同步');

    if (noTasks) {
      h += App.ui.section('今日任务');
      h += `<div class="card">${App.ui.empty({
        icon: 'calendar', title: '今天没有安排的任务', sub: '从街道挑选客户开始拜访，或进入客户列表',
        action: `<div class="btn-row">${App.ui.btn('选街道', { tone: 'primary', size: 'sm', icon: 'road', onclick: "App.tab('customers');App.go('street-picker')" })}${App.ui.btn('客户列表', { tone: 'outline', size: 'sm', icon: 'store', onclick: "App.tab('customers')" })}</div>`,
      })}</div>`;
    } else {
      // 2. 今日约访
      h += App.ui.section('今日约访', `<span class="muted">${esc(App.fmt.mdw(TODAY()))}</span>`);
      h += (d.appts.length || visitConfirmed)
        ? `<div class="list">${d.appts.map(apptCell).join('')}${visitConfirmed ? oppShortcut() : ''}</div>`
        : compactEmpty('calendar', '今日无约访', '可从客户详情发起约访，或直接记录拜访');
      // 3. 超期回访
      h += App.ui.section('超期回访', link('全部超期', "App.go('tasks',{filter:'overdue'})"));
      h += d.overdue.length
        ? `<div class="list">${d.overdue.map(overdueCell).join('')}</div><div class="tdy-caption">${App.icon('info', 12)}回访日期优先级：客户约定 › 已接受任务 › 规则周期（${esc(rule.label || '演示规则')}）；改期需填写原因。</div>`
        : compactEmpty('check-circle', '没有超期回访', '规则型回访按演示规则生成，客户约定日期优先');
    }
    // 4. 待确认记录
    h += App.ui.section('待确认记录', d.pending.length ? link('草稿箱', "App.tab('me')") : '');
    h += d.pending.length
      ? `<div class="list">${d.pending.map(pendingCell).join('')}</div>`
      : compactEmpty('edit', '没有待确认记录', '拜访采集后的 AI 草稿会先在这里等待你确认');
    // 5. 今日待办
    if (!noTasks) {
      h += App.ui.section('今日待办', link('我的任务', "App.go('tasks')"));
      h += d.todos.length
        ? `<div class="list">${d.todos.map(todoCell).join('')}</div>`
        : compactEmpty('list', '近两天没有其他待办', '');
    }
    h += `<div class="tdy-caption center">${App.icon('shield', 12)}AI 建议为派生数据，仅在 AI 标识内出现；正式阶段/分层需人工确认后才改变</div>`;
    return `<div class="tdy-fix">${h}</div>`;
  }

  /* ---------- 团队工作台（主管） ---------- */
  const seg = (mode) => `<div class="seg block tdy-seg"><button class="${mode === 'my' ? 'active' : ''}" onclick="S_TODAY.mode('my')">我的</button><button class="${mode === 'team' ? 'active' : ''}" onclick="S_TODAY.mode('team')">团队</button></div>`;
  function teamBody(params, ctx) {
    if (window.S_TEAM && typeof window.S_TEAM.render === 'function') {
      try { return window.S_TEAM.render(params, ctx) || ''; } catch (e) { console.error(e); return App.ui.notice('danger', `团队工作台渲染失败：${esc(e.message)}`); }
    }
    return `<div class="tdy-fix"><div class="card">${App.ui.empty({ icon: 'users', title: '团队工作台尚未纳入演示', sub: '重点卡点 · 未跟进客户 · 任务完成 · 待复核 · 基础趋势（由 team.js 提供）' })}</div>`
      + App.ui.notice('info', '主管在"今日"切换"我的 / 团队"；团队数据按权限过滤，不显示未经授权的跨区数据。', 'shield') + '</div>';
  }
  T.mode = function (m) {
    uiState().todayMode = m === 'team' ? 'team' : 'my';
    App.save(); App.refresh(); App.scrollTop();
  };

  /* ---------- 交互 ---------- */
  T.pickStore = function () {
    const today = TODAY();
    const isAppt = (s) => !!(s.appointment && s.appointment.date === today);
    const stores = T.myStores().slice().sort((a, b) => (isAppt(a) ? 0 : 1) - (isAppt(b) ? 0 : 1));
    const items = stores.slice(0, 8).map((s) => ({
      label: s.name, icon: 'store',
      sub: [s.street || '待补地址', COOP[s.coop] || '未合作', s.lastVisit ? `最近拜访 ${App.fmt.rel(s.lastVisit.date)}` : '未拜访'].join(' · '),
      right: isAppt(s) ? `今日 ${s.appointment.time} 约访` : '',
      onSelect: () => App.go('visit-capture', { storeId: s.id }),
    }));
    items.push({ label: '更多客户…', icon: 'search', sub: '到客户列表按街道查找', onSelect: () => App.tab('customers') });
    App.sheet({ title: '选择门店记录拜访', items });
  };
  T.addOverdueDemo = function () {
    const me = App.me(); const s = App.state; const rule = (s.settings && s.settings.revisitRule) || {};
    const cands = s.opportunities.filter((o) => o.ownerId === me.id && [20, 50, 80].includes(o.tier) && !['已赢单', '已丢单', '暂停培育'].includes(o.stage));
    for (const o of cands) {
      // F05：已有未结任务不复制新任务；同一商机同一周期规则型任务去重
      if (s.tasks.find((t) => t.oppId === o.id && isActive(t))) continue;
      const cycle = rule[o.tier] || 7;
      let due = addDays(o.updatedAt || TODAY(), cycle); if (due >= TODAY()) due = addDays(TODAY(), -1);
      const st = App.store(o.storeId) || {};
      s.tasks.unshift({
        id: App.uid('t_rule'), storeId: o.storeId, oppId: o.id, title: `回访：${st.name || ''}（${o.service} · ${o.kind}）`, type: '回访',
        ownerId: me.id, ownerName: me.name, due, status: 'todo', source: '规则型',
        reason: `${App.tierLabel(o.tier)} 分层 · ${cycle} 天周期（演示规则）`, evidence: [`商机分层 ${App.tierLabel(o.tier)} · ${o.tierSource || ''}`],
        expected: '完成有效跟进后关闭提醒并开启下一周期', overdue: true, demo: true,
      });
      App.save(); App.refresh();
      App.toast(`已生成规则型超期回访：${st.name || ''}`, { icon: 'clock' });
      return;
    }
    App.toast('本周期内相关商机已有未结任务，按去重规则不重复生成', { icon: 'info', duration: 2600 });
  };

  App.register('today', {
    tab: 'today',
    nav() { return { title: App.isMgr() && uiState().todayMode === 'team' ? '团队工作台' : '今日工作台' }; },
    prd: ['7 页面表·今日工作台', '7 页面表·团队工作台（主管切换）', 'F05 回访任务与提醒', 'F08 团队管理与问数'],
    rules: ['未结客诉优先：先了解/协调服务问题', '客户约定日期 › 任务日期 › 规则周期（演示规则）', '已有未结任务不复制；同商机同周期去重', '无任务显示选街道与客户入口', 'AI 派生仅在 AI 标识内出现'],
    demoActions: [
      { label: '新增一条超期回访（演示）', icon: 'clock', run() { T.addOverdueDemo(); } },
      { label: '模拟蜀香居拜访已确认（演示）', icon: 'check-circle', run() {
        if (App.state.role !== 'dj') { App.toast('请先切换为地推销售（刘晓芸）', { icon: 'user' }); return; }
        window.DATA.ensureDemoVisit(App.state, true); App.save(); App.refresh();
        App.toast('蜀香居拜访已确认 · 商机推进卡待确认', { icon: 'check-circle' });
      } },
    ],
    render(params, ctx) {
      const mgr = App.isMgr();
      const mode = mgr ? (uiState().todayMode === 'team' ? 'team' : 'my') : 'my';
      let h = mgr ? seg(mode) : '';
      h += mode === 'team' ? teamBody(params, ctx) : myBody();
      return h;
    },
    mount(rootEl, params, ctx) {
      if (App.isMgr() && uiState().todayMode === 'team' && window.S_TEAM && typeof window.S_TEAM.mount === 'function') {
        try { window.S_TEAM.mount(rootEl, params, ctx); } catch (e) { console.error(e); }
      }
    },
  });

  /* ---------- 通知 ---------- */
  const KIND = { risk: ['alert', 'danger'], confirm: ['edit', 'warn'], sync: ['cloud-off', 'gray'], task: ['clock', 'brand'], review: ['compare', 'ai'] };
  function notifCell(n) {
    const [icon, tone] = KIND[n.kind] || ['bell', 'info'];
    return App.ui.cell({
      title: esc(n.title), badge: n.read ? '' : App.ui.chip('未读', 'danger', { sm: true }),
      sub: `${esc(n.body || '')}<div class="tiny muted mt4">${esc(n.time || '')}</div>`,
      icon, iconTone: tone, onclick: `S_TODAY.openNotif('${n.id}')`,
    });
  }
  T.openNotif = function (id) {
    const n = (App.state.notifications || []).find((x) => x.id === id); if (!n) return;
    n.read = true; App.save();
    if (n.kind === 'risk' && n.storeId) return App.go('customer', { id: n.storeId });
    if (n.kind === 'confirm' && n.visitId) return App.go('visit-confirm', { id: n.visitId });
    if (n.kind === 'sync') return App.go('sync-center');
    if (n.kind === 'task' && n.taskId) return App.go('task', { id: n.taskId });
    if (n.kind === 'review' && n.oppId) return App.go('opportunity', { id: n.oppId });
    App.refresh();
  };
  T.readAll = function () { T.notifs().forEach((n) => { n.read = true; }); App.save(); App.refresh(); App.toast('已全部标为已读', { icon: 'check' }); };
  T.pushDemoNotif = function () {
    const me = App.me();
    (App.state.notifications = App.state.notifications || []).unshift({ id: App.uid('n'), kind: 'task', title: '回访提醒：金牌烤鸭店 明天到期', body: '客户承诺周二前回复方案反馈（客户约定日期优先于规则周期）', taskId: 't_jinpai', time: '刚刚', ownerId: me.id });
    App.save(); App.refresh(); App.toast('已推送一条任务提醒（演示）', { icon: 'bell' });
  };
  App.register('notifications', {
    title: '通知', tab: 'today',
    prd: ['F05 回访任务与提醒', '7 页面表·今日工作台'],
    rules: ['工作台始终显示任务，通知失败不丢任务', '未结客诉优先提示', '外部通知需渠道/授权/组织配置允许'],
    demoActions: [{ label: '模拟一条任务提醒（演示）', icon: 'bell', run() { T.pushDemoNotif(); } }],
    render() {
      const list = T.notifs();
      const unread = list.filter((n) => !n.read).length;
      let h = App.ui.notice('info', '工作台始终显示任务；外部通知仅在渠道能力、用户授权与组织配置允许时发送，送达失败不影响任务。', 'bell');
      h += App.ui.section('提醒', unread ? link('全部已读', 'S_TODAY.readAll()') : '', unread ? `${unread} 条未读` : `共 ${list.length} 条`);
      h += list.length ? `<div class="list">${list.map(notifCell).join('')}</div>` : compactEmpty('bell', '暂无通知', '任务到期、服务风险与待确认记录会在这里提醒');
      h += App.ui.section('设置');
      h += `<div class="list">${App.ui.cell({ title: '通知设置', sub: '任务提醒 · 服务风险 · 外部渠道', icon: 'settings', iconTone: 'gray', onclick: "App.go('settings-notify')" })}${App.ui.cell({ title: '同步与上传异常', sub: '失败任务可在此重试', icon: 'sync', iconTone: 'info', onclick: "App.go('sync-center')" })}</div>`;
      return `<div class="tdy-fix">${h}</div>`;
    },
  });
})();

</script>
<script>
/* ============================================================
   客户列表 · 街道模式（customers）+ 街道选择（street-picker）
   PRD 7 页面表「客户列表／街道模式」· F01 · F02
   ============================================================ */
(function () {
  'use strict';
  const esc = App.esc;
  const NEEDS = '待补地址';
  // 演示补充：一条暂无客户的街道，用于展示空态（不改 data.js）
  const EXTRA_STREETS = [{ id: 'st_5', name: '科苑路', district: '浦东新区', city: '上海' }];

  App.css('cus', `
    .cus-seg { margin-bottom: 10px; }
    .cus-street { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid rgba(17,24,39,.04); box-shadow: var(--shadow-xs); margin-bottom: 10px; text-align: left; }
    .cus-street .ci { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
    .cus-street .t { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .cus-street .s { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; }
    .cus-street .sw { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); color: var(--brand); flex: none; }
    .cus-search { margin-bottom: 6px; }
    .cus-search .clr { display: flex; color: var(--ink-4); }
    .cus-card { padding: 12px 14px; margin-bottom: 10px; }
    .cus-card .hd { display: flex; align-items: flex-start; gap: 8px; }
    .cus-card .hd > svg { flex: none; margin-top: 3px; color: var(--ink-4); }
    .cus-card .nm { font-size: 15.5px; font-weight: 700; line-height: 1.3; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .cus-card .nm .chip { flex: none; }
    .cus-card .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .cus-card .chips { margin-top: 8px; }
    .cus-card .kv2 { display: grid; grid-template-columns: 58px 1fr; gap: 4px 8px; font-size: 12.5px; margin-top: 8px; line-height: 1.4; }
    .cus-card .kv2 .k { color: var(--ink-3); }
    .cus-card .kv2 .v { color: var(--ink-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cus-card .kv2 .v.due { color: #b91c1c; font-weight: 600; }
    .cus-card .kv2 .v.today { color: var(--brand-3); font-weight: 600; }
    .cus-card .ft { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 9px; border-top: .5px solid var(--line); }
    .cus-card .own { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
    .cus-card .own .up { color: var(--ink-3); font-size: 11px; white-space: nowrap; }
    .cus-appt { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 10px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-3); font-size: 12.5px; font-weight: 600; }
    .cus-appt.done { background: var(--ok-soft); color: #15803d; }
    .cus-warn { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: var(--warn-soft); color: #92400e; font-size: 12px; font-weight: 500; }
    .cus-warn svg { flex: none; }
    .cus-min .lock { width: 36px; height: 36px; border-radius: 10px; background: var(--gray-soft); color: var(--ink-3); display: flex; align-items: center; justify-content: center; flex: none; }
    .cus-min .msg { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 10px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); font-size: 12.5px; }
    .cus-min .msg svg { flex: none; color: var(--ink-3); }
    .cus-needs { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border-radius: var(--radius-lg); border: 1px dashed var(--line-2); margin: 4px 0 10px; }
    .cus-needs .ni { width: 34px; height: 34px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); display: flex; align-items: center; justify-content: center; flex: none; }
    .cus-mine { display: flex; align-items: center; gap: 10px; }
    .cus-count { font-size: 11px; color: var(--ink-3); margin: -2px 2px 8px; }
    .cus-empty .btn { margin: 0 auto; }
    .sp-city { display: flex; gap: 8px; margin-top: 8px; }
    .sp-city .pick { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 10px; background: var(--surface-3); font-size: 13px; font-weight: 600; color: var(--ink); }
    .sp-cnt { font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  `);

  const S = window.S_CUS = { q: '' };
  const U = () => (App.state.ui = App.state.ui || {});
  const allStreets = () => (App.state.streets || []).concat(EXTRA_STREETS);
  const streetMeta = (name) => allStreets().find((s) => s.name === name) || { name, district: '浦东新区', city: '上海' };
  const ownerOf = (st) => Object.values(App.state.users).find((u) => u.id === st.ownerId) || { name: st.ownerName || '—' };
  const isMine = (st) => st.ownerId === App.me().id;
  const stStores = (street) => (street === NEEDS ? App.state.stores.filter((s) => s.needsAddress) : App.state.stores.filter((s) => s.street === street));
  const myStores = () => (App.isMgr() ? App.state.stores.filter((s) => s.perm !== 'minimal') : App.state.stores.filter(isMine));
  const todoTasks = (st) => App.tasksOf(st.id).filter((t) => t.status === 'todo').sort((a, b) => ((a.due + (a.time || '')) < (b.due + (b.time || '')) ? -1 : 1));
  const nextTask = (st) => todoTasks(st)[0] || null;
  const apptToday = (st) => !!(st.appointment && st.appointment.date === App.TODAY);
  const visitedToday = (st) => !!(st.lastVisit && st.lastVisit.date === App.TODAY);
  const daysAgo = (st) => (st.lastVisit ? -App.fmt.days(st.lastVisit.date) : null);
  const recent7 = (st) => !!st.lastVisit && daysAgo(st) >= 0 && daysAgo(st) <= 7;
  // 重复拜访提示：近 7 天内本人到店（电话触达不算），风险提示、不阻断
  const repeatRisk = (st) => st.perm !== 'minimal' && !!st.lastVisit && st.lastVisit.by === App.me().name && daysAgo(st) > 0 && daysAgo(st) <= 7 && st.lastVisit.type !== '电话';
  const shortMd = (d) => (d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : '');
  const shortDt = (d) => (d ? shortMd(d) + (d.length > 10 ? ' ' + d.slice(11, 16) : '') : '');
  S.repeatRisk = repeatRisk;
  S.daysAgo = daysAgo;

  const FILTERS = [
    { id: 'all', label: '全部', test: () => true },
    { id: 'active', label: '服务中', test: (s) => s.coop === 'active' },
    { id: 'paused', label: '停做', test: (s) => s.coop === 'paused' },
    { id: 'recent', label: '近期拜访(7天)', test: (s) => s.perm !== 'minimal' && recent7(s) },
    { id: 'complaint', label: '未结客诉', test: (s) => !!s.complaint && s.complaint.status === 'open' },
    { id: 'new', label: '新录入·新开店', test: (s) => !!(s.isNewEntry || s.isNewOpen) },
    { id: 'untouched', label: '待触达', test: (s) => s.perm !== 'minimal' && App.oppsOf(s.id).some((o) => o.stage === '待触达') },
    { id: 'noperm', label: '无权查看', test: (s) => s.perm === 'minimal' },
  ];
  const rank = (s) => (apptToday(s) ? 0 : s.coop === 'active' ? 1 : s.perm === 'minimal' ? 3 : 2);

  /* ---------- 当前街道 / 模式 ---------- */
  function current(params, ctx) {
    const ui = U();
    if (params && params.street && ctx && ctx.entry && !ctx.entry._streetApplied) { ctx.entry._streetApplied = true; ui.street = params.street; ui.custMode = 'street'; App.save(); }
    if (!ui.street) ui.street = '一马路';
    return ui.street;
  }
  const mode = () => (U().custMode === 'mine' ? 'mine' : 'street');
  const baseList = () => (mode() === 'mine' ? myStores() : stStores(U().street || '一马路'));

  /* ---------- 片段 ---------- */
  function taskLabel(t) {
    const n = App.fmt.days(t.due);
    const when = n === 0 ? '今日' : n === 1 ? '明天' : n < 0 ? `逾期${-n}天` : App.fmt.md(t.due);
    const cls = n < 0 ? 'due' : n === 0 ? 'today' : '';
    return `<span class="v ${cls}">${esc(when)}${t.time ? ' ' + esc(t.time) : ''} ${esc(t.type)} · ${esc(t.title)}</span>`;
  }
  function apptHtml(st) {
    const a = st.appointment;
    if (visitedToday(st)) return `<div class="cus-appt done">${App.icon('check-circle', 14)}<span>今日 ${esc(a.time)} 约访已到店 · 拜访事实已确认</span></div>`;
    return `<div class="cus-appt">${App.icon('calendar', 14)}<span>今日 ${esc(a.time)} 约访 · ${esc(a.with)}</span></div>`;
  }
  function storeChips(st) {
    const chips = [App.ui.coopChip(st.coop), App.ui.complaintChip(st.complaint)];
    if (st.isNewOpen) chips.push(App.ui.chip(`新开店 · ${shortMd(st.openedAt)} 开业（有开业证据）`, 'ok', { icon: 'star' }));
    if (st.isNewEntry) chips.push(App.ui.chip('新录入 · 非新开店', 'outline'));
    return chips.filter(Boolean).join('');
  }
  S.storeChips = storeChips;

  function card(st) {
    if (st.perm === 'minimal') return minimalCard(st);
    const own = ownerOf(st); const mine = isMine(st); const t = nextTask(st); const lv = st.lastVisit; const rr = repeatRisk(st);
    const where = mode() === 'mine' && !(st.address || '').startsWith(st.street || '') ? ` · ${esc(st.street || NEEDS)}` : '';
    return `<div class="card cus-card pressable" data-store="${st.id}" onclick="App.go('customer',{id:'${st.id}'})">
      <div class="hd">
        <div class="grow">
          <div class="nm"><span class="ellipsis">${esc(st.name)}</span>${st.alias ? App.ui.chip(st.alias, 'gray', { sm: true }) : ''}</div>
          <div class="meta ellipsis">${esc(st.type)} · ${esc(st.address)}${where}</div>
        </div>${App.icon('chevron-right', 16)}
      </div>
      <div class="chips">${storeChips(st)}</div>
      ${apptToday(st) ? apptHtml(st) : ''}
      <div class="kv2">
        <span class="k">最近拜访</span>${lv ? `<span class="v">${esc(App.fmt.rel(lv.date))} · ${esc(lv.type)} · ${esc(lv.result)}</span>` : '<span class="v muted">暂无有效拜访</span>'}
        <span class="k">下次任务</span>${t ? taskLabel(t) : '<span class="v muted">暂无待办</span>'}
      </div>
      ${rr ? `<div class="cus-warn">${App.icon('alert', 14)}<span>${daysAgo(st)} 天前已拜访 · 重复拜访提示（不阻断）</span></div>` : ''}
      <div class="ft">
        <div class="own">${App.ui.avatar(own.name, 'sm' + (mine ? '' : ' gray'))}<span class="ellipsis">${mine ? '本人' : esc(own.name)}</span><span class="up">· 更新 ${esc(shortDt(st.updatedAt))}</span></div>
        <button class="btn xs secondary" onclick="event.stopPropagation();S_CUS.visit('${st.id}')">${App.icon('camera', 14)}记录拜访</button>
      </div>
    </div>`;
  }
  function minimalCard(st) {
    return `<div class="card cus-card cus-min pressable" data-store="${st.id}" onclick="App.toast('无权查看该门店详情',{icon:'lock'})">
      <div class="hd"><div class="lock">${App.icon('lock', 18)}</div>
        <div class="grow"><div class="nm"><span class="ellipsis">${esc(st.name)}</span></div><div class="meta ellipsis">${esc(st.type)} · ${esc(st.address)}</div></div>
      </div>
      <div class="msg">${App.icon('users', 15)}<span>该门店已有负责人跟进 · ${esc(st.recentTouch || '近 7 天有触达')}</span></div>
      <div class="ft"><span class="muted tiny">联系人 / 拜访 / 附件不可见（服务端权限）</span>
        <button class="btn xs ghost" onclick="event.stopPropagation();App.go('collab-request',{storeId:'${st.id}'})">${App.icon('handshake', 14)}申请协作</button></div>
    </div>`;
  }
  function needsCard(st) {
    return `<div class="card cus-card" data-store="${st.id}">
      <div class="hd"><div class="grow"><div class="nm"><span class="ellipsis">${esc(st.name)}</span></div><div class="meta">${esc(st.type)}</div></div></div>
      <div class="chips">${App.ui.chip('待补地址', 'warn', { icon: 'map-pin' })}${App.ui.coopChip(st.coop)}</div>
      <div class="kv2"><span class="k">原始地址</span><span class="v">${esc(st.address)}</span><span class="k">标准街道</span><span class="v muted">未匹配 · 不进入街道列表</span></div>
      <div class="ft"><div class="own">${App.ui.avatar(ownerOf(st).name, 'sm')}<span>${isMine(st) ? '本人' : esc(ownerOf(st).name)}</span><span class="up">· 录入 ${esc(shortMd(st.updatedAt))}</span></div>
        <button class="btn xs secondary" onclick="App.toast('演示：补充地址后按标准街道 ID 归入列表')">${App.icon('edit', 14)}补充地址（演示）</button></div>
    </div>`;
  }

  function streetButton(street, base) {
    const m = streetMeta(street);
    const active = base.filter((s) => s.coop === 'active').length;
    const open = base.filter((s) => s.complaint && s.complaint.status === 'open').length;
    const appt = base.filter(apptToday).length;
    const title = street === NEEDS ? `${m.city} · ${m.district} · 待补地址` : `${m.city} · ${m.district} · ${m.name}`;
    const sub = street === NEEDS ? `${base.length} 家门店无标准街道 · 待治理清单` : (base.length ? `${base.length} 家门店 · 服务中 ${active} · 未结客诉 ${open} · 今日约访 ${appt}` : '该街道暂无客户');
    return `<button class="cus-street pressable" onclick="App.go('street-picker')"><div class="ci">${App.icon('map-pin', 20)}</div><div class="grow"><div class="t ellipsis">${esc(title)}</div><div class="s">${esc(sub)}</div></div><div class="sw" aria-label="切换街道">${App.icon('chevron-down', 18)}</div></button>`;
  }
  function mineSummary(base) {
    const me = App.me();
    const groups = {};
    base.forEach((s) => { const k = s.street || NEEDS; groups[k] = (groups[k] || 0) + 1; });
    const parts = Object.keys(groups).map((k) => `${k} ${groups[k]}`).join(' · ');
    return `<div class="cus-street"><div class="ci">${App.ui.avatar(me.name, 'sm')}</div><div class="grow"><div class="t ellipsis">${App.isMgr() ? '团队客户' : '本人负责'} · ${base.length} 家门店</div><div class="s ellipsis">${esc(parts || '暂无')}</div></div></div>`;
  }

  /* ---------- 列表（搜索时局部刷新） ---------- */
  S.renderList = function () {
    const ui = U(); const md = mode(); const street = ui.street || '一马路';
    const base = baseList();
    const f = FILTERS.find((x) => x.id === ui.custFilter) || FILTERS[0];
    const q = (S.q || '').trim();
    let list = base.filter(f.test);
    if (q) list = list.filter((s) => (s.name + (s.alias || '') + (s.address || '')).includes(q));
    if (md === 'street' && street === NEEDS) {
      if (!list.length) return App.ui.empty({ icon: 'map-pin', title: '暂无待补地址客户', sub: '无标准街道的客户会进入这里' });
      return App.ui.notice('warn', '无标准街道 ID 的客户进入待治理清单；<b>原始地址保留用于核对</b>，避免同名街道混淆。', 'map-pin') + list.map(needsCard).join('');
    }
    if (!base.length) {
      return `<div class="cus-empty">${App.ui.empty({ icon: 'store', title: '该街道暂无客户', sub: '新增门店会先经过名称 / 地址候选去重，再关联或新建', action: App.ui.btn('新增门店', { icon: 'plus', size: 'sm', onclick: "App.toast('演示：新店线索提交为草稿，经候选去重后关联或新建')" }) })}</div>`;
    }
    if (!list.length) return App.ui.empty({ icon: 'search', title: q ? '未找到匹配门店' : '没有符合条件的门店', sub: q ? `"${q}" 在当前筛选下无结果` : '切换筛选或街道再试' });
    list = list.slice().sort((a, b) => rank(a) - rank(b) || ((a.updatedAt || '') < (b.updatedAt || '') ? 1 : -1));
    const needs = App.state.stores.filter((s) => s.needsAddress);
    const needsEntry = md === 'street' && f.id === 'all' && !q && needs.length
      ? `<div class="cus-needs pressable" onclick="S_CUS.pick('${NEEDS}')"><div class="ni">${App.icon('map-pin', 18)}</div><div class="grow"><div style="font-size:14px;font-weight:600">待补地址（${needs.length}）</div><div class="tiny muted">无标准街道 ID · 待治理清单</div></div>${App.icon('chevron-right', 16, 'muted')}</div>` : '';
    return `<div class="cus-count">${list.length} 家门店 · 今日约访优先 → 服务中 → 其他 · 无权门店置后</div>` + list.map(card).join('') + needsEntry;
  };

  /* ---------- 动作 ---------- */
  S.filter = (id) => { U().custFilter = id; App.save(); App.refresh(); };
  S.mode = (m) => { const ui = U(); ui.custMode = m; ui.custFilter = 'all'; S.q = ''; App.save(); App.refresh(); };
  S.pick = (street) => { const ui = U(); ui.street = street; ui.custMode = 'street'; ui.custFilter = 'all'; S.q = ''; App.save(); if (App.stack.length > 1 && App.currentEntry().id === 'street-picker') App.back(); else App.refresh(); };
  S.clear = () => { S.q = ''; App.refresh(); };
  S.visit = function (id, extra) {
    const st = App.store(id); if (!st) return;
    const params = Object.assign({ storeId: id }, extra || {});
    if (repeatRisk(st)) {
      App.prompt(`${daysAgo(st)} 天前已拜访 · 重复拜访提示`, '提示不阻断。请填写本次拜访的合理原因（如：已约定复访 / 客诉处理 / 补充勘查）', (reason) => {
        const r = (reason || '').trim();

  const sortKey = (d) => ((d || '').length > 10 ? d : (d || '') + ' 12:00');
  const tomorrow = () => { const d = new Date(App.dayjs(App.TODAY).getTime() + 86400000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  const storeChips = (st) => (window.S_CUS ? S_CUS.storeChips(st) : App.ui.coopChip(st.coop) + App.ui.complaintChip(st.complaint));
  const todo = (st) => App.tasksOf(st.id).filter((t) => t.status === 'todo').sort((a, b) => ((a.due + (a.time || '')) < (b.due + (b.time || '')) ? -1 : 1));
  const note = (text, icon) => `<div class="cdt-note">${App.icon(icon || 'info', 13)}<span>${text}</span></div>`;

  /* ---------- 头部 ---------- */
  function header(st) {

      <div class="chips mt8">${storeChips(st)}</div>
      <div class="divider"></div>
      ${App.ui.kv(kv)}
    </div>`;

  function actions(st) {

      <button class="quick pressable" onclick="App.tab('assistant')"><div class="qi violet">${App.icon('question', 20)}</div>问答</button>

    </div>`;
  }
  function tabs(cur) {

  }

  /* ---------- 概览 ---------- */
  function complaintBlock(st) {
    const c = st.complaint || {};
    if (c.status === 'open') {
      const task = App.tasksOf(st.id).find((t) => t.type === '客诉跟进' && t.status === 'todo');
      return App.ui.notice('danger', `<b>未结客诉</b>（${esc(shortMd(c.date))}）：${esc(c.summary || '')}<div class="mt4"><b>先了解 / 协调服务问题</b>，再谈续约或新商机；AI 不建立额外收费商机。</div><div class="tiny mt4" style="opacity:.75">${esc(c.source || '')}</div>${task ? `<div class="mt8">${App.ui.btn('查看客诉跟进任务', { tone: 'danger', size: 'xs', icon: 'flag', onclick: `App.go('task',{id:'${task.id}'})` })}</div>` : ''}`, 'alert');
    }
    if (c.status === 'stale') return App.ui.notice('warn', `<b>客诉数据待更新</b>：${esc(c.summary || '同步过期')}${c.date ? `（最近同步 ${esc(shortMd(c.date))}）` : ''}。同步恢复前不按"无客诉"处理。`, 'clock');

  function complaintText(c) {

  }
  function oppRow(o) {

        <div class="chips">${App.ui.stageChip(o.stage)}${App.ui.tierChip(o.tier)}${o.ai ? App.ui.chip('AI 建议', 'ai', { icon: 'sparkle' }) : ''}${o.ai && o.ai.reviewStatus ? App.ui.chip(o.ai.reviewStatus, 'warn', { sm: true }) : ''}</div>

      <div class="cell-right">${App.icon('chevron-right', 16)}</div></div>`;

  function taskCell(t) {

  }

  /* ---------- 时间线 ---------- */
  function timelineItems(st) {

        title: `<span>${esc(v.type)} · ${esc(who)}</span>${App.ui.visitStatusChip(v.status)}`,
        body: `${esc(v.result || '')}${v.next ? ` · 下一步：${esc(v.next)}` : ''}${cm.length ? `<div class="tiny muted mt4">承诺：${esc(cm.join('；'))}</div>` : ''}`,
        onclick: `App.go('visit-detail',{id:'${v.id}'})` });
    });
    App.oppsOf(st.id).forEach((o) => {
      if (o.ai) items.push({ t: o.updatedAt, tone: 'ai', tag: App.ui.factTag('derived'), title: `<span>AI 建议 · ${esc(o.service)}（${esc(o.kind)}）</span>${App.ui.chip(`${o.ai.stage} / ${App.tierLabel(o.ai.tier)}`, 'ai', { sm: true })}`, body: `${esc((o.ai.next || [])[0] && ((o.ai.next[0].text) || o.ai.next[0]) || '')}<div class="tiny muted mt4">置信度 ${esc(o.ai.confidence || '—')} · 不改正式值${o.ai.reviewStatus ? ' · ' + esc(o.ai.reviewStatus) : ''}</div>`, onclick: `App.go('opportunity',{id:'${o.id}'})` });
    });
    App.tasksOf(st.id).forEach((t) => {
      if (t.status === 'done' && t.doneAt) items.push({ t: t.doneAt, tone: 'gray', tag: App.ui.factTag('fact'), title: `<span>任务完成 · ${esc(t.title)}</span>`, body: `来源：${esc(t.source)}`, onclick: `App.go('task',{id:'${t.id}'})` });
      if (t.status === 'rescheduled' && t.rescheduledAt) items.push({ t: t.rescheduledAt, tone: 'gray', tag: App.ui.factTag('fact'), title: `<span>任务改期 · ${esc(t.title)}</span>`, body: esc(t.rescheduleReason || '') });
    });
    const c = st.complaint || {};
    if (c.date && (c.status === 'open' || c.status === 'stale')) items.push({ t: c.date, tone: 'warn', tag: App.ui.factTag('fact'), title: `<span>${c.status === 'open' ? '客诉' : '客诉（数据待更新）'}</span>${App.ui.complaintChip(c)}`, body: `${esc(c.summary || '')}<div class="tiny muted mt4">${esc(c.source || '服务系统')}</div>` });
    App.state.proposals.filter((p) => p.storeId === st.id).forEach((p) => {
      const tpl = App.by(App.state.templates, 'id', p.templateId) || {};
      (p.events || []).forEach((e) => items.push({ t: e.t, tone: 'gray', tag: App.ui.factTag('fact'), title: `<span>方案 · ${esc(e.e)}</span>`, body: `${esc(tpl.name || '')} ${esc(p.templateVersion || '')}`, onclick: `App.go('proposal',{id:'${p.id}'})` }));
    });
    if (st.since) items.push({ t: st.since, tone: '', tag: App.ui.factTag('official'), title: '<span>开始服务</span>', body: `合同期至 ${ymdDot(st.contractEnd)}` });
    if (st.pausedAt) items.push({ t: st.pausedAt, tone: 'warn', tag: App.ui.factTag('official'), title: '<span>停做</span>', body: esc(st.pausedReason || '') });
    if (st.openedAt) items.push({ t: st.openedAt, tone: 'gray', tag: App.ui.factTag('fact'), title: '<span>新开店录入</span>', body: `证据：${esc(st.openEvidence || '')}` });
    if (st.enteredAt) items.push({ t: st.enteredAt, tone: 'gray', tag: App.ui.factTag('fact'), title: '<span>新录入门店</span>', body: '非新开店' });
    return items.sort((a, b) => (sortKey(a.t) < sortKey(b.t) ? 1 : -1));
  }
  function timeline(st) {
    const items = timelineItems(st);
    if (!items.length) return App.ui.empty({ icon: 'history', title: '暂无记录', sub: '拜访、任务、客诉、方案事件会汇总在这里' });
    return note('统一时间线：拜访 / 任务 / 客诉 / 方案 / AI 建议按时间倒序；<b>AI 派生</b>与<b>已确认事实</b>分别标注。', 'layers')
      + `<div class="card cdt-tl"><div class="timeline">${items.map((it) => `<div class="tl-item ${it.tone || ''} ${it.onclick ? 'pressable' : ''}" ${it.onclick ? `onclick="${it.onclick}"` : ''}><div class="tl-time">${esc(tlTime(it.t))} · ${it.tag}</div><div class="tl-title">${it.title}</div>${it.body ? `<div class="tl-body">${it.body}</div>` : ''}</div>`).join('')}</div></div>`;
  }

  /* ---------- 联系人 ---------- */
  function contacts(st) {
    const list = st.contacts || [];
    if (!list.length) return App.ui.empty({ icon: 'users', title: '暂无联系人', sub: '拜访确认后由结构化事实写入；口述未提供的姓名标"待核实"，不填造' });
    const rows = list.map((c) => `<div class="cell"><div class="avatar ${c.verified ? '' : 'gray'}" style="width:36px;height:36px">${esc(App.initials(c.name))}</div>
      <div class="cell-body"><div class="cell-title row gap6"><span class="ellipsis">${esc(c.name)}</span>${App.ui.chip(c.decision || '—', DEC_TONE[c.decision] || 'gray', { sm: true })}</div>
        <div class="cell-sub">${esc(c.role || '')} · 来源：${esc(c.source || '—')} · ${c.phone && c.phone !== '—' ? esc(c.phone) : '未留电话'}</div></div>
      <div class="cell-right">${c.verified ? App.ui.chip('已核实', 'ok', { sm: true, icon: 'check' }) : App.ui.chip('待核实', 'warn', { sm: true })}</div></div>`).join('');
    return `<div class="list">${rows}</div>` + note('决策角色（对接人 / 决策人 / 使用方 / 采购方）来自 CRM 或拜访确认；电话脱敏显示；口述里没有的姓名不填造。', 'shield');
  }

  /* ---------- 商机 ---------- */
  function opps(st) {
    const list = App.oppsOf(st.id);
    let h = list.length ? `<div class="list">${list.map(oppRow).join('')}</div>` : App.ui.empty({ icon: 'trend', title: '暂无商机', sub: '有效接触并确认需求后再新建' });
    h += note('同店续约与新购分开，互不覆盖；阶段与 258 分层挂在商机上，列表只展示主商机。', 'layers');
    h += App.ui.btn('新增商机', { tone: 'secondary', block: true, icon: 'plus', onclick: `S_CDT.newOpp('${st.id}')` });
    return h;
  }

  /* ---------- 承诺 ---------- */
  function commitmentsOf(st) {
    const out = [];
    App.visitsOf(st.id).forEach((v) => {
      ['customer', 'sales'].forEach((side) => ((v.commitments || {})[side] || []).forEach((c) => {
        out.push({ side, text: typeof c === 'string' ? c : c.text, key: !!(typeof c === 'object' && c.key), visit: v, confirmed: ['synced', 'saved'].includes(v.status) });
      }));
    });
    return out;
  }
  function commitments(st) {
    const items = commitmentsOf(st); const opp = App.primaryOpp(st.id);
    let h = '';
    if (st.group) h += `<div class="list">${App.ui.cell({ title: '承诺一致性核对（P1 预览）', badge: App.ui.chip('P1', 'warn', { sm: true }), sub: '承诺—方案—报价—合同差异；差异未处理阻断提交', icon: 'compare', iconTone: 'warn', onclick: `App.go('p1-commitments',{oppId:'${opp ? opp.id : ''}'})` })}</div>`;
    if (!items.length) return h + App.ui.empty({ icon: 'handshake', title: '暂无承诺记录', sub: '拜访确认时，客户 / 我方承诺单独突出确认后写入' });
    const cust = items.filter((i) => i.side === 'customer').length; const pend = items.filter((i) => !i.confirmed).length;
    h += `<div class="kpis cdt-summary">${[['客户承诺', cust, ''], ['我方承诺', items.length - cust, 'brand'], ['待确认', pend, pend ? 'warn' : '']].map(([l, v, tone]) => `<div class="kpi ${tone}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>`;
    h += `<div class="list">${items.map((c) => `<div class="cell cdt-cm"><div class="cell-icon ${c.side === 'customer' ? 'info' : ''}">${App.icon(c.side === 'customer' ? 'user' : 'handshake', 18)}</div>
      <div class="cell-body"><div class="cell-title row gap6">${App.ui.chip(c.side === 'customer' ? '客户' : '我方', c.side === 'customer' ? 'info' : 'brand', { sm: true })}<span>${esc(c.text)}</span></div>
        <div class="cell-sub">证据：拜访记录 ${esc(shortDt(c.visit.time))} · ${esc(c.visit.type)}${c.visit.contact && c.visit.contact.name ? ' · ' + esc(c.visit.contact.name) : ''}</div></div>
      <div class="cell-right">${c.confirmed ? App.ui.chip('已确认', 'ok', { sm: true }) : App.ui.chip('待确认', 'warn', { sm: true })}</div></div>`).join('')}</div>`;
    h += note('承诺来自已确认的拜访事实；金额 / 日期类承诺需单独确认；不得口头承诺"根除"或减免。', 'shield');
    return h;
  }

  /* ---------- 方案 ---------- */
  function proposals(st) {
    const list = App.state.proposals.filter((p) => p.storeId === st.id); const opp = App.primaryOpp(st.id);
    let h = list.length ? list.map((p) => {
      const tpl = App.by(App.state.templates, 'id', p.templateId) || {}; const ev = p.events || []; const last = ev[ev.length - 1]; const stt = PROP_STATUS[p.status] || [p.status, 'gray'];
      return `<div class="card cdt-prop pressable" onclick="App.go('proposal',{id:'${p.id}'})">
        <div class="row between"><div class="card-title" style="margin:0"><span class="ellipsis">${esc(tpl.name || '方案')}</span></div>${App.icon('chevron-right', 16, 'muted')}</div>
        <div class="chips mt8">${App.ui.chip(`模板 ${p.templateVersion || tpl.version || ''}`, 'outline')}${App.ui.chip(`v${p.version}`, 'gray')}${App.ui.chip(stt[0], stt[1])}</div>
        ${App.ui.kv([['审核人', esc(tpl.reviewedBy || '—')], ['确认人', esc(p.confirmedBy || '—')], ['最近事件', last ? `${esc(last.e)} · ${esc(shortDt(last.t))}` : '—'], ['事件', `${ev.length} 条（生成 / 导出 / 人工标记发送）`]])}
      </div>`;
    }).join('') : App.ui.empty({ icon: 'doc', title: '暂无方案', sub: '使用已审核模板生成；需要价格处显示"报价待审批"' });
    h += note('仅生成 / 发送方案不推进阶段；重新生成产生新版本，不覆盖已确认版本。', 'info');
    h += App.ui.btn('发起方案', { block: true, icon: 'doc', onclick: `S_CDT.proposal('${st.id}')`, disabled: !opp });
    if (!opp) h += `<div class="tiny muted mt8" style="text-align:center">暂无商机，请先在"商机"页新增</div>`;
    return h;
  }

  function body(st, tab) {
    return ({ overview, timeline, contacts, opps, commit: commitments, proposals }[tab] || overview)(st);
  }

  /* ---------- 无权门店：最小视图 ---------- */
  function minimalView(st) {
    return `<div class="card" style="text-align:center;padding:28px 16px 22px">
      <div class="cdt-lock">${App.icon('lock', 26)}</div>
      <div style="font-size:18px;font-weight:700;margin-top:12px">${esc(st.name)}</div>
      <div class="muted small mt4">${esc(st.type)} · ${esc(st.address)}</div>
      <div class="chips mt12" style="justify-content:center">${App.ui.chip('该门店已有负责人跟进', 'gray', { icon: 'users' })}${App.ui.chip(st.recentTouch || '近 7 天有触达', 'info', { icon: 'clock' })}</div>
    </div>
    ${App.ui.notice('gray', '按服务端权限，本页仅返回必要的重复触达提示：<b>不显示联系人、合同、拜访详情与附件</b>。如需跟进，请申请协作，负责人 / 主管确认后生效，不自动抢占归属。', 'shield')}
    ${App.ui.btn('申请协作', { block: true, icon: 'handshake', onclick: `App.go('collab-request',{storeId:'${st.id}'})` })}`;
  }

  /* ---------- 动作 ---------- */
  S.tab = (id) => { U().customerTab = id; App.save(); App.refresh(); };
  S.visit = (id) => { if (window.S_CUS && S_CUS.visit) S_CUS.visit(id); else App.go('visit-capture', { storeId: id }); };
  S.proposal = (storeId) => {
    const opp = App.primaryOpp(storeId);
    if (!opp) { App.toast('该门店暂无商机，请先在"商机"页新增'); return; }
    App.go('proposal-new', { oppId: opp.id });
  };
  S.newTask = (storeId) => {
    const me = App.me(); const opp = App.primaryOpp(storeId);
    App.prompt('新建任务', '例如：回访确认油烟机清洗参数（默认明天到期，可在任务详情改期）', (txt) => {
      const title = (txt || '').trim(); if (!title) { App.toast('请输入任务内容'); return; }
      App.state.tasks.unshift({ id: App.uid('t'), storeId, oppId: opp ? opp.id : null, title, type: '跟进', ownerId: me.id, ownerName: me.name, due: tomorrow(), time: '', status: 'todo', source: '本人创建', reason: '', evidence: [], expected: '', createdAt: App.TODAY });
      App.save(); App.refresh(); App.toast('已创建任务 · 明天到期', { icon: 'check-circle' });
    }, '创建');
  };
  S.newOpp = (storeId) => {
    const st = App.store(storeId); if (!st) return; const me = App.me();
    const lines = ['有害生物防治', '油烟机清洗', '卫生间深度清洁', '消毒杀菌'];
    App.sheet({ title: '新增商机 · 选择服务线（阶段从"待触达"开始，分层待判断）', items: lines.map((l) => {
      const exists = App.oppsOf(storeId).some((o) => o.service === l);
      const inService = (st.services || []).some((s) => s.startsWith(l));
      const kind = inService ? '续约' : st.coop === 'active' ? '增购' : '新购';
      return { label: l, icon: 'tag', sub: `${kind}${exists ? ' · 已有同服务线商机，可并存不覆盖' : ''}`, onSelect() {
        App.state.opportunities.push({ id: App.uid('o'), storeId, service: l, kind, stage: '待触达', tier: 'pending', tierSource: '新建 · 待判断', ownerId: me.id, ownerName: me.name, done: [], missing: ['真实接触结果', '对接人角色与决策人'], stallReason: null, ai: null, updatedAt: App.TODAY });
        App.save(); U().customerTab = 'opps'; App.refresh(); App.toast(`已新增商机：${l}（${kind}）`, { icon: 'check-circle' });
      } };
    }) });
  };

  App.register('customer', {
    title: '客户详情', tab: 'customers',
    nav: (p) => { const st = App.store(p.id); return { title: st ? st.name : '客户详情', solid: true }; },
    prd: ['7 页面表 · 客户详情', 'F01 集团 / 签约主体 / 门店 分别建模；一店多商机', 'F02 无权门店只返回避重提示', 'F05 未结客诉优先"先了解/协调服务问题"'],
    rules: ['事实 vs AI 派生分别标注', '同店续约与新购分开、互不覆盖', '口述未提供的姓名标"待核实"，不填造', '未结客诉期间不建立额外收费商机', '无权门店不显示联系人、合同、附件', '仅生成方案不推进阶段'],
    render(p) {
      const st = App.store(p.id);
      if (!st) return App.ui.empty({ icon: 'store', title: '未找到该门店', sub: `ID：${p.id || '—'}` });
      if (st.perm === 'minimal') return minimalView(st);
      const tab = TABS.some(([id]) => id === U().customerTab) ? U().customerTab : 'overview';
      return header(st) + actions(st) + tabs(tab) + `<div id="cdt-body">${body(st, tab)}</div>`;
    },
    demoActions: [
      { label: '查看：时间线', icon: 'history', run() { S.tab('timeline'); } },
      { label: '查看：承诺', icon: 'handshake', run() { S.tab('commit'); } },
      { label: '模拟：客诉已结（满堂红）', icon: 'check-circle', run() { const st = App.store('s_jia'); if (!st) return; st.complaint = { status: 'closed', summary: '9/3 客诉已复处理并关闭', date: '2026-09-07', source: '服务系统 · 9/7 16:00 同步' }; App.save(); App.refresh(); App.toast('满堂红：客诉已结', { icon: 'check-circle' }); } },
      { label: '恢复：未结客诉（满堂红）', icon: 'refresh', run() { const st = App.store('s_jia'); const fresh = App.freshState().stores.find((s) => s.id === 's_jia'); if (st && fresh) { st.complaint = fresh.complaint; App.save(); App.refresh(); App.toast('已恢复未结客诉', { icon: 'refresh' }); } } },
    ],
  });

  /* ---------- 申请协作 ---------- */
  App.register('collab-request', {
    title: '申请协作', tab: 'customers', nav: { title: '申请协作', solid: true },
    prd: ['F01 非本人客户申请协作，不自动抢占归属', '13.1 权限矩阵 · 客户转交由主管审批'],
    rules: ['申请不改变归属', '负责人确认或主管指定后生效', '确认前不开放联系人 / 合同 / 附件'],
    render(p) {
      const st = App.store(p.storeId); const me = App.me();
      return `${App.ui.notice('info', '申请提交后由门店负责人或主管确认；<b>确认前不改变归属</b>，也不开放联系人 / 合同 / 附件。', 'shield')}
        <div class="list cdt-form">
          <div class="form-item"><label>门店</label><div class="fv">${esc(st ? st.name : '—')}</div></div>
          <div class="form-item"><label>申请人</label><div class="fv">${esc(me.name)} <span class="muted small">· ${esc(me.roleName)}</span></div></div>
          <div class="form-item"><label>协作类型</label><div class="fv"><div class="seg" id="collab-type"><button class="active" data-v="协作跟进" onclick="S_CDT.collabType(this)">协作跟进</button><button data-v="申请转交" onclick="S_CDT.collabType(this)">申请转交</button></div></div></div>
          <div class="form-item required ta"><label>原因</label><div class="fv"><textarea id="collab-reason" placeholder="例如：客户主动联系我方，希望与现负责人共同跟进；或已约定到店时间"></textarea></div></div>
        </div>
        ${note('转交需接收人确认或主管指定后生效；正式转交保留历史责任人、协作权限及未结任务。', 'info')}`;
    },
    footer(p) { return App.ui.btn('提交申请', { block: true, size: 'lg', icon: 'send', onclick: `S_CDT.submitCollab('${p.storeId}')` }); },
  });
  S.collabType = (btn) => { App.qa('button', btn.parentNode).forEach((b) => b.classList.toggle('active', b === btn)); };
  S.submitCollab = (storeId) => {
    const scr = App.currentEntry() && App.currentEntry().el;
    const ta = scr && scr.querySelector('#collab-reason'); const v = ta ? ta.value.trim() : '';
    if (!v) { App.toast('请填写申请原因'); if (ta) ta.focus(); return; }
    const type = ((scr && scr.querySelector('#collab-type .active')) || {}).dataset ? scr.querySelector('#collab-type .active').dataset.v : '协作跟进';
    (App.state.collabRequests = App.state.collabRequests || []).push({ id: App.uid('cr'), storeId, type, reason: v, by: App.me().id, at: App.TODAY, status: '待确认' });
    App.save();
    App.toast('已提交协作申请，等待负责人/主管确认（不自动抢占归属）', { icon: 'check-circle', duration: 2400 });
    setTimeout(() => App.back(), 500);
  };
})();

</script>
<script>
/* ============================================================
   拜访采集 / 待确认事实 / 拜访详情（F03）
   visit-capture(storeId, oppId?) → visit-confirm(id) → visit-detail(id)
   状态机可见：本地草稿 → 上传中 → AI处理中 → 待确认 → 本系统已保存 → 待同步 CRM → CRM 同步成功
   ============================================================ */
(function () {
  'use strict';
  const ui = App.ui;
  const esc = App.esc;
  const alive = (id) => { const e = App.currentEntry(); return !!e && e.id === id; };
  const refreshIf = (id) => { if (alive(id)) App.refresh(); };
  const T = (x) => (x == null ? '' : (typeof x === 'string' ? x : (x.text || '')));
  const list = (arr) => (arr || []).map(T).filter(Boolean);
  const TYPES = ['陌拜', '约访', '回访', '勘查'];
  const PHOTO_SEQ = [
    { kind: 'kitchen', label: '后厨墙角 · 风险点位 1' },
    { kind: 'corner', label: '仓库门缝 · 风险点位 2' },
    { kind: 'pest', label: '排水沟 · 风险点位 3' },
  ];
  const REC_LIMIT = 6; // 演示：录音自动在 6 秒结束

  /* ============================================================
     一、采集页状态（模块级，App.refresh 重绘）
     ============================================================ */
  const CAP = {
    storeId: null, oppId: null, type: '约访', oppTouched: false,
    ocr: null,          // null | {status:'done', text, candidates, matched} | {status:'blur'}
    ocrPick: null,      // 选中的候选 id
    ocrChoice: null,    // 'link' | 'new'
    manualName: '',
    photos: [],
    rec: { status: 'idle', seconds: 0, text: '', typed: 0 },   // idle | recording | transcribing | done
    textMode: false, text: '', micDenied: false, resumed: false,
    sub: { status: 'idle', stage: 0, pct: 0, lines: [], error: '' }, // idle | running | error | ai_error
    sim: { offline: false, aiFail: false },
    gen: 0,
  };
  let recTimer = null, typeTimer = null;
  function clearTimers() { clearInterval(recTimer); recTimer = null; clearInterval(typeTimer); typeTimer = null; }

  function defaultType(st) {
    if (!st) return '约访';
    if (st.appointment) return '约访';
    if (st.coop === 'active') return '回访';
    return '陌拜';
  }
  function capReset(storeId, oppId) {
    clearTimers();
    const st = App.store(storeId);
    CAP.gen++;
    CAP.storeId = storeId;
    CAP.oppId = oppId || (st && st.primaryOppId) || (App.primaryOpp(storeId) || {}).id || null;
    CAP.oppTouched = false;
    CAP.type = defaultType(st);
    CAP.ocr = null; CAP.ocrPick = null; CAP.ocrChoice = null; CAP.manualName = '';
    CAP.photos = [];
    CAP.rec = { status: 'idle', seconds: 0, text: '', typed: 0 };
    CAP.textMode = false; CAP.text = ''; CAP.micDenied = false; CAP.resumed = false;
    CAP.sub = { status: 'idle', stage: 0, pct: 0, lines: [], error: '' };
    CAP.sim = { offline: false, aiFail: false };
  }
  function capInit(params) {
    const sid = params.storeId || 's_bing';
    if (CAP.storeId !== sid) capReset(sid, params.oppId);
    else if (params.oppId && !CAP.oppTouched) CAP.oppId = params.oppId;
  }
  const hasContent = () => !!(CAP.ocr || CAP.photos.length || CAP.rec.status === 'done' || (CAP.textMode && CAP.text.trim()));
  const speechText = () => (CAP.textMode ? CAP.text.trim() : (CAP.rec.status === 'done' ? CAP.rec.text : ''));

  /* ---------- 采集页片段 ---------- */
  function secHead(n, title, right) {
    return `<div class="section"><div class="row gap6"><span class="vis-n">${n}</span><h3>${esc(title)}</h3></div>${right ? `<div class="more">${right}</div>` : ''}</div>`;
  }
  function topStrip(st) {
    const rec = CAP.rec;
    const speech = rec.status === 'done' ? `${rec.seconds} 秒` : (CAP.textMode && CAP.text.trim() ? `${CAP.text.trim().length} 字` : '未录');
    const ocr = !CAP.ocr ? '未拍' : (CAP.ocr.status === 'blur' ? '模糊' : (CAP.ocrChoice === 'link' ? '已关联' : (CAP.ocrChoice === 'new' ? '新店草稿' : '待关联')));
    const mini = (icon, l, v, on) => `<div class="vis-mini ${on ? 'on' : ''}">${App.icon(icon, 16)}<div><div class="l">${esc(l)}</div><div class="v ellipsis">${esc(v)}</div></div></div>`;
    return `<div class="card tight vis-top">
      <div class="row between">
        <div class="row gap6">${ui.visitStatusChip('draft')}<span class="tiny muted">自动保存在本机 · 中途退出可恢复</span></div>
        <span class="tiny muted num">9/7 14:36</span>
      </div>
      <div class="vis-minis mt8">
        ${mini('store', '客户', st.alias || st.name, true)}
        ${mini('camera', '门头', ocr, !!CAP.ocr && CAP.ocr.status === 'done' && !!CAP.ocrChoice)}
        ${mini('image', '现场', CAP.photos.length ? `${CAP.photos.length} 张` : '未拍', CAP.photos.length > 0)}
        ${mini('mic', '口述', speech, rec.status === 'done' || (CAP.textMode && !!CAP.text.trim()))}
      </div>
      ${CAP.resumed ? `<div class="mt8">${ui.notice('info', '已恢复上次未提交的本地草稿，可继续补充后提交。', 'history')}</div>` : ''}
    </div>`;
  }
  function stepCustomer(st) {
    const opp = App.opp(CAP.oppId);
    const appt = st.appointment ? `今日 ${st.appointment.time} 约访 · ${st.appointment.with}` : (st.lastVisit ? `上次 ${App.fmt.md(st.lastVisit.date)} ${st.lastVisit.type}` : '首次接触');
    return `${secHead(1, '选择客户 / 商机')}
    <div class="card">
      <div class="row gap12">
        <div class="cell-icon">${App.icon('store', 20)}</div>
        <div class="grow"><div class="bold">${esc(st.name)}</div><div class="small muted mt4">${esc(st.address)} · ${esc(st.type || '')}</div></div>
        ${ui.coopChip(st.coop)}
      </div>
      <div class="divider"></div>
      <div class="row between">
        <span class="small muted">关联商机</span>
        <button class="vis-pick pressable" onclick="S_VISIT.pickOpp()">${opp ? `${esc(opp.service)} · ${esc(opp.kind)}` : '未关联商机'}${App.icon('chevron-down', 14)}</button>
      </div>
      ${opp ? `<div class="chips mt8">${ui.stageChip(opp.stage)}${ui.tierChip(opp.tier, { sm: false })}<span class="tiny muted">正式值 · ${esc(opp.tierSource || '')}</span></div>` : ''}
      <div class="divider"></div>
      <div class="row between"><span class="small muted">拜访类型</span><span class="tiny muted">${esc(appt)}</span></div>
      <div class="seg block mt8">${TYPES.map((t) => `<button class="${t === CAP.type ? 'active' : ''}" onclick="S_VISIT.setType('${t}')">${t}</button>`).join('')}</div>
      ${CAP.type === '陌拜' ? `<div class="tiny muted mt8">陌拜未见到关键人可保存真实结果，不要求强填预算。</div>` : ''}
    </div>`;
  }
  function stepStorefront(st) {
    const o = CAP.ocr;
    let body = '';
    if (!o) {
      body = `<div class="photo-grid">
        <div class="photo add pressable" onclick="S_VISIT.shoot()">${App.icon('camera', 22)}<span>拍门头</span></div>
        <div class="vis-tip"><div class="bold small">先拍门头，再核对门店</div><div class="tiny muted mt4">识别门店名称等可见信息 · 只给候选，不按名称自动合并</div></div>
      </div>`;
    } else if (o.status === 'blur') {
      body = `<div class="photo-grid"><div class="vis-ph">${ui.scene('blur', '门头 · 模糊')}</div></div>
      <div class="mt12">${ui.notice('warn', '<b>照片模糊，请补拍或手填门店名。</b><div class="tiny mt4">模糊照片不进入识别，也不会自动关联门店。</div>')}</div>
      <div class="btn-row"><button class="btn secondary sm" onclick="S_VISIT.shoot()">${App.icon('camera', 16)}补拍</button><button class="btn outline sm" onclick="S_VISIT.manualName()">${App.icon('keyboard', 16)}手填门店名</button></div>
      ${CAP.manualName ? `<div class="mt8">${ui.chip('手填：' + CAP.manualName, 'brand', { icon: 'keyboard' })}</div>` : ''}`;
    } else {
      const picked = o.candidates.find((c) => c.id === CAP.ocrPick) || o.candidates[0];
      const cands = o.candidates.map((c) => `<div class="vis-cand ${c.id === CAP.ocrPick ? 'on' : ''} pressable" onclick="S_VISIT.pickCand('${c.id}')">
          <div class="vis-radio"></div>
          <div class="grow"><div class="t ellipsis">${esc(c.name)}</div><div class="s ellipsis">${esc(c.addr)}</div></div>
          <div class="vis-score"><i style="width:${Math.round(c.score * 100)}%"></i></div><span class="vis-pct num">${Math.round(c.score * 100)}%</span>
        </div>`).join('');
      let decision = '';
      if (CAP.ocrChoice === 'link') decision = `<div class="row between mt12">${ui.chip('已关联：' + picked.name, 'ok', { icon: 'check' })}<button class="link small" onclick="S_VISIT.ocrChange()">更改</button></div>`;
      else if (CAP.ocrChoice === 'new') decision = `<div class="row between mt12">${ui.chip('新店草稿：' + o.text + '（待去重审核）', 'warn', { icon: 'plus' })}<button class="link small" onclick="S_VISIT.ocrChange()">更改</button></div>`;
      else decision = `<div class="btn-row mt12"><button class="btn primary sm" onclick="S_VISIT.ocrDecide('link')">${App.icon('check', 16)}关联已有门店</button><button class="btn outline sm" onclick="S_VISIT.ocrDecide('new')">提交新店草稿</button></div>`;
      body = `<div class="photo-grid"><div class="vis-ph">${ui.scene('storefront', '门头')}</div>
        <div class="vis-ocr-head"><div class="row gap6">${App.icon('scan', 16, 'ai-ink')}<span class="small bold">识别文字</span>${ui.chip('OCR 候选', 'ai', { sm: true })}</div><div class="vis-ocr-text">${esc(o.text)}</div><div class="tiny muted">可见信息 · 未推断电话/法人/价格</div></div>
      </div>
      <div class="vis-cands mt12">${cands}</div>
      ${decision}
      <div class="tiny muted mt8 row gap4">${App.icon('info', 12)}门头识别只提供候选，不按名称相同自动合并（F01）</div>`;
    }
    return `${secHead(2, '门头照片', CAP.ocr ? `<button class="link small" onclick="S_VISIT.shoot()">重拍</button>` : '')}<div class="card">${body}</div>`;
  }
  function stepScene() {
    const cells = CAP.photos.map((p, i) => `<div class="vis-ph">${ui.scene(p.kind, p.label)}<span class="mark">${ui.chip('风险点位', 'danger', { sm: true, icon: 'alert' })}</span><button class="rm" onclick="S_VISIT.removePhoto(${i})" aria-label="删除">${App.icon('x', 12)}</button></div>`).join('');
    const add = `<div class="photo add pressable" onclick="S_VISIT.addPhoto()">${App.icon('plus', 22)}<span>${CAP.photos.length ? '再拍一张' : '拍现场'}</span></div>`;
    return `${secHead(3, '现场照片 · 风险点位', `<span class="muted small">${CAP.photos.length}/9</span>`)}
    <div class="card">
      <div class="photo-grid">${cells}${add}</div>
      <div class="tiny muted mt8 row gap4">${App.icon('eye-off', 12)}照片只记录可见的现场情况，不推断法人/电话/价格等不可见信息（F03）</div>
    </div>`;
  }
  function stepSpeech() {
    const r = CAP.rec;
    let body = '';
    if (CAP.micDenied) body += ui.notice('warn', '<b>麦克风权限被拒绝</b><div class="tiny mt4">可改用文字及已有图片继续记录；随时可在系统设置中重新授权。</div>', 'mic');
    if (CAP.textMode) {
      body += `<textarea class="textarea" id="visText" placeholder="按拜访后口述的方式写：见到谁 · 什么需求/异议 · 现场观察 · 承诺 · 下一步…" oninput="S_VISIT.onText(this.value)">${esc(CAP.text)}</textarea>
        <div class="row between mt8"><span class="tiny muted">${CAP.text.trim().length} 字 · 文字与照片同样进入 AI 整理</span>${CAP.micDenied ? '' : `<button class="link small" onclick="S_VISIT.toggleText(false)">改用录音</button>`}</div>`;
    } else if (r.status === 'idle') {
      body += `<div class="vis-mic-wrap">
        <button class="vis-mic pressable" onclick="S_VISIT.mic()">${App.icon('mic', 30)}</button>
        <div class="vis-mic-hint">点击开始口述</div>
        <div class="tiny muted">拜访后口述即可 · 不要求现场持续录音</div>
      </div>
      <div class="row between mt8"><span class="tiny muted">示例：见到谁 · 需求 · 现场观察 · 承诺 · 下一步</span><button class="link small" onclick="S_VISIT.toggleText(true)">改用文字</button></div>`;
    } else if (r.status === 'recording') {
      body += `<div class="vis-mic-wrap">
        <button class="vis-mic rec pulse pressable" onclick="S_VISIT.mic()">${App.icon('stop', 26)}</button>
        <div class="wave mt8">${'<i></i>'.repeat(18)}</div>
        <div class="row gap6 mt4"><span class="vis-dot"></span><span class="vis-timer num">00:0${r.seconds}</span><span class="tiny muted">录音中 · 再次点击结束</span></div>
      </div>`;
    } else if (r.status === 'transcribing') {
      body += `<div class="vis-mic-wrap">
        <div class="vis-mic ai">${App.icon('refresh', 26, 'spin')}</div>
        <div class="vis-mic-hint">转写中…</div>
        <div class="tiny muted">录音 ${r.seconds} 秒 · 原始录音已保留</div>
      </div>`;
    } else {
      body += `<div class="vis-quote"><div class="vis-quote-ico">${App.icon('mic', 16)}</div><div class="grow"><div class="vis-quote-meta">原始口述 · 转写</div><div class="vis-quote-text" id="visTyped">${esc(r.text.slice(0, r.typed))}</div></div></div>
        <div class="row between mt8"><div class="row gap6">${ui.chip('已转写 · ' + r.seconds + ' 秒', 'ok', { sm: true, icon: 'check' })}<span class="tiny muted">可提交后再修改</span></div><div class="row gap12"><button class="link small" onclick="S_VISIT.reRecord()">重录</button><button class="link small" onclick="S_VISIT.toggleText(true)">改用文字</button></div></div>`;
    }
    return `${secHead(4, '口述 / 文字')}<div class="card">${body}</div>`;
  }
  function procCard() {
    const s = CAP.sub;
    const err = s.status === 'error' || s.status === 'ai_error';
    const lines = s.lines.map((l, i) => {
      const last = i === s.lines.length - 1;
      const ico = l.tone === 'error' ? App.icon('alert', 14, 'vis-l-err') : (last && s.status === 'running' ? App.icon('refresh', 14, 'spin vis-l-cur') : App.icon('check', 14, 'vis-l-ok'));
      return `<div class="vis-line ${l.tone || ''}">${ico}<span>${esc(l.text)}</span></div>`;
    }).join('');
    let action = '';
    if (s.status === 'error') action = `<div class="mt12">${ui.notice('danger', '<b>上传失败：网络中断</b> · 内容已保存为本地草稿，不会丢失。')}<div class="btn-row"><button class="btn primary sm" onclick="S_VISIT.retry()">${App.icon('refresh', 16)}重试上传</button><button class="btn ghost sm" onclick="S_VISIT.saveDraft()">稍后再传</button></div></div>`;
    if (s.status === 'ai_error') action = `<div class="mt12">${ui.notice('warn', '<b>AI 暂不可用</b> · 原始录音与照片已保存，可人工填写事实，不影响记录保存。')}<div class="btn-row"><button class="btn primary sm" onclick="S_VISIT.manualFill()">${App.icon('edit', 16)}人工填写</button><button class="btn ghost sm" onclick="S_VISIT.retryAI()">${App.icon('refresh', 16)}重试 AI</button></div></div>`;
    return `<div class="card vis-proc">
      <div class="card-title">${App.icon('sparkle', 16, 'ai-ink')}提交 AI 整理<span class="muted small" style="margin-left:auto;font-weight:500">${s.pct}%</span></div>
      ${ui.stepper(['本地草稿', '上传中', 'AI处理中', '待确认'], s.stage, { error: err })}
      <div class="mt12">${ui.progress(s.pct, s.stage >= 2)}</div>
      <div class="vis-lines mt12">${lines}</div>
      ${action}
    </div>`;
  }

  /* ---------- 采集页动作 ---------- */
  const S_VISIT = window.S_VISIT = {
    setType(t) { CAP.type = t; App.refresh(); },
    pickOpp() {
      const opps = App.oppsOf(CAP.storeId);
      const items = opps.map((o) => ({ label: `${o.service} · ${o.kind}`, sub: `${o.stage} · ${App.tierLabel(o.tier)}`, icon: 'briefcase', onSelect: () => { CAP.oppId = o.id; CAP.oppTouched = true; App.refresh(); } }));
      items.push({ label: '新建商机（草稿）', sub: '一店可有多个商机，互不覆盖', icon: 'plus', onSelect: () => App.toast('演示：新建商机草稿需选择服务项，此处略', { icon: 'info' }) });
      App.sheet({ title: '关联商机', items });
    },
    shoot() {
      const done = App.loading('识别门头…');
      setTimeout(() => {
        done();
        const st = App.store(CAP.storeId);
        const demo = DATA.demoVisit().ocr;
        if (CAP.storeId === 's_bing') CAP.ocr = { status: 'done', text: demo.text, matched: demo.matched, candidates: demo.candidates };
        else CAP.ocr = { status: 'done', text: st.name, matched: st.id, candidates: [{ id: st.id, name: st.name, addr: st.address, score: 0.93 }, { id: 'x', name: st.name.replace(/（.*?）/, '') + '（其他门店）', addr: '其他区域 · 同品牌不同地址', score: 0.38 }] };
        CAP.ocrPick = CAP.ocr.matched; CAP.ocrChoice = null; CAP.manualName = '';
        refreshIf('visit-capture');
      }, 900);
    },
    pickCand(id) { CAP.ocrPick = id; CAP.ocrChoice = null; App.refresh(); },
    ocrDecide(choice) {
      CAP.ocrChoice = choice;
      if (choice === 'link') { const c = CAP.ocr.candidates.find((x) => x.id === CAP.ocrPick); App.toast(`已关联 ${c ? c.name : '门店'}`, { icon: 'check', bottom: true }); }
      else App.toast('已记为新店草稿，等待去重审核', { icon: 'plus', bottom: true });
      App.refresh();
    },
    ocrChange() { CAP.ocrChoice = null; App.refresh(); },
    manualName() { App.prompt('手填门店名', '如：蜀香居川菜馆', (v) => { if (!v.trim()) return; CAP.manualName = v.trim(); App.toast('已手填门店名，将进入候选去重', { icon: 'check', bottom: true }); App.refresh(); }); },
    addPhoto() {
      if (CAP.photos.length >= PHOTO_SEQ.length) { App.toast('演示样本：已提供 3 张现场照片', { icon: 'image' }); return; }
      const done = App.loading('拍摄中…');
      setTimeout(() => { done(); CAP.photos.push(PHOTO_SEQ[CAP.photos.length]); refreshIf('visit-capture'); }, 500);
    },
    removePhoto(i) { CAP.photos.splice(i, 1); CAP.photos.forEach((p, k) => { p.label = PHOTO_SEQ[k] ? PHOTO_SEQ[k].label : p.label; }); App.refresh(); },
    mic() {
      const r = CAP.rec;
      if (r.status === 'idle' || r.status === 'done') {
        CAP.rec = { status: 'recording', seconds: 0, text: '', typed: 0 };
        App.refresh();
        clearInterval(recTimer);
        recTimer = setInterval(() => {
          if (!alive('visit-capture') || CAP.rec.status !== 'recording') { clearInterval(recTimer); return; }
          CAP.rec.seconds++;
          const el = App.q('.vis-timer');
          if (el) el.textContent = '00:0' + CAP.rec.seconds;
          if (CAP.rec.seconds >= REC_LIMIT) S_VISIT.stopRec();
        }, 1000);
      } else if (r.status === 'recording') {
        S_VISIT.stopRec();
      }
    },
    stopRec() {
      clearInterval(recTimer); recTimer = null;
      if (CAP.rec.status !== 'recording') return;
      if (CAP.rec.seconds < 1) CAP.rec.seconds = 1;
      CAP.rec.status = 'transcribing';
      App.refresh();
      setTimeout(() => {
        if (CAP.rec.status !== 'transcribing') return;
        CAP.rec.status = 'done'; CAP.rec.text = DATA.demoTranscript; CAP.rec.typed = 0;
        refreshIf('visit-capture');
      }, 1100);
    },
    reRecord() { CAP.rec = { status: 'idle', seconds: 0, text: '', typed: 0 }; App.refresh(); },
    toggleText(on) { CAP.textMode = !!on; App.refresh(); if (on) setTimeout(() => { const ta = App.q('#visText'); if (ta) ta.focus(); }, 50); },
    onText(v) { CAP.text = v; const c = App.q('#visText'); if (c) { /* 不重绘，避免失焦 */ } },
    saveDraft() {
      clearTimers();
      if (CAP.sub.status === 'running') return;
      CAP.sub = { status: 'idle', stage: 0, pct: 0, lines: [], error: '' };
      CAP.resumed = hasContent();
      App.toast('本地草稿已保存', { icon: 'check' });
      setTimeout(() => App.back(), 350);
    },
    /* ---- 提交状态机 ---- */
    submit() {
      if (CAP.sub.status === 'running') return; // 重复点击不重复建记录
      if (!hasContent()) { App.toast('请先拍照或口述/输入文字', { icon: 'info' }); return; }
      if (CAP.rec.status === 'recording') S_VISIT.stopRec();
      const gen = ++CAP.gen;
      CAP.sub = { status: 'running', stage: 0, pct: 8, lines: [], error: '' };
      const media = CAP.photos.length + (CAP.ocr && CAP.ocr.status === 'done' ? 1 : 0);
      const spd = speechText();
      CAP.sub.lines.push({ text: `本地草稿已保存（${media} 张照片${CAP.rec.status === 'done' ? `、录音 ${CAP.rec.seconds} 秒` : (spd ? `、文字 ${spd.length} 字` : '')}）` });
      App.refresh(); App.scrollTop();
      const step = (ms, fn) => setTimeout(() => { if (gen !== CAP.gen || CAP.sub.status !== 'running' || !alive('visit-capture')) return; fn(); refreshIf('visit-capture'); }, ms);
      const runUpload = () => {
        step(500, () => { CAP.sub.stage = 1; CAP.sub.pct = 30; CAP.sub.lines.push({ text: `上传 ${media} 张照片（压缩后 ${(media * 0.4).toFixed(1)}MB）` }); });
        step(1300, () => {
          if (CAP.sim.offline) { CAP.sub.status = 'error'; CAP.sub.pct = 38; CAP.sub.lines.push({ text: '上传失败：网络中断 · 内容已保存为本地草稿', tone: 'error' }); return; }
          CAP.sub.pct = 52;
          CAP.sub.lines.push({ text: CAP.rec.status === 'done' ? `上传录音 ${CAP.rec.seconds} 秒（${CAP.rec.seconds * 16}KB）` : (spd ? '上传文字记录' : '无录音 · 仅照片') });
          runAI();
        });
      };
      const runAI = () => {
        step(600, () => { CAP.sub.stage = 2; CAP.sub.pct = 66; CAP.sub.lines.push({ text: CAP.rec.status === 'done' ? `转写 ${CAP.rec.seconds} 秒录音` : (spd ? '解析文字记录' : '识别照片可见信息') }); });
        step(1500, () => {
          if (CAP.sim.aiFail) { CAP.sub.status = 'ai_error'; CAP.sub.pct = 70; CAP.sub.lines.push({ text: 'AI 暂不可用，原始录音与照片已保存，可人工填写事实', tone: 'error' }); return; }
          CAP.sub.pct = 84; CAP.sub.lines.push({ text: '抽取结构化字段…（接触对象 / 需求 / 观察 / 承诺 / 下一步）' });
        });
        step(2300, () => { CAP.sub.pct = 95; CAP.sub.lines.push({ text: '标注缺失项与待核实项 · 不填造姓名 / 预算' }); });
        step(2900, () => { CAP.sub.stage = 3; CAP.sub.pct = 100; CAP.sub.lines.push({ text: '待确认事实已生成' }); S_VISIT.finish(false); });
      };
      S_VISIT._runUpload = runUpload; S_VISIT._runAI = runAI;
      runUpload();
    },
    retry() {
      if (CAP.sub.status !== 'error') return;
      CAP.sim.offline = false;
      CAP.sub.status = 'running';

        contact: ['联系人姓名 · 角色', '如：王女士 店长', (val) => { const p = val.trim().split(/[\s·/]+/); v.contact = Object.assign({}, v.contact, { name: p[0] || '', role: p[1] || (v.contact && v.contact.role) || '', decision: (v.contact && v.contact.decision) || '对接人', source: '销售填写' }); }],
        decision: ['补充决策人姓名（可留空）', '如：李老板 · 无法核实请留空', (val) => { v.decisionMaker = Object.assign({}, v.decisionMaker, { name: val.trim(), status: val.trim() ? '销售补充 · 待核实' : '待核实' }); }],
        needs: ['需求 / 异议', '如：希望先看每月服务方案；担心影响营业', (val) => { v.needs = val.trim() ? [val.trim()] : []; }],
        observations: ['现场观察（描述即可，不下结论）', '如：后厨墙角疑似鼠迹', (val) => { const first = (v.observations || [])[0]; v.observations = val.trim() ? [Object.assign({}, typeof first === 'object' ? first : {}, { text: val.trim(), tag: (first && first.tag) || '销售描述 · 非确认虫害' })] : []; }],
        result: ['本次结果', '如：需求初步确认，等待决策人沟通', (val) => { v.result = val.trim(); }],
        next: ['下一步', '如：下周老板到店时带方案沟通', (val) => { v.next = val.trim(); }],
        planDate: ['计划日期（YYYY-MM-DD，可留空）', '如：2026-09-15', (val) => { const d = val.trim(); if (d && !/^\d{4}-\d{2}-\d{2}$/.test(d)) { App.toast('日期格式：2026-09-15', { icon: 'alert' }); return false; } v.planDate = d; }],
      };
      const m = map[field]; if (!m) return;
      App.prompt(m[0], m[1], (val) => { if (val == null) return; set(m[2])(val); });
    },
    supplement() { App.toast('点击任一字段即可修改；缺失项可留空', { icon: 'edit', bottom: true }); const el = App.q('.screen:not(.under) .vis-facts'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    confirm() {
      const v = getVisit(CONF.id); if (!v) return;
      if (CONF.sync.status !== 'idle') return; // 重复点击不重复写入
      const items = keyItems(v);
      if (items.some((it) => !CONF.keys[it.k])) { App.toast('请逐项确认关键信息', { icon: 'shield' }); return; }
      const gen = ++CONF.gen;
      const reqId = 'REQ-20260907-0' + (140 + (v.id.length % 9));
      v.status = 'saved'; v.confirmedAt = '2026-09-07 15:03'; v.confirmedBy = App.me().name; v.requestId = reqId; App.save();
      CONF.sync = { status: 'running', stage: 0, lines: [{ text: '本系统已保存 · 已确认事实与原始证据（录音 / 照片）落库' }] };
      App.refresh(); App.scrollTop();
      const step = (ms, fn) => setTimeout(() => { if (gen !== CONF.gen || !alive('visit-confirm')) return; fn(); refreshIf('visit-confirm'); }, ms);
      step(800, () => { CONF.sync.stage = 1; CONF.sync.lines.push({ text: `待同步 CRM · 请求 ID ${reqId}（去重，重试不重复建记录）` }); });
      step(1900, () => {
        if (CONF.sim.crmTimeout) { CONF.sync.status = 'error'; CONF.sync.lines.push({ text: 'CRM 同步超时 · 本系统已保存，稍后自动重试', tone: 'error' }); return; }
        S_VC.finishSync(v);
      });
    },
    retrySync() {
      const v = getVisit(CONF.id); if (!v || CONF.sync.status !== 'error') return;
      CONF.sim.crmTimeout = false; CONF.sync.status = 'running'; CONF.sync.lines.push({ text: `重试同步 · 同一请求 ID ${v.requestId || ''}，不新增记录` });
      App.refresh();
      const gen = CONF.gen;
      setTimeout(() => { if (gen !== CONF.gen || !alive('visit-confirm')) return; S_VC.finishSync(v); refreshIf('visit-confirm'); }, 900);
    },
    finishSync(v) {
      CONF.sync.stage = 2; CONF.sync.status = 'done'; CONF.sync.lines.push({ text: 'CRM 同步成功 · 已进入正式统计' });
      if (v.id === 'v_bing_new') { DATA.confirmDemoVisit(App.state); }
      else {
        v.status = 'synced'; v.confirmedAt = v.confirmedAt || '2026-09-07 15:03';
        const st = App.store(v.storeId);
        if (st) { st.lastVisit = { date: v.time ? v.time.slice(0, 10) : App.TODAY, type: v.type, result: v.result || (v.next ? '下一步：' + v.next : '已确认'), by: v.by || App.me().name }; st.updatedAt = '2026-09-07 15:03'; }
      }
      // 从"我的 · 草稿"移除
      if (App.state.sync && App.state.sync.drafts) App.state.sync.drafts = App.state.sync.drafts.filter((d) => d.visitId !== v.id);
      if (App.state.notifications) App.state.notifications = App.state.notifications.filter((n) => n.visitId !== v.id);
      App.save();
    },
  };

  App.register('visit-confirm', {
    nav(params) { const v = App.visit(params.id); return { title: v && v.status === 'synced' && CONF.sync.status === 'done' ? '拜访已确认' : '确认拜访事实' }; },
    tab: 'customers',

    rules: ['不填造老板姓名（待核实）', '"疑似鼠迹"不写成确认虫害', '预算未提及不强填', '承诺 / 金额 / 日期单独确认', '本系统已保存 ≠ CRM 同步成功', '请求 ID 去重，重试不重复建记录'],
    render(params) {
      const id = params.id;
