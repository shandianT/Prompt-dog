      const v = getVisit(id);
      if (!v) return ui.empty({ icon: 'doc', title: '未找到拜访记录', sub: '该记录可能已被清理或未生成' });
      const st = App.store(v.storeId) || {};
      const opp = App.opp(v.oppId);
      const done = CONF.sync.status === 'done';
      const busy = CONF.sync.status === 'running' || CONF.sync.status === 'error';
      const head = `<div class="card vis-head">
        <div class="row between top">
          <div class="grow"><div class="row gap6 wrap">${ui.chip(v.type || '拜访', 'info', { sm: true })}${ui.visitStatusChip(v.status)}</div><div class="vis-head-t mt8">${esc(st.name || '未知门店')}</div><div class="small muted mt4">${esc(v.time || '')} · ${esc(v.by || '')}${opp ? ` · ${esc(opp.service)} · ${esc(opp.kind)}` : ''}</div></div>
          <div class="cell-icon">${App.icon('store', 20)}</div>
        </div>
        ${v.storeLink && /新店草稿/.test(v.storeLink) ? `<div class="mt8">${ui.chip(v.storeLink, 'warn', { sm: true, icon: 'plus' })}</div>` : ''}
      </div>`;
      const missing = (v.aiMissing || []).length ? ui.notice('warn', `<b>缺失项提示</b><ul class="vis-ul">${v.aiMissing.map((m) => `<li>${esc(m)}</li>`).join('')}</ul><div class="tiny mt4">低质量内容给缺口提示，不整条拒收；可补充或留空后确认。</div>`, 'alert') : '';
      if (done) {
        return `${successCard(v)}${head}${ui.section('已确认事实', ui.factTag('fact'))}<div class="vis-facts">${factsCard(v, true)}</div>${transcriptCard(v)}${photosCard(v)}`;
      }
      return `${head}${busy ? syncCard(v) : ''}<div class="${busy ? 'vis-dim' : ''}">
        ${transcriptCard(v)}
        ${photosCard(v)}
        ${ui.section('AI 整理的待确认事实', ui.factTag('derived'), '点击字段可修改')}
        ${v.aiFailed ? ui.notice('ai', 'AI 未处理本次内容：以下字段为空，请人工填写；原始录音与照片已保留。', 'sparkle') : ''}
        <div class="vis-facts">${factsCard(v, false)}</div>
        ${keyCard(v)}
        ${missing}
        <div class="tiny muted" style="text-align:center;padding:0 8px 6px">确认后一次写入：本系统保存 → 回写 CRM；AI 建议只在商机推进卡上出现，不改正式值。</div>
      </div>`;
    },
    footer(params) {
      const v = App.visit(params.id); if (!v) return '';
      if (CONF.sync.status === 'done') {
        const opp = App.opp(v.oppId);
        const label = v.id === 'v_bing_new' ? '查看商机推进卡 · AI 建议已生成' : '查看商机推进卡';
        return `<div class="col gap6">${opp ? ui.btn(label, { tone: v.id === 'v_bing_new' ? 'ai' : 'primary', block: true, icon: 'sparkle', onclick: `App.go('opportunity',{id:'${opp.id}'})` }) : ''}<button class="btn ghost block" onclick="S_VC.backToCustomer()">返回客户</button></div>`;
      }
      if (CONF.sync.status === 'running') return `<button class="btn primary block" disabled>${App.icon('refresh', 18, 'spin')}写入中 · 请勿重复提交</button>`;
      if (CONF.sync.status === 'error') return `<div class="btn-row"><button class="btn ghost" onclick="S_VC.backToCustomer()">返回客户</button><button class="btn primary" onclick="S_VC.retrySync()">${App.icon('refresh', 18)}重试同步</button></div>`;
      const items = keyItems(v); const done = items.filter((it) => CONF.keys[it.k]).length;

      return `<div class="btn-row"><button class="btn ghost" onclick="S_VC.supplement()">${App.icon('edit', 18)}补充 / 修改</button><button class="btn primary" id="vcConfirm" ${ready ? '' : 'disabled'} onclick="S_VC.confirm()">${App.icon('check', 18)}确认并保存${ready ? '' : `（${done}/${items.length}）`}</button></div>`;

    demoActions: [
      { label: '一键确认全部关键信息', icon: 'check', run() { S_VC.confirmAll(); } },
      { label: '模拟 CRM 超时', icon: 'cloud-off', run() { CONF.sim.crmTimeout = true; if (CONF.sync.status === 'idle') { S_VC.confirmAll(); S_VC.confirm(); } else App.toast('已设置：CRM 同步将超时', { icon: 'cloud-off' }); } },
    ],
  });
  S_VC.backToCustomer = function () {
    if (App.stack.some((e) => e.id === 'customer')) App.popTo('customer');

  /* ============================================================
     三、拜访详情（只读）
     ============================================================ */
  App.register('visit-detail', {
    title: '拜访详情',
    tab: 'customers',
    prd: ['F03 已确认事实与草稿明确区分', '10.2 本系统已保存 / CRM 同步成功'],
    rules: ['已确认事实只读，修改需新记录', '派生判断保存输入快照'],
    render(params) {
      const v = App.visit(params.id);

      const isFact = v.status === 'synced' || v.status === 'saved';
      const head = `<div class="card vis-head">
        <div class="row between top"><div class="grow"><div class="row gap6 wrap">${ui.chip(v.type || '拜访', 'info', { sm: true })}${ui.visitStatusChip(v.status)}${isFact ? ui.factTag('fact') : ui.factTag('pending')}</div><div class="vis-head-t mt8">${esc(st.name || '未知门店')}</div><div class="small muted mt4">${esc(v.time || '')} · ${esc(v.by || '')}</div></div><div class="cell-icon">${App.icon('store', 20)}</div></div>
        <div class="divider"></div>
        <div class="row between"><span class="small muted">确认人 / 时间</span><span class="small">${esc(v.confirmedBy || v.by || '')} · ${esc(v.confirmedAt || v.time || '')}</span></div>

      </div>`;
      const kv = [
        ['联系人', c.name || c.role ? `${esc(c.name || '（未提供姓名）')}${c.role ? ` · ${esc(c.role)}` : ''}${c.decision ? ` <span class="muted">（${esc(c.decision)}）</span>` : ''}` : '<span class="muted">—</span>'],
      ];

      kv.push(['需求', list(v.needs).length ? list(v.needs).map(esc).join('；') : '<span class="muted">未提及</span>']);
      if (list(v.objections).length) kv.push(['异议', list(v.objections).map(esc).join('；')]);
      kv.push(['现场观察', obs.length ? obs.map((o) => `<div>${esc(o.text)}${o.tag ? ` ${ui.chip(o.tag.indexOf('疑似') >= 0 ? '销售描述的疑似 · 非确认虫害' : o.tag, 'warn', { sm: true })}` : ''}</div>`).join('') : '<span class="muted">无</span>']);
      kv.push(['结果', v.result ? esc(v.result) : '<span class="muted">—</span>']);
      kv.push(['下一步', v.next ? esc(v.next) : '<span class="muted">—</span>']);
      kv.push(['计划日期', v.planDate ? esc(dateLabel(v.planDate)) : '<span class="muted">未填写</span>']);
      if (v.budget) kv.push(['金额 / 预算', esc(v.budget.value || v.budget.status)]);
      const commit = (cust.length || sales.length) ? `<div class="card"><div class="card-title">${App.icon('handshake', 16)}承诺${ui.factTag('fact')}</div>${cust.map((t) => `<div class="vis-cm"><span class="chip brand sm">客户</span><span>${esc(t)}</span></div>`).join('')}${sales.map((t) => `<div class="vis-cm"><span class="chip info sm">销售</span><span>${esc(t)}</span></div>`).join('')}</div>` : '';
      return `${head}
        ${ui.section('已确认事实', isFact ? ui.factTag('fact') : ui.factTag('pending'))}
        <div class="card">${ui.kv(kv)}</div>
        ${commit}
        ${transcriptCard(v)}
        ${photosCard(v)}
        <div class="list">${opp ? ui.cell({ title: `${esc(opp.service)} · ${esc(opp.kind)}`, sub: `商机推进卡 · ${esc(opp.stage)} · ${App.tierLabel(opp.tier)}`, icon: 'briefcase', onclick: `App.go('opportunity',{id:'${opp.id}'})` }) : ''}${st.id ? ui.cell({ title: esc(st.name), sub: '客户详情 · 统一时间线', icon: 'store', onclick: `App.go('customer',{id:'${st.id}'})` }) : ''}</div>

    },
  });
})();

</script>

    .opp-stage .lbl { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-top: 8px; }
    .opp-stage .txt { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }
    .opp-ka .f { display: flex; gap: 10px; padding: 9px 0; border-top: .5px solid var(--line); font-size: 13px; line-height: 1.45; align-items: flex-start; }
    .opp-ka .f:first-child { border-top: 0; }
    .opp-ka .f .k { width: 108px; flex: none; color: var(--ink-3); }
    .opp-ka .f .k .st { display: block; font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }
    .opp-ka .f .v { flex: 1; min-width: 0; color: var(--ink); }
    .opp-ka .f.need { background: #fffaf0; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
    .opp-ka .f.need .k { color: #b45309; }
  `);

  /* ---------- 常量 ---------- */
  const STAGES = [
    { name: '待触达', facts: ['门店存在', '地址正确', '归属明确'], exit: '有真实接触结果；无人接待保留待触达并约下次' },
    { name: '已触达', facts: ['对接人角色', '当前服务状态', '是否允许继续联系'], exit: '找到有效需求或明确无意向；拍照不算有效接触' },
    { name: '需求确认', facts: ['客户要解决的问题、风险点', '现供应商', '时间要求', '谁决定'], exit: '客户确认问题及下一次沟通；安排必要勘查' },
    { name: '方案沟通', facts: ['服务范围、频次', '客户现场证据', '方案反馈'], exit: '客户已收到并给出反馈；仅生成文档不推进阶段' },
    { name: '报价商务', facts: ['预算口径', '报价版本', '付款约定', '异议', '审批状态'], exit: '商务条件确认，报价按规则批准' },
    { name: '待签约', facts: ['合同主体', '服务承诺', '报价与合同版本'], exit: '有可核验签署结果后进入已赢单' },
    { name: '已赢单 / 已丢单 / 暂停培育', short: '结果', facts: ['权威签约信息', '已确认客户反馈'], exit: '赢单交接；丢单写原因；培育写触发条件或复访日期', terminal: true },
  ];
  const ALL_STAGES = ['待触达', '已触达', '需求确认', '方案沟通', '报价商务', '待签约', '已赢单', '已丢单', '暂停培育'];
  const LOCKED = ['已赢单', '已丢单'];
  const TIERS = [
    { v: 'unknown', sub: '没有足够有效接触记录，或证据相互冲突' },
    { v: 'none', sub: '客户明确拒绝、暂无需求或已确认的限制' },
    { v: 20, sub: '有效接触并出现初步需求，关键人/时间尚缺' },
    { v: 50, sub: '需求较清楚，关键角色和时间有证据' },
    { v: 80, sub: '方案与关键商务条件基本达成，有签约推进安排' },
  ];
  const KIND_TONE = { 新购: 'brand', 续约: 'info', 增购: 'violet' };
  const stageIdx = (st) => { const i = STAGES.findIndex((s) => s.name === st); if (i >= 0) return i; return ['已赢单', '已丢单', '暂停培育'].includes(st) ? 6 : 0; };
  const tl = (t) => App.tierLabel(t);

  /* ---------- 工具 ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  S.addDays = (s, n) => { const d = App.dayjs((s || App.TODAY).slice(0, 10)); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  // 演示时钟：固定演示日 + 递增分钟，保证记录有先后
  S.stamp = function () { const u = App.state.ui = App.state.ui || {}; u.clock = (u.clock || 0) + 1; return `${App.TODAY} 15:${pad(Math.min(59, 6 + u.clock * 2))}`; };
  const hist = (opp) => (opp.history = opp.history || []);
  const tierSourceLabel = (s) => { if (!s) return '—'; if (/^CRM ·/.test(s)) return '来自 ' + s; return s; };
  const kindChip = (k) => ui.chip(k, KIND_TONE[k] || 'gray');
  const nextObj = (n) => (typeof n === 'string' ? { text: n } : (n || null));

  S.isConfirmed = (opp) => !!opp.aiConfirmed || (opp.id === 'o_bing' && !!(App.state.demo && App.state.demo.oppConfirmed));
  S.confirmInfo = (opp) => opp.aiConfirmed || (opp.id === 'o_bing' ? { at: `${App.TODAY} 15:08`, taskId: 't_bing_next', from: { stage: '已触达', tier: 20 } } : null);

  // 回访日期优先级：客户约定 > 已接受任务 > 规则周期
  S.revisit = function (opp) {
    const open = App.state.tasks.filter((t) => t.oppId === opp.id && (t.status === 'todo' || t.status === 'doing')).sort((a, b) => (a.due < b.due ? -1 : 1));
    const agreed = open.find((t) => t.source === '客户约定') || null;
    const accepted = open.find((t) => t.source !== '客户约定' && !(t.source === 'AI建议' && !t.aiConfirmed)) || null;
    const rule = (App.state.settings && App.state.settings.revisitRule) || {};
    const days = rule.enabled ? rule[opp.tier] : null;
    const store = App.store(opp.storeId);
    const base = (store && store.lastVisit && store.lastVisit.date) || opp.updatedAt || App.TODAY;
    const ruleDate = days ? S.addDays(base, days) : null;
    const effective = agreed ? 'agreed' : accepted ? 'accepted' : ruleDate ? 'rule' : 'none';
    return { agreed, accepted, days, ruleDate, base, effective, rule };
  };

  /* ---------- 商机推进卡 ---------- */
  function headerCard(opp, store) {
    return `<div class="card">
      <div class="opp-store" onclick="App.go('customer',{id:'${store.id}'})"><span class="ellipsis">${esc(store.name)}</span>${icon('chevron-right', 18)}</div>
      <div class="muted small mt4">${esc(store.type)} · ${esc(store.street || store.district)} · ${esc(store.address)}</div>
      <div class="chips mt8">${ui.chip(opp.service, 'outline', { icon: 'bug' })}${kindChip(opp.kind)}${ui.chip('负责人 ' + opp.ownerName, 'gray', { icon: 'user' })}${store.group ? ui.chip('KA · ' + store.group.name, 'info', { icon: 'building' }) : ''}</div>
    </div>`;
  }

  function officialCard(opp) {
    return `<div class="card">
      <div class="card-title">正式值 ${ui.factTag('official')}<span class="grow"></span><span class="muted tiny" style="font-weight:400">更新 ${esc(App.fmt.md(opp.updatedAt))}</span></div>
      <div class="opp-official">
        <div class="ov"><div class="l">正式阶段</div>${ui.stageChip(opp.stage)}<div class="src">按证据进度推进，变更需原因</div></div>
        <div class="ov"><div class="l">正式分层（258）</div>${ui.tierChip(opp.tier)}<div class="src">${esc(tierSourceLabel(opp.tierSource))}</div></div>
      </div>
      <div class="opp-note">${icon('info', 13)}<span>258 为业务标签，非统计校准的赢单概率；签约以权威事件为准</span></div>
      <div class="row mt12">
        ${ui.btn('阶段变更', { tone: 'ghost', size: 'xs', onclick: `S_OPP.changeStage('${opp.id}')` })}
        ${ui.btn('分层调整', { tone: 'ghost', size: 'xs', onclick: `S_OPP.changeTier('${opp.id}')` })}
        <span class="grow"></span>
        <span class="link small" onclick="App.go('opportunity-stage',{id:'${opp.id}'})">查看阶段证据清单 ›</span>
      </div>
    </div>`;
  }

  function statesCard(opp, store) {
    const others = App.oppsOf(store.id).filter((o) => o.id !== opp.id);
    return `<div class="card">
      <div class="card-title">三组状态分开看<span class="muted tiny" style="font-weight:400">互不覆盖 · 阶段与分层挂在商机上</span></div>
      <div class="opp-states">
        <div class="opp-state"><div class="l">合作状态</div>${ui.coopChip(store.coop)}<div class="s">门店 · 合同/服务信息</div></div>
        <div class="opp-state"><div class="l">商机阶段</div>${ui.stageChip(opp.stage)}<div class="s">商机 · 证据进度</div></div>
        <div class="opp-state"><div class="l">意向分层</div>${ui.tierChip(opp.tier)}<div class="s">商机 · 258 业务标签</div></div>
      </div>
      ${others.length ? `<div class="muted tiny mt8">同店其他商机：${others.map((o) => `<span class="link" onclick="App.go('opportunity',{id:'${o.id}'})">${esc(o.kind + ' ' + o.service)}</span> · ${esc(o.stage)} · ${esc(tl(o.tier))}`).join('；')}（互不覆盖）</div>` : ''}
    </div>`;
  }

  function aiCard(opp) {
    const ai = opp.ai;
    if (!ai) {
      return ui.notice('gray', `<div>确认拜访事实后生成建议（AI 不覆盖正式值）</div><div class="tiny muted mt4">建议将附依据、缺失证据、置信度与规则版本，需人工确认后才写入正式值</div><div class="mt8">${ui.btn('记录拜访', { tone: 'secondary', size: 'sm', icon: 'camera', onclick: `App.go('visit-capture',{storeId:'${opp.storeId}',oppId:'${opp.id}'})` })}</div>`, 'sparkle');
    }
    const tierDelta = ai.tier !== opp.tier ? `<span class="delta">正式 ${esc(tl(opp.tier))} → ${esc(tl(ai.tier))}</span>` : '<span class="delta">与正式值一致</span>';
    const stageDelta = ai.stage !== opp.stage ? `<span class="delta">正式 ${esc(opp.stage)} → ${esc(ai.stage)}</span>` : '<span class="delta">与正式值一致</span>';
    const nexts = (ai.next || []).map(nextObj);
    const body = `
      ${ai.conflict ? `<div class="notice warn" style="margin-bottom:10px">${icon('alert', 16)}<div><b>${esc(ai.reviewStatus === '待复核' ? '待主管复核' : ai.reviewStatus || '待主管复核')}</b> · ${esc(ai.conflict)}<div class="tiny mt4">不自动降级、不改变跟进责任；复核前正式分层保持 ${esc(tl(opp.tier))}</div></div></div>` : ''}
      <div class="opp-ai-grid">
        <div class="g"><div class="l">建议分层</div><div class="v">${ui.chip(tl(ai.tier), 'ai')}${tierDelta}</div></div>
        <div class="g"><div class="l">建议阶段</div><div class="v">${ui.chip(ai.stage, 'ai')}${stageDelta}</div></div>
        <div class="g"><div class="l">置信度</div><div class="v">${esc(ai.confidence || '—')}</div></div>
        <div class="g"><div class="l">规则版本</div><div class="v">${esc(ai.ruleVersion || '258 规则 v0.1-demo')}</div></div>
      </div>
      <div class="opp-ai-list">
        <h5>${icon('file', 13)}依据</h5>${(ai.basis || []).length ? `<ul>${ai.basis.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : '<div class="none">无</div>'}
        <h5>${icon('warning', 13)}缺失证据</h5>${(ai.missing || []).length ? `<ul>${ai.missing.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : '<div class="none">无缺失项</div>'}
        <h5>${icon('arrow-right', 13)}建议下一步</h5>${nexts.length ? nexts.map((n, i) => `<div class="opp-next"><div class="n">${i + 1}</div><div class="grow"><div>${esc(n.text)}</div>${n.date || n.type ? `<div class="meta">${n.date ? esc(App.fmt.mdw(n.date)) : ''}${n.date && n.type ? ' · ' : ''}${n.type ? esc(n.type) : ''}${n.date ? ' · 来源 客户约定' : ''}</div>` : ''}</div></div>`).join('') : '<div class="none">无</div>'}
      </div>`;
    return ui.aiCard({ title: 'AI 建议 · 258 分层与阶段', meta: `派生数据 · 不改正式值 · 基于 ${App.fmt.md(opp.updatedAt)} 已确认事实`, body, note: ai.note ? esc(ai.note) : '用户可"一次确认"或"拒绝并说明"，未确认前正式值不变' });
  }

  function confirmedNotice(opp) {
    const c = S.confirmInfo(opp); if (!c) return '';
    const task = c.taskId && App.task(c.taskId);
    return `<div class="notice ok opp-confirmed">${icon('check-circle', 16)}<div><b>已一次确认</b>（${esc(c.at)}）：阶段 ${esc(c.from.stage)} → ${esc(opp.stage)} · 分层 ${esc(tl(c.from.tier))} → ${esc(tl(opp.tier))}${task ? ` · 任务草稿「${esc(task.title)}」已写入` : (c.dedup ? ' · 任务同周期去重，未新建' : '')}
      <div class="btn-row">${task ? ui.btn('查看任务', { tone: 'outline', size: 'sm', icon: 'list', onclick: `App.go('task',{id:'${task.id}'})` }) : ''}${ui.btn('生成方案', { tone: 'primary', size: 'sm', icon: 'doc', onclick: `App.go('proposal-new',{oppId:'${opp.id}'})` })}</div></div></div>`;
  }

  function rejectedCard(opp) {
    const r = opp.aiRejected; if (!r) return '';
    return `<div class="opp-rejected">
      <div class="row"><b>已拒绝 AI 建议</b>${ui.chip(r.review ? '已转主管复核' : '原因已记录', r.review ? 'warn' : 'gray', { sm: true })}<span class="grow"></span><span class="tiny muted">${esc(r.at)}</span></div>
      <div class="mt4">原因：${esc(r.reason)}</div>
      <div class="tiny muted mt4">正式值未变化 · 可补事实重算或转主管复核</div>
      <div class="btn-row mt8">${ui.btn('补充事实', { tone: 'secondary', size: 'sm', icon: 'camera', onclick: `App.go('visit-capture',{storeId:'${opp.storeId}',oppId:'${opp.id}'})` })}${ui.btn(r.review ? '已转主管复核' : '转主管复核', { tone: 'ghost', size: 'sm', icon: 'users', disabled: !!r.review, onclick: `S_OPP.toReview('${opp.id}')` })}</div>
    </div>`;
  }

  function actionsCard(opp) {
    const done = opp.done || [], missing = opp.missing || [];
    return `<div class="card">
      <div class="card-title">已完成 / 缺失动作</div>
      ${opp.stallReason ? `<div class="mb8">${ui.chip('停滞原因: ' + opp.stallReason, 'warn', { icon: 'alert', cls: 'opp-wrapchip' })}</div>` : ''}
      ${opp.reconnect ? `<div class="mb8">${ui.chip('重新联系条件: ' + opp.reconnect, 'gray', { icon: 'clock', cls: 'opp-wrapchip' })}</div>` : ''}
      <div class="opp-cols">
        <div><h5 class="ok">${icon('check-circle', 14)}已完成 ${done.length}</h5>${done.length ? done.map((d) => `<div class="opp-item done">${icon('check', 14)}<span>${esc(d)}</span></div>`).join('') : '<div class="muted small">暂无</div>'}</div>
        <div><h5>${icon('warning', 14)}缺失 ${missing.length}</h5>${missing.length ? missing.map((m) => `<div class="opp-item miss">${icon('clock', 14)}<span>${esc(m)}</span></div>`).join('') : '<div class="muted small">无缺失项</div>'}</div>
      </div>
    </div>`;
  }

  function revisitCard(opp) {
    const rv = S.revisit(opp);
    const on = (k) => (rv.effective === k ? 'on' : '');
    const tag = (k) => (rv.effective === k ? ui.chip('生效', 'brand', { sm: true }) : '');
    return `<div class="card">
      <div class="card-title">回访规则<span class="grow"></span>${ui.chip('演示规则', 'warn', { sm: true })}</div>
      <div class="muted small mb8">回访日期优先级：客户约定 &gt; 已接受任务 &gt; 规则周期（${esc(rv.rule.label || '演示规则 20%=7天 · 50%=3天 · 80%=1天')}）</div>
      <div class="opp-rule">
        <div class="r ${on('agreed')}"><div class="rank">1</div><div class="v"><b>客户约定</b>${rv.agreed ? ` · ${esc(App.fmt.mdw(rv.agreed.due))} · <span class="link" onclick="App.go('task',{id:'${rv.agreed.id}'})">${esc(rv.agreed.title)}</span>` : ' · 暂无销售确认的客户约定日期'}</div>${tag('agreed')}</div>
        <div class="r ${on('accepted')}"><div class="rank">2</div><div class="v"><b>已接受任务</b>${rv.accepted ? ` · ${esc(App.fmt.mdw(rv.accepted.due))} · <span class="link" onclick="App.go('task',{id:'${rv.accepted.id}'})">${esc(rv.accepted.title)}</span>` : ' · 暂无'}</div>${tag('accepted')}</div>
        <div class="r ${on('rule')}"><div class="rank">3</div><div class="v"><b>规则周期</b>${rv.days ? ` · ${esc(tl(opp.tier))}=${rv.days} 天 · 自最近有效跟进 ${esc(App.fmt.md(rv.base))} 起 → ${esc(App.fmt.mdw(rv.ruleDate))}${rv.ruleDate < App.TODAY ? '（已过，以上一级为准）' : ''}` : ` · 分层「${esc(tl(opp.tier))}」未配置周期，不生成规则型任务`}</div>${tag('rule')}</div>
      </div>
      ${rv.agreed ? `<div class="notice info" style="margin:10px 0 0">${icon('info', 16)}<div>已存在客户约定任务，同一商机同一周期的规则型提醒<b>已去重</b>，不再重复生成</div></div>` : ''}
      <div class="tiny muted mt8">资料编辑、AI 重算、创建草稿、发送系统提醒不重置跟进计时；仅发材料无反馈只记"已发送"</div>
    </div>`;
  }

  function historyCard(opp) {
    const h = opp.history || []; if (!h.length) return '';
    return `<div class="card"><div class="card-title">变更记录<span class="muted tiny" style="font-weight:400">跳级/退回/拒绝均留原因</span></div>${ui.timeline(h.map((x) => ({ time: x.time, tag: x.type, title: esc(x.title), body: x.body ? esc(x.body) : '', tone: x.tone || '' })))}</div>`;
  }

  App.register('opportunity', {
    title: '商机推进卡', tab: 'customers',
    prd: ['F04 阶段、258 与下一步行动', '6.1 三组状态分开', '6.2 地推 Playbook', '6.4 258 建议与回访规则', '7 页面表·商机推进卡'],
    rules: ['AI 建议不覆盖正式值，确认后一次写入', '258 为业务标签，非成交概率', '赢单只能来自权威签约事件', '拒绝建议须记录原因，可重算或转复核', '回访日期：客户约定 > 已接受任务 > 规则周期', '旧快照分析不覆盖新建议', '同一商机同一周期规则任务去重'],
    demoActions: [{ label: '模拟旧快照分析（不覆盖新建议）', icon: 'history', run() { S.oldSnapshot(); } }],
    render(params) {
      const opp = App.opp(params.id);
      if (!opp) return ui.empty({ icon: 'trend', title: '商机不存在', sub: '该商机未纳入演示数据', action: ui.btn('返回', { tone: 'ghost', size: 'sm', onclick: 'App.back()' }) });
      const store = App.store(opp.storeId) || { id: '', name: '—', type: '', address: '', coop: 'none' };
      const confirmed = S.isConfirmed(opp);
      return [
        headerCard(opp, store),
        officialCard(opp),
        statesCard(opp, store),
        opp.ai && confirmed ? confirmedNotice(opp) : '',
        opp.ai && opp.aiRejected ? rejectedCard(opp) : '',
        aiCard(opp),
        actionsCard(opp),
        revisitCard(opp),
        historyCard(opp),
      ].join('');
    },
    footer(params) {
      const opp = App.opp(params.id); if (!opp) return '';
      const id = opp.id;
      const sub = `<div class="opp-foot-sub">${ui.btn('阶段变更', { tone: 'ghost', size: 'sm', onclick: `S_OPP.changeStage('${id}')` })}${ui.btn('分层调整', { tone: 'ghost', size: 'sm', onclick: `S_OPP.changeTier('${id}')` })}</div>`;
      if (!opp.ai) return ui.btn('记录拜访 · 确认事实后生成建议', { block: true, icon: 'camera', onclick: `App.go('visit-capture',{storeId:'${opp.storeId}',oppId:'${id}'})` }) + sub;
      if (S.isConfirmed(opp)) {
        const c = S.confirmInfo(opp); const task = c && c.taskId && App.task(c.taskId);
        return `<div class="btn-row">${task ? ui.btn('查看任务', { tone: 'secondary', icon: 'list', onclick: `App.go('task',{id:'${task.id}'})` }) : ui.btn('记录拜访', { tone: 'secondary', icon: 'camera', onclick: `App.go('visit-capture',{storeId:'${opp.storeId}',oppId:'${id}'})` })}${ui.btn('生成方案', { icon: 'doc', onclick: `App.go('proposal-new',{oppId:'${id}'})` })}</div>`;
      }
      if (opp.aiRejected) return ui.btn('补充事实重算（记录拜访）', { block: true, icon: 'camera', onclick: `App.go('visit-capture',{storeId:'${opp.storeId}',oppId:'${id}'})` }) + sub;
      if (opp.ai.conflict) {
        return `<div class="btn-row">${ui.btn('拒绝建议并说明', { tone: 'outline', icon: 'x', onclick: `S_OPP.reject('${id}')` })}${ui.btn('补充事实', { icon: 'camera', onclick: `App.go('visit-capture',{storeId:'${opp.storeId}',oppId:'${id}'})` })}</div><div class="tiny muted mt8" style="text-align:center">降层建议已进入主管复核，复核通过前不可直接确认；补充事实 = 记录拜访后重算</div>`;
      }
      return ui.btn('一次确认：阶段 + 分层 + 任务草稿', { block: true, icon: 'check-circle', onclick: `S_OPP.confirmSuggestion('${id}')` })
        + `<div class="opp-foot-sub">${ui.btn('拒绝建议并说明', { tone: 'outline', size: 'sm', icon: 'x', onclick: `S_OPP.reject('${id}')` })}${ui.btn('阶段变更', { tone: 'ghost', size: 'sm', onclick: `S_OPP.changeStage('${id}')` })}${ui.btn('分层调整', { tone: 'ghost', size: 'sm', onclick: `S_OPP.changeTier('${id}')` })}</div>`;
    },
  });

  /* ---------- 一次确认 ---------- */
  S.findDup = function (opp, n) {
    const open = App.state.tasks.filter((t) => t.oppId === opp.id && (t.status === 'todo' || t.status === 'doing'));
    if (n && n.date) return open.find((t) => t.due === n.date) || null;
    const rv = S.revisit(opp); const span = rv.days || 7; const limit = S.addDays(App.TODAY, span);
    return open.find((t) => t.due >= App.TODAY && t.due <= limit) || null;
  };
  S.confirmSuggestion = function (id) {
    const opp = App.opp(id); if (!opp || !opp.ai) return;
    const ai = opp.ai; const n = nextObj((ai.next || [])[0]); const dup = S.findDup(opp, n); const rv = S.revisit(opp);
    const stageLine = ai.stage !== opp.stage ? `${esc(opp.stage)} → <b>${esc(ai.stage)}</b>` : `保持 <b>${esc(opp.stage)}</b>`;
    const tierLine = ai.tier !== opp.tier ? `${esc(tl(opp.tier))} → <b>${esc(tl(ai.tier))}</b>` : `保持 <b>${esc(tl(opp.tier))}</b>`;
    let taskLine = '无建议任务';
    if (n && dup) taskLine = `已存在「${esc(dup.title)} · ${esc(App.fmt.md(dup.due))}」，同一商机同一周期去重，不再新建`;
    else if (n) { const due = n.date || rv.ruleDate || S.addDays(App.TODAY, 3); taskLine = `新建「${esc(n.text)}」 · ${esc(App.fmt.md(due))} · 来源 ${n.date ? '客户约定' : 'AI建议（本次确认）'}`; }
    App.modal({
      title: '一次确认',
      body: `<div class="small muted mb8">以下将一次写入正式值，减少多次弹窗</div>${ui.kv([['阶段', stageLine], ['分层', tierLine], ['任务草稿', taskLine]])}<div class="tiny muted mt12">确认人 ${esc(App.me().name)} · 记录来源为 AI 建议 ${esc(ai.ruleVersion || '258 规则 v0.1-demo')}；签约状态不在此处变更</div>`,
      actions: [{ label: '取消', tone: 'ghost' }, { label: '确认', tone: 'primary', onClick: () => S.applyConfirm(id, n, dup) }],
    });
  };
  S.applyConfirm = function (id, n, dup) {
    const opp = App.opp(id); const ai = opp.ai; const at = S.stamp();
    const from = { stage: opp.stage, tier: opp.tier };
    let taskId = null;
    if (id === 'o_bing') {
      window.DATA.confirmDemoOpp(App.state); taskId = 't_bing_next';
    } else {
      opp.stage = ai.stage; opp.tier = ai.tier; opp.tierSource = '确认 · 9/7（依据 AI 建议）'; opp.updatedAt = App.TODAY;
      if (n && dup) taskId = dup.id;
      else if (n) {
        const rv = S.revisit(opp); const due = n.date || rv.ruleDate || S.addDays(App.TODAY, 3);
        const task = { id: App.uid('t'), storeId: opp.storeId, oppId: opp.id, title: n.text, type: n.type || '回访', ownerId: opp.ownerId, ownerName: opp.ownerName, due, time: '', status: 'todo',
          source: n.date ? '客户约定' : 'AI建议', aiConfirmed: true, confirmedAt: at,
          reason: n.date ? `客户约定日期 ${App.fmt.md(n.date)}，优先于规则周期` : `AI 建议下一步，已由 ${App.me().name} 一次确认`,
          evidence: [`拜访记录 ${App.fmt.md(opp.updatedAt)} · 已确认事实`], expected: n.text, dedup: '同一商机同一周期规则型提醒不再重复生成' };
        App.state.tasks.unshift(task); taskId = task.id;
      }
    }
    opp.aiConfirmed = { at, taskId, from, dedup: !!dup };
    const task = taskId && App.task(taskId);
    hist(opp).unshift({ time: at, type: '一次确认', title: `阶段 ${from.stage} → ${opp.stage} · 分层 ${tl(from.tier)} → ${tl(opp.tier)}`, body: task ? `任务草稿：${task.title} · ${App.fmt.md(task.due)}` : '无新任务（同周期去重）', tone: '' });
    App.save();
    App.toast('已确认：阶段 · 分层 · 任务草稿一次写入', { icon: 'check-circle', duration: 2000 });
    App.refresh();
  };

  /* ---------- 拒绝 / 复核 ---------- */
  S.reject = function (id) {
    App.prompt('拒绝建议并说明原因', '例如：口头意向不代表决策人态度，暂不升 50%', (v) => {
      const reason = (v || '').trim(); if (!reason) { App.toast('拒绝需要填写原因'); return; }
      const opp = App.opp(id); const at = S.stamp();
      opp.aiRejected = { reason, at };
      hist(opp).unshift({ time: at, type: '拒绝建议', title: '已拒绝 AI 建议 · 正式值未变', body: '原因：' + reason, tone: 'gray' });
      App.save(); App.toast('已记录拒绝原因 · 正式值未变化'); App.refresh();
    });
  };
  S.toReview = function (id) {
    const opp = App.opp(id); if (!opp || !opp.aiRejected) return;
    const at = S.stamp(); opp.aiRejected.review = true; opp.aiRejected.reviewAt = at;
    hist(opp).unshift({ time: at, type: '转主管复核', title: '已转主管复核', body: '进入待复核队列，复核前不改变分层与跟进责任', tone: 'warn' });
    App.save(); App.toast('已转主管复核 · 进入待复核队列', { icon: 'users' }); App.refresh();
  };

  /* ---------- 手动阶段 / 分层（需原因；赢单/丢单锁定） ---------- */
  S.changeStage = function (id) {
    const opp = App.opp(id); if (!opp) return;
    const items = ALL_STAGES.map((st) => {
      const locked = LOCKED.includes(st); const cur = st === opp.stage;
      return {
        label: st, locked,
        sub: locked ? '由权威签约事件/确认反馈产生，不可手动设置' : cur ? '当前阶段' : st === '暂停培育' ? '需写触发条件或复访日期' : '',
        right: cur ? '当前' : '', icon: locked ? 'lock' : undefined,
        onSelect: () => { if (locked) { App.toast('赢单/丢单只能来自权威签约事件或已确认客户反馈', { icon: 'lock', duration: 2200 }); return; } if (cur) { App.toast('已是当前阶段'); return; } S.applyStage(id, st); },
      };
    });
    App.sheet({ title: '阶段变更 · 允许有证据的跳级/退回，需填写原因', items });
    App.qa('.sheet-item').forEach((n, i) => { if (items[i] && items[i].locked) n.classList.add('opp-locked'); });
  };
  S.applyStage = function (id, st) {
    App.prompt(`变更阶段为「${st}」的原因 / 证据`, st === '暂停培育' ? '请写触发条件或复访日期，例如：装修完成后（约 11 月）复访' : '例如：客户已确认问题并约定下次沟通时间', (v) => {
      const reason = (v || '').trim(); if (!reason) { App.toast('阶段变更需要填写原因'); return; }
      const opp = App.opp(id); const at = S.stamp(); const from = opp.stage;
      opp.stage = st; opp.updatedAt = App.TODAY;
      hist(opp).unshift({ time: at, type: stageIdx(st) < stageIdx(from) ? '阶段退回' : '阶段变更', title: `阶段 ${from} → ${st}（手动）`, body: '原因：' + reason, tone: '' });
      App.save(); App.toast('阶段已变更 · 原因已记录', { icon: 'check-circle' }); App.refresh();
    });
  };
  S.changeTier = function (id) {
    const opp = App.opp(id); if (!opp) return;
    App.sheet({ title: '分层调整（258 业务标签）· 需填写原因', items: TIERS.map((t) => ({ label: tl(t.v), sub: t.sub, right: String(t.v) === String(opp.tier) ? '当前' : '', onSelect: () => {
      if (String(t.v) === String(opp.tier)) { App.toast('已是当前分层'); return; }
      App.prompt(`调整分层为「${tl(t.v)}」的原因`, '例如：决策人明确表示暂无需求（9/7 到店）', (v) => {
        const reason = (v || '').trim(); if (!reason) { App.toast('分层调整需要填写原因'); return; }
        const o = App.opp(id); const at = S.stamp(); const from = o.tier;
        o.tier = t.v; o.tierSource = '确认 · 9/7（手动）'; o.updatedAt = App.TODAY;
        hist(o).unshift({ time: at, type: '分层调整', title: `分层 ${tl(from)} → ${tl(t.v)}（手动）`, body: '原因：' + reason, tone: '' });
        App.save(); App.toast('分层已调整 · 原因已记录', { icon: 'check-circle' }); App.refresh();
      });
    } })) });
  };

  /* ---------- 演示动作：旧快照分析 ---------- */
  S.oldSnapshot = function () {
    const top = App.currentEntry(); const opp = top && App.opp(top.params.id); if (!opp) return;
    const at = S.stamp(); const oldDate = App.fmt.md(S.addDays(opp.updatedAt || App.TODAY, -5));
    hist(opp).unshift({ time: at, type: '旧快照分析', title: `旧快照分析结果到达（基于 ${oldDate} 数据），已丢弃`, body: `快照早于当前正式值/建议更新时间（${App.fmt.md(opp.updatedAt)}），不覆盖新建议；仅留记录`, tone: 'gray' });
    App.save();
    App.toast(`旧快照（${oldDate}）分析晚到，不覆盖 ${App.fmt.md(opp.updatedAt)} 的新建议`, { icon: 'history', duration: 2600 });
    App.refresh();
  };

  /* ---------- 阶段证据清单（Playbook） ---------- */
  function kaFields(opp, store) {
    const ka = opp.ka || {}; const contacts = store.contacts || [];
    const byRole = (d) => contacts.filter((c) => c.decision === d).map((c) => `${c.name}（${c.role}${c.verified ? '' : ' · 待核实'}）`).join('、');
    const roles = ['使用方', '决策人', '采购方'].map((d) => { const v = byRole(d); return v ? `${d === '决策人' ? '决策方' : d} ${v}` : null; }).filter(Boolean).join(' · ');
    return [
      { k: '集团/子公司关系', stage: '已触达', v: store.group ? `${store.group.name} · 签约主体 ${store.group.entity} · ${store.group.sites} 个服务点` : null },
      { k: '使用方/决策方/采购方', stage: '需求确认', v: roles || null },
      { k: '现场审核要求', stage: '需求确认', v: ka.auditReq || null },
      { k: '勘查结论', stage: '方案沟通', v: ka.surveyResult || null },
      { k: '服务边界', stage: '方案沟通', v: ka.serviceBoundary || null },
      { k: '成本核算', stage: '报价商务', v: ka.costing || null },
      { k: '账期', stage: '报价商务', v: ka.paymentTerms || null },
      { k: '非标承诺与审批', stage: '报价商务', v: ka.nonStandard || null },
      { k: '首次服务交接', stage: '待签约', v: ka.handover || null },
    ];
  }

  App.register('opportunity-stage', {
    title: '阶段证据清单', tab: 'customers',
    prd: ['6.2 地推 Playbook 七阶段', '6.3 KA Playbook 增补', 'F04 阶段、258 与下一步行动'],
    rules: ['允许有证据的跳级/退回/重开，记录原因', '仅生成文档不推进阶段', '有可核验签署结果后才进入已赢单', 'KA 首期不要求填满所有字段'],
    render(params) {
      const opp = App.opp(params.id);
      if (!opp) return ui.empty({ icon: 'layers', title: '商机不存在' });
      const store = App.store(opp.storeId) || { name: '—', contacts: [] };
      const idx = stageIdx(opp.stage); const isKA = !!store.group;
      const missing = opp.missing || [], done = opp.done || [];
      const head = `<div class="card">
        <div class="row between"><div class="grow"><div class="bold" style="font-size:16px">${esc(store.name)}</div><div class="muted small mt4">${esc(opp.kind)} · ${esc(opp.service)} · ${isKA ? 'KA Playbook（含增补字段）' : '地推 Playbook 七阶段'}</div></div>${ui.stageChip(opp.stage)}</div>
        <div class="mt12">${ui.stepper(STAGES.map((s) => s.short || s.name), idx)}</div>
        <div class="muted tiny mt8">当前第 ${idx + 1} / 7 阶段 · 每阶段列出"要确认的业务事实"与"退出证据"，缺失项来自商机推进卡</div>
      </div>`;
      const cards = STAGES.map((s, i) => {
        const cls = i < idx ? 'done' : i === idx ? 'current' : 'future';
        return `<div class="opp-stage ${cls} ${s.terminal ? 'terminal' : ''}">
          <div class="num">${i < idx ? icon('check', 14) : i + 1}</div>
          <div class="grow">
            <div class="t">${esc(s.name)}${i === idx ? ui.chip('当前', 'brand', { sm: true }) : i < idx ? ui.chip('已完成', 'ok', { sm: true }) : ''}${s.terminal ? ui.chip('权威事件产生', 'gray', { sm: true, icon: 'lock' }) : ''}</div>
            <div class="lbl">要确认的业务事实</div><div class="txt">${s.facts.map(esc).join(' · ')}</div>
            <div class="lbl">退出证据 / 下一步</div><div class="txt">${esc(s.exit)}</div>
            ${i === idx && done.length ? `<div class="lbl">已具备</div><div class="chips mt4">${done.map((d) => ui.chip(d, 'ok', { sm: true, icon: 'check' })).join('')}</div>` : ''}
            ${i === idx && missing.length ? `<div class="lbl">当前缺失</div><div class="chips mt4">${missing.map((m) => ui.chip(m, 'warn', { sm: true })).join('')}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      let ka = '';
      if (isKA) {
        const fields = kaFields(opp, store);
        ka = `${ui.section('KA 增补证据', ui.chip('6.3', 'gray', { sm: true }), 'KA PLAYBOOK')}
          <div class="notice info">${icon('info', 16)}<div>首期不要求填满所有字段，按阶段展示当前需要补的证据；标黄为「${esc(opp.stage)}」阶段应具备的项</div></div>
          <div class="card opp-ka">${fields.map((f) => `<div class="f ${f.stage === opp.stage ? 'need' : ''}"><div class="k">${esc(f.k)}<span class="st">${esc(f.stage)} 阶段</span></div><div class="v">${f.v ? esc(f.v) : ui.chip('待补', 'warn', { sm: true })}</div></div>`).join('')}</div>`;
      }
      const foot = `<div class="notice gray">${icon('shield', 16)}<div>允许有证据的跳级、退回和重开，都记录原因；不会因为拜访次数多、发了方案或 AI 判断热情就自动赢单。</div></div>`;
      return head + cards + ka + foot;
    },
    footer(params) {
      const opp = App.opp(params.id); if (!opp) return '';
      return `<div class="btn-row">${ui.btn('阶段变更（需原因）', { tone: 'outline', icon: 'edit', onclick: `S_OPP.changeStage('${opp.id}')` })}${ui.btn('返回推进卡', { tone: 'primary', icon: 'trend', onclick: 'App.back()' })}</div>`;
    },
  });
})();

</script>
<script>
/* ============================================================
   方案工作台 / 方案详情 — proposal.js
   页面：proposal-new（向导：选模板 → 输入确认 → 照片位置 → 生成 → 预览确认）、proposal（方案详情/版本/事件/反馈）
   依据：PRD 7 页面表（方案工作台）、7.1 典型交互、F06 餐饮单店方案与模板库、R04 / R11
   ============================================================ */
(function () {
  'use strict';
  const P = window.S_PROP = {};
  const esc = (s) => App.esc(s);

  const STEPS = ['选模板', '输入确认', '照片位置', '生成', '预览确认'];
  const GEN_STAGES = ['组装客户信息与现场观察', '填充已确认需求', '服务范围与安排', '客户配合事项', '待确认项', '排版 PDF 草稿'];
  const POS = ['封面', '现场观察', '附录', '不使用'];
  const STATUS = {
    draft: ['草稿', 'gray'], confirmed: ['已确认', 'brand'], exported: ['已导出', 'info'], marked_sent: ['已标记发送', 'ok'],
    superseded: ['已被新版本替代', 'gray'], internal: ['内部草稿 · 待技术复核', 'warn'],
  };
  const EQUIP_PENDING = '待勘查确认（不从照片推定）';
  const FREQ_DEFAULT = '按模板默认 · 可修改';
  // 模板默认内容（来自已审核模板；不含价格、不从照片推定设备数量）
  const TPL = {
    tpl_rest_pest: {
      docTitle: '有害生物防治服务方案', scope: '鼠类 + 蟑螂防治 · 月度 1 次 · 首次强化', equipment: '饵站 / 胶饵点位数量',
      rows: [
        ['鼠类防治', '每月 1 次', '饵站 / 粘鼠板布设，孔洞封堵建议'],
        ['蟑螂防治', '每月 1 次', '胶饵 + 缝隙处理，避开食品加工面'],
        ['首次强化', '首月加做 1 次', '集中处理现场观察到的风险点位'],
        ['服务记录', '每次服务后', '照片 + 记录单，风险点位复核'],
      ],
      coop: ['封堵后厨、仓库的孔洞与门缝（服务人员现场标示）', '作业前清理地面食源、积水与杂物', '作业安排在打烊后或营业前，单店约 40–60 分钟', '指定对接人配合进出、签字与问题反馈'],
    },
    tpl_rest_toilet: {
      docTitle: '卫生间深度清洁服务方案', scope: '卫生间深度清洁 · 月度 1 次', equipment: '卫生间数量与洁具数',
      rows: [['深度清洁', '每月 1 次', '洁具、地面、墙面及通风口除垢消毒'], ['异味处理', '每月 1 次', '地漏与排水口处理'], ['服务记录', '每次服务后', '照片 + 记录单']],
      coop: ['作业时段避开高峰，约 60 分钟', '提供水电接入与门禁配合'],
    },
  };

  let W = null; // 向导状态（模块内，可在向导中途返回后恢复）

  /* ---------- 工具 ---------- */
  const pad = (n) => (n < 10 ? '0' : '') + n;
  const lines = (v) => String(v || '').split('\n').map((s) => s.trim()).filter(Boolean);
  function addMin(t, m) { const d = new Date(t.replace(' ', 'T') + ':00'); d.setMinutes(d.getMinutes() + m); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function nextTime(p) {
    const last = p && p.events && p.events.length ? p.events[p.events.length - 1].t : '';
    const base = last && last.slice(0, 10) >= App.TODAY ? last : `${App.TODAY} 15:19`;
    return addMin(base, 1);
  }
  const fmtT = (t) => (t ? `${App.fmt.md(t).replace('月', '/').replace('日', '')}${App.fmt.hm(t) ? ' ' + App.fmt.hm(t) : ''}` : '');
  const tplOf = (id) => App.by(App.state.templates, 'id', id) || {};
  const tplData = (id) => TPL[id] || TPL.tpl_rest_pest;
  const segmentOf = (store) => (/^餐饮/.test((store && store.type) || '') ? '餐饮单店' : '食品工厂');
  const statusChip = (st, sm) => { const s = STATUS[st] || [st, 'gray']; return App.ui.chip(s[0], s[1], { sm, icon: st === 'confirmed' || st === 'marked_sent' ? 'check' : '' }); };
  const propStatus = (p) => (p.internal && p.status === 'draft' ? 'internal' : p.status);
  const ownerOf = (opp) => Object.values(App.state.users).find((u) => u.id === (opp && opp.ownerId)) || App.me();
  const proposalIdFor = (oppId) => (oppId === 'o_bing' ? 'p_bing' : `p_${String(oppId).replace(/^o_/, '')}_new`);
  const isHere = (id) => { const e = App.currentEntry(); return !!e && e.id === id; };

  function versionsOf(p) {
    if (p.versions) return p.versions;

      if (!opp || !store) return `<div class="card">${App.ui.empty({ icon: 'doc', title: '未找到商机', sub: '请从客户详情或商机推进卡发起方案' })}</div>`;
      if (store.perm === 'minimal') return `<div class="card">${App.ui.empty({ icon: 'lock', title: '该门店已有负责人跟进', sub: '无权限发起方案，可申请协作', action: App.ui.btn('申请协作', { tone: 'outline', size: 'sm', onclick: `App.go('collab-request',{storeId:'${store.id}'})` }) })}</div>`;
      const tpl = tplOf(W.templateId);
      let h = headHtml(opp, store, tpl, W.step, W.step === 3 && W.gen.error);
      if (W.step === 0) h += stepTemplate(store);
      else if (W.step === 1) h += stepInputs();
      else if (W.step === 2) h += stepPhotos();
      else if (W.step === 3) h += stepGenerate();
      else h += stepPreview();
      return h;
    },
    footer() {
      if (!W) return '';
      const opp = App.opp(W.oppId); const store = opp ? App.store(opp.storeId) : null;
      if (!opp || !store || store.perm === 'minimal') return '';
      return wizardFooter(W.proposalId ? App.proposal(W.proposalId) : null);
    },
    mount() {
      if (W && W.step === 3 && !W.gen.running && !W.gen.error && !W.gen.done) startGen();
    },
  });

  /* ---------- 页面：proposal（方案详情） ---------- */
  function detailFooter(p) {
    const b = App.ui.btn; const id = p.id;
    if (p.internal && p.status === 'draft') {
      const sent = p.pendingReview && p.pendingReview.some((r) => r.version === p.version);
      return sent ? b('已转技术复核 · 等待结果', { tone: 'ghost', block: true, icon: 'beaker', disabled: true }) : b('仅内部草稿 · 转技术复核', { tone: 'primary', block: true, icon: 'beaker', onclick: `S_PROP.toReview('${id}')` });
    }
    if (p.status === 'draft') return `<div class="btn-row">${b('重新生成（新版本）', { tone: 'ghost', icon: 'refresh', onclick: `S_PROP.regen('${id}')` })}${b('人工确认', { tone: 'primary', icon: 'check', onclick: `S_PROP.confirm('${id}')` })}</div>`;
    if (p.status === 'confirmed') return `<div class="btn-row">${b('导出 PDF', { tone: 'primary', icon: 'file', onclick: `S_PROP.exportPdf('${id}')` })}${b('标记已发送', { tone: 'secondary', icon: 'send', onclick: `S_PROP.markSent('${id}')` })}</div>`;
    if (p.status === 'exported') return `<div class="btn-row">${b('再次导出', { tone: 'ghost', icon: 'file', onclick: `S_PROP.exportPdf('${id}')` })}${b('标记已发送', { tone: 'primary', icon: 'send', onclick: `S_PROP.markSent('${id}')` })}</div>`;
    return `<div class="btn-row">${b('再次导出', { tone: 'ghost', icon: 'file', onclick: `S_PROP.exportPdf('${id}')` })}${b(p.feedback ? '更新客户反馈' : '记录客户反馈', { tone: 'primary', icon: 'message', onclick: `S_PROP.feedback('${id}')` })}</div>`;
  }
  App.register('proposal', {
    tab: 'customers', title: '方案详情',
    prd: ['F06 餐饮单店方案与模板库', '7 页面表·方案工作台（版本 / 事件）', '6.1 三组状态分开：仅生成/发送方案不推进阶段'],
    rules: ['保留输入快照、模板版本、生成版本和确认人', '已确认版本不可被覆盖；重新生成产生新版本', '记录 生成 / 导出 / 人工标记发送 三个事件', '导出≠客户已收到或已接受', '发送无反馈只记"已发送"；获得反馈后才可作为阶段退出证据', '专业项缺失 → 内部草稿 + 待技术复核'],
    demoActions: [{ label: '模拟客户反馈：有异议（演示）', icon: 'message', run() {
      const e = App.currentEntry(); const p = e && App.proposal(e.params.id); if (!p) return;
      ensureVersions(p); const t = nextTime(p);
      p.feedback = { kind: '有异议', detail: '担心夜间作业影响收档；希望明确首次强化时长', at: t, by: App.me().name };
      p.events.push({ t, e: '记录客户反馈（有异议）', kind: 'feedback' });
      App.save(); App.refresh(); App.toast('已记录客户反馈（演示）', { icon: 'message' });
    } }],
    render(params) {
      const p = App.proposal(params.id);
      if (!p) return `<div class="card">${App.ui.empty({ icon: 'doc', title: '未找到方案', sub: '可从商机推进卡或客户详情发起方案', action: App.ui.btn('返回', { tone: 'outline', size: 'sm', onclick: 'App.back()' }) })}</div>`;
      const m = modelFromProposal(p); const s = m.store; const tpl = m.tpl;
      const st = propStatus(p);
      const vers = versionsOf(p).slice().sort((a, b) => b.v - a.v);
      let h = `<div class="card pp-head">
        <div class="row top"><div class="cell-icon">${App.icon('doc', 20)}</div><div class="grow"><div class="bold" style="font-size:16px;line-height:1.3">${esc(s.name || '')}</div><div class="small muted mt4">${esc(tpl.name || m.td.docTitle)} · 模板 ${esc(p.templateVersion)} · 当前 v${p.version} / 共 ${versionsOf(p).length} 版</div></div></div>
        <div class="row wrap mt12 gap6">${statusChip(st)}${p.confirmedBy ? App.ui.chip(`确认人 ${p.confirmedBy}${m.confirmedAt ? ' · ' + fmtT(m.confirmedAt) : ''}`, 'outline', { sm: true, icon: 'user' }) : App.ui.chip('未人工确认', 'outline', { sm: true })}</div>
        <div class="row mt12 gap6 pp-links"><span class="pp-link" onclick="App.go('opportunity',{id:'${p.oppId}'})">${App.icon('trend', 14)}商机推进卡${App.ui.stageChip(m.opp.stage || '')}</span><span class="pp-link" onclick="App.go('customer',{id:'${p.storeId}'})">${App.icon('store', 14)}客户详情${App.icon('chevron-right', 14)}</span></div>
      </div>`;
      if (p.internal && p.status === 'draft') h += App.ui.notice('warn', '本方案含专业判断项，仅为内部草稿；技术复核通过前不可对外导出或发送。', 'beaker');
      h += App.ui.section('方案预览', `<span class="muted">固定版式 PDF 草稿</span>`);
      h += versionStrip(p);
      h += paperHtml(m);
      h += App.ui.section('版本列表', `<span class="muted">${vers.length} 个版本</span>`);
      h += `<div class="list">${vers.map((v) => { const cur = v.v === p.version; const vs = v.status === 'draft' && p.internal && cur ? 'internal' : v.status; const locked = ['confirmed', 'exported', 'marked_sent'].includes(v.status);
        return `<div class="pp-vrow ${cur ? 'cur' : ''}"><div class="pp-vno">v${v.v}</div><div class="grow"><div class="row"><span class="bold" style="font-size:14px">版本 v${v.v}</span>${cur ? App.ui.chip('当前', 'brand', { sm: true }) : ''}${statusChip(vs, true)}</div><div class="tiny muted mt4">输入快照 ${esc(fmtT(v.snapshotAt))} · 模板 ${esc(v.templateVersion)} · 生成 ${esc(fmtT(v.createdAt))}${v.confirmedBy ? ` · 确认人 ${esc(v.confirmedBy)}` : ''}</div>${locked ? `<div class="tiny mt4" style="color:var(--brand-3)">${App.icon('lock', 11)} 已确认版本不可被覆盖${cur ? '' : '，可恢复查看'}</div>` : ''}</div></div>`; }).join('')}</div>`;
      h += App.ui.section('事件记录', `<span class="muted">${p.events.length} 条</span>`);
      h += `<div class="card">${App.ui.timeline(p.events.slice().reverse().map((e) => { const k = eventKind(e); return { time: fmtT(e.t), tag: EVENT_TAG[k], title: esc(e.e), tone: EVENT_TONE[k], body: k === 'export' ? '导出≠客户已收到或已接受' : (k === 'sent' ? '由人触发；无客户反馈前只记"已发送"' : (k === 'gen' ? 'AI 按已审核模板组装，产出为草稿' : '')) }; }))}
        <div class="tiny muted">${App.icon('info', 11)} 记录"生成 / 导出 / 人工标记发送"三个事件；导出不等于客户已收到或已接受。</div></div>`;
      h += App.ui.section('客户反馈', p.feedback ? App.ui.chip(p.feedback.kind, p.feedback.kind === '认可' ? 'ok' : (p.feedback.kind === '有异议' ? 'warn' : 'gray'), { sm: true }) : '');
      if (p.feedback) h += `<div class="card"><div class="row"><div class="cell-icon ${p.feedback.kind === '有异议' ? 'warn' : (p.feedback.kind === '认可' ? '' : 'gray')}">${App.icon(p.feedback.kind === '认可' ? 'thumbs' : (p.feedback.kind === '有异议' ? 'alert' : 'clock'), 20)}</div><div class="grow"><div class="bold" style="font-size:14.5px">${esc(p.feedback.kind)}${p.feedback.detail ? ` · ${esc(p.feedback.detail)}` : ''}</div><div class="tiny muted mt4">${esc(fmtT(p.feedback.at))} · ${esc(p.feedback.by)} 记录</div></div></div>
        ${App.ui.notice(p.feedback.kind === '未回复' ? 'gray' : 'ok', p.feedback.kind === '未回复' ? '未回复不构成反馈，商机仍停留在方案沟通；请继续回访。' : '已获得客户反馈，可作为方案沟通阶段退出证据；阶段变更需在商机推进卡人工确认。', p.feedback.kind === '未回复' ? 'clock' : 'check-circle')}</div>`;
      else h += `<div class="card"><div class="row"><div class="cell-icon gray">${App.icon('message', 20)}</div><div class="grow"><div class="bold" style="font-size:14.5px">暂无客户反馈</div><div class="tiny muted mt4">发送后需回访确认 · 获得反馈后才可作为方案沟通阶段退出证据</div></div></div><div class="mt12">${App.ui.btn('记录客户反馈', { tone: 'outline', size: 'sm', block: true, icon: 'message', onclick: `S_PROP.feedback('${p.id}')` })}</div></div>`;
      if (p.pendingReview && p.pendingReview.length) {
        h += App.ui.section('待技术复核', App.ui.chip(`${p.pendingReview.length} 项`, 'warn', { sm: true }));
        h += `<div class="list">${p.pendingReview.map((r) => App.ui.cell({ title: esc(r.item), sub: `转 ${esc(r.to)} · ${esc(fmtT(r.at))} · ${esc(r.by)} 发起 · v${r.version || p.version}`, icon: 'beaker', iconTone: 'warn', right: App.ui.chip(r.status, 'warn', { sm: true }), arrow: false })).join('')}</div>`;
      }
      h += `<div class="pp-caption">${App.icon('shield', 12)}方案保留输入快照、模板版本、生成版本与确认人；仅生成 / 发送方案不推进商机阶段。</div>`;
      return h;
    },
    footer(params) { const p = App.proposal(params.id); return p ? detailFooter(p) : ''; },
  });
})();

</script>
<script>
/* ============================================================
   工作助手：销售问答（assistant）/ 知识条目（faq）/ 转技术协助（tech-request）/ 主管问数（ask）
   规则：只引用已发布知识；建议对客表达 + 依据 + 适用限制；内部提示单独标注；
         未收录 → 待核实 + 转技术协助；问数含期间/口径/样本量/更新时间，金额未接入不推算。
   ============================================================ */
(function () {
  'use strict';
  const S = window.S_AST = {};
  const esc = (s) => App.esc(s);
  const ui = () => App.ui;

  /* ---------- 工具 ---------- */
  const norm = (s) => String(s == null ? '' : s).trim().replace(/[？?！!。，,、\s"“”]/g, '').toLowerCase();
  const pubFaq = () => (App.state.faq || []).filter((f) => f.status === '已发布');
  const faqById = (id) => App.by(App.state.faq, 'id', id);
  const GUARANTEE = ['保证', '承诺', '根除', '一定', '肯定', '100%', '绝对', '永远', '不再有'];
  const UNKNOWN_Q = '你们能保证一年不再有老鼠吗？';

  function hits(f, q) { const nq = norm(q); let n = 0; (f.keywords || []).forEach((k) => { if (k && nq.includes(norm(k))) n++; }); return n; }
  function overlap(f, q) { const a = new Set(norm(f.q).split('')); let c = 0; norm(q).split('').forEach((ch) => { if (a.has(ch)) c++; }); return c; }

  S.related = function (q, n = 2) {
    const pub = pubFaq();
    const scored = pub.map((f) => ({ f, s: hits(f, q) * 3 + overlap(f, q) })).sort((a, b) => b.s - a.s);
    const top = scored.filter((x) => x.s > 0).slice(0, n).map((x) => x.f);
    for (const f of pub) { if (top.length >= n) break; if (!top.includes(f)) top.push(f); }
    return top.map((f) => f.id);
  };

  // 检索：仅已发布知识参与；保证/承诺类问题不编造；已失效仅提示不引用
  S.match = function (q) {
    const nq = norm(q);
    const pub = pubFaq();
    const exact = pub.find((f) => norm(f.q) === nq);
    if (exact) return { kind: 'answer', faqId: exact.id };
    const related = S.related(q, 2);
    if (GUARANTEE.some((g) => nq.includes(norm(g)))) {
      return { kind: 'unknown', related, why: '问题涉及"保证 / 承诺"类表述：已发布知识中没有可引用的依据，不能替公司作出承诺。' };
    }
    const scored = pub.map((f) => ({ f, h: hits(f, q), o: overlap(f, q) })).filter((x) => x.h > 0).sort((a, b) => b.h - a.h || b.o - a.o);
    if (scored.length) return { kind: 'answer', faqId: scored[0].f.id };
    const expired = (App.state.faq || []).filter((f) => f.status === '已失效').find((f) => hits(f, q) > 0);
    if (expired) return { kind: 'expired', faqId: expired.id, related };
    return { kind: 'unknown', related };
  };

  const suggestList = () => pubFaq().map((f) => f.q).concat([UNKNOWN_Q]);

  /* ---------- 片段 ---------- */
  const aiAv = () => `<div class="ast-av">${App.icon('sparkle', 14)}</div>`;
  const msgUser = (text) => `<div class="msg me">${ui().avatar(App.me().name, 'sm')}<div class="bubble">${esc(text)}</div></div>`;
  const msgAI = (inner, rich) => `<div class="msg ${rich ? 'ast-rich' : ''}">${aiAv()}<div class="bubble">${inner}</div></div>`;
  const typingHtml = () => `<div class="msg" id="ast-typing">${aiAv()}<div class="bubble"><div class="ast-typing"><i></i><i></i><i></i></div></div></div>`;
  const kindChip = (f) => ui().chip(f.kind, f.kind === 'FAQ' ? 'brand' : 'info', { sm: true });
  const scopeChips = (f, sm) => `${ui().chip(f.service, 'outline', { sm })}${ui().chip(f.segment, 'outline', { sm })}${ui().chip(f.region, 'outline', { sm })}`;

  function srcBlock(f) {
    return `<div class="ast-src"><div class="ast-label">${App.icon('shield', 12)}依据</div>
      <div class="r"><span class="k">来源</span><span class="v">${esc(f.source)}</span></div>
      <div class="r"><span class="k">审核人</span><span class="v">${esc(f.reviewer)}</span></div>
      <div class="r"><span class="k">版本</span><span class="v">${esc(f.version)} · 已发布</span></div>
      <div class="r"><span class="k">有效期</span><span class="v">至 ${esc(f.validUntil)}</span></div></div>`;
  }
  const internalBlock = (f) => f.internal ? `<div class="ast-internal"><div class="ast-label">${App.icon('lock', 12)}内部销售提示 · 不进入对客文本</div><div>${esc(f.internal)}</div></div>` : '';
  const limitBlock = (f) => f.limits ? `<div class="ast-limit">${App.icon('alert', 14)}<div><b>适用限制</b>${esc(f.limits)}</div></div>` : '';

  function answerHtml(f) {
    return `<div class="row between mb8"><div class="row gap6 grow" style="min-width:0">${kindChip(f)}<span class="small muted ellipsis">${esc(f.q)}</span></div>${ui().chip('已审核发布', 'ok', { sm: true, icon: 'check' })}</div>
      <div class="ast-label">建议对客表达</div>
      <div class="ast-answer">${esc(f.answer)}</div>
      ${srcBlock(f)}
      ${limitBlock(f)}
      <div class="chips mt8">${scopeChips(f, true)}</div>
      ${internalBlock(f)}
      <div class="btn-row mt12">${ui().btn('打开来源', { tone: 'secondary', size: 'sm', icon: 'link', onclick: `App.go('faq',{id:'${f.id}'})` })}${ui().btn('反馈', { tone: 'ghost', size: 'sm', icon: 'thumbs', onclick: `S_AST.feedback('${f.id}')` })}</div>`;
  }
  function unknownHtml(m, i) {
    return `<div class="row gap6 mb8">${ui().factTag('pending')}<span class="tiny muted">已发布知识中无匹配条目</span></div>
      <div class="ast-answer">未检索到依据，暂不能给出公司承诺。已标记待核实。</div>
      ${m.why ? `<div class="ast-src">${esc(m.why)}</div>` : ''}
      <div class="btn-row mt12">${ui().btn('转技术协助', { tone: 'primary', size: 'sm', icon: 'coach', onclick: `S_AST.tech(${i})` })}${ui().btn('查看相关知识', { tone: 'ghost', size: 'sm', icon: 'doc', onclick: `S_AST.relatedSheet(${i})` })}</div>`;
  }
  function expiredHtml(m, i) {
    const f = faqById(m.faqId) || {};
    return `<div class="row gap6 mb8">${ui().chip('已失效', 'danger', { sm: true, icon: 'clock' })}<span class="small muted ellipsis">${esc(f.q || '')}</span></div>
      <div class="ast-answer">该知识已失效（${esc(f.validUntil || '2025-12-31')}），不再引用。</div>
      <div class="ast-src">未检索到其他已发布依据，暂不能给出公司承诺。已标记待核实。</div>
      <div class="btn-row mt12">${ui().btn('转技术协助', { tone: 'primary', size: 'sm', icon: 'coach', onclick: `S_AST.tech(${i})` })}${ui().btn('查看相关知识', { tone: 'ghost', size: 'sm', icon: 'doc', onclick: `S_AST.relatedSheet(${i})` })}</div>`;
  }
  function suggestHtml(cls) {
    return `<div class="suggest ${cls}">${suggestList().map((q, i) => `<button onclick="S_AST.askSuggest(${i})">${esc(q)}</button>`).join('')}</div>`;
  }
  function chatHtml() {
    const chat = App.state.chat || [];
    let h = msgAI('我可以回答客户常见问题并给出依据；未收录的问题会提示待核实。');
    if (!chat.length) h += suggestHtml('ast-suggest');
    chat.forEach((m, i) => {
      if (m.role === 'user') { h += msgUser(m.text); return; }
      if (m.kind === 'answer') { const f = faqById(m.faqId); h += f ? msgAI(answerHtml(f), true) : msgAI(unknownHtml(m, i), true); }
      else if (m.kind === 'expired') h += msgAI(expiredHtml(m, i), true);
      else h += msgAI(unknownHtml(m, i), true);
    });
    return `<div class="chat" id="ast-chat">${h}</div>`;
  }
  function heroHtml() {
    const me = App.me();
    const tiles = [
      { icon: 'message', tone: 'ai', label: '销售问答', sub: '引用审核知识', onclick: 'S_AST.focus()', active: true },
      { icon: 'template', tone: 'brand', label: '常用模板', sub: `${(App.state.templates || []).length} 个已审核`, onclick: 'S_AST.templates()' },
    ];
    if (App.isMgr()) tiles.push({ icon: 'chart', tone: 'violet', label: '主管问数', sub: '口径 · 样本量', onclick: "App.go('ask')" });
    else tiles.push({ icon: 'bug', tone: 'warn', label: '虫害识别', sub: 'P1 预览', onclick: "App.go('p1-pest')" });
    return `<div class="hero ai ast-hero"><div class="h-eyebrow">工作助手 · ${esc(me.roleName)} · ${esc(me.name)}</div><div class="h-title">只引用已审核发布的知识</div><div class="h-sub">回答 = 建议对客表达 + 依据来源 + 适用限制；未收录提示待核实，不编造承诺</div></div>
      <div class="ast-tiles">${tiles.map((t) => `<div class="ast-tile pressable ${t.active ? 'active' : ''}" onclick="${t.onclick}"><div class="ti ${t.tone}">${App.icon(t.icon, 20)}</div><div class="tl">${esc(t.label)}</div><div class="ts">${esc(t.sub)}</div></div>`).join('')}</div>`;
  }
  function scrollBottom(sel) {
    const top = App.currentEntry(); if (!top || !top.el) return;
    const c = top.el.querySelector('.content'); if (!c) return;
    requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
  }
  function bindInput(root, inputId, sendId, fn) {
    const input = root.querySelector('#' + inputId); const send = root.querySelector('#' + sendId);
    const go = () => { const v = input ? input.value : ''; if (input) input.value = ''; fn(v); };
    if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    if (send) send.addEventListener('click', go);
  }

  /* ---------- 动作：销售问答 ---------- */
  S.askSuggest = (i) => S.send(suggestList()[i]);
  S.send = function (text) {
    text = String(text || '').trim(); if (!text) return;
    App.state.chat = App.state.chat || [];
    App.state.chat.push({ role: 'user', text });
    App.save();
    const top = App.currentEntry();
    const chat = top && top.el && top.el.querySelector('#ast-chat');

    rules: ['回答含统计期间 / 口径 / 样本量 / 更新时间', '金额未接入显示"未接入"，不用预估额替代', '分母为零显示"暂无数据"不显示 0%', '地推 / KA 分开；不生成个人绩效结论', '口径歧义时提供选择或说明默认口径', '发起任务需指定责任人并确认'],
    demoActions: [{ label: '清空问数记录', icon: 'refresh', run() { S.clearAsk(); } }],
    render() {
      App.state.askChat = App.state.askChat || [];
      const ts = App.state.askTemplates || [];
      return `<div class="ast-wrap">
        ${App.isMgr() ? '' : ui().notice('info', '问数按角色数据范围返回，当前为主管演示（数据范围：华东一区）。', 'shield')}
        <div class="hero ast-hero"><div class="h-eyebrow">主管问数 · ${esc(App.me().org)} · ${esc(App.me().name)}</div><div class="h-title">问数</div><div class="h-sub">服务端按权限过滤后按指标字典计算，模型只理解问题与解释结果，不自行生成数值</div></div>
        <div class="card tight ask-tpl"><div class="ast-label">${App.icon('list', 12)}固定问题模板</div><div class="suggest ast-suggest ask-suggest">${ts.map((t, i) => `<button onclick="S_AST.askSend(${i})">${esc(t.q)}</button>`).join('')}</div><div class="tiny muted mt8">也可用自然语言变体，例如"这周有哪些回访逾期了"、"哪条街产出高"</div></div>
        ${askChatHtml()}
      </div>`;
    },
    footer() {
      return `<div class="chat-input"><div class="in ast-input"><input id="ask-input" placeholder="用自然语言提问，例如：逾期的客户有哪些" autocomplete="off"></div><button class="ib" id="ask-send" aria-label="发送">${App.icon('send', 18)}</button></div>`;
    },
    mount(root) {
      bindInput(root, 'ask-input', 'ask-send', S.ask);
      if ((App.state.askChat || []).length) scrollBottom();
    },
  });
})();

</script>
<script>
/* ============================================================
   任务列表 / 任务详情 —— tasks.js
   screens: tasks (filter?) · task (id)
   规则：客户约定 > 已接受任务 > 规则周期 · 同商机同周期去重 · 改期保留原因 · AI 自拟任务先待人确认
   ============================================================ */
(function () {
  'use strict';
  const S = window.S_TASK = {};
  const ui = App.ui, esc = App.esc, icon = App.icon;

  App.css('tk', `
    .tk-seg { margin: 12px 0 8px; }
    .tk-seg button { padding: 0 6px; font-size: 13px; }
    .tk-seg button .n { font-size: 11px; opacity: .6; margin-left: 2px; font-weight: 600; }
    .tk-caption { font-size: 11.5px; color: var(--ink-3); padding: 0 4px; margin-bottom: 8px; line-height: 1.5; display: flex; gap: 5px; align-items: flex-start; }
    .tk-caption svg { flex: none; margin-top: 3px; }
    .tk-cell { display: flex; gap: 12px; padding: 12px 14px; background: var(--surface); align-items: flex-start; }
    .tk-cell + .tk-cell { border-top: .5px solid var(--line); }
    .tk-cell:active { background: var(--surface-2); }
    .tk-cell .tk-ico { width: 36px; height: 36px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--brand-soft); color: var(--brand); margin-top: 1px; }
    .tk-cell .tk-ico.danger { background: var(--danger-soft); color: var(--danger); }
    .tk-cell .tk-ico.warn { background: var(--warn-soft); color: var(--warn); }
    .tk-cell .tk-ico.ai { background: var(--ai-soft); color: var(--ai); }
    .tk-cell .tk-ico.gray { background: var(--gray-soft); color: var(--gray); }
    .tk-cell .tk-ico.violet { background: var(--violet-soft); color: var(--violet); }
    .tk-cell .tk-body { flex: 1; min-width: 0; }
    .tk-cell .tk-title { font-size: 15px; font-weight: 500; line-height: 1.35; }
    .tk-cell .tk-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 6px; align-items: center; min-width: 0; }
    .tk-cell .tk-sub .st { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tk-cell .tk-sub .due { flex: none; font-weight: 600; }
    .tk-cell .tk-sub .due.over { color: var(--danger); }
    .tk-cell .tk-sub .due.today { color: var(--brand-3); }
    .tk-cell .tk-chips { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .tk-cell .tk-right { flex: none; color: var(--ink-4); padding-top: 9px; }
    .tk-title-lg { font-size: 18px; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
    .tk-due { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tk-due .d { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
    .tk-due .d .l { font-size: 11.5px; color: var(--ink-3); margin-bottom: 3px; }
    .tk-due .d .v { font-size: 14px; font-weight: 600; }
    .tk-due .d .v.over { color: var(--danger); }
    .tk-due .d .v.today { color: var(--brand-3); }
    .tk-ev { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-top: .5px solid var(--line); font-size: 13.5px; line-height: 1.45; }
    .tk-ev:first-child { border-top: 0; padding-top: 2px; }
    .tk-ev svg { flex: none; color: var(--brand); margin-top: 2px; }
    .tk-hist { display: flex; flex-direction: column; }
    .tk-hist .h { display: flex; gap: 10px; padding: 9px 0; border-top: .5px solid var(--line); font-size: 13px; line-height: 1.45; }
    .tk-hist .h:first-child { border-top: 0; padding-top: 2px; }
    .tk-hist .h .t { flex: none; width: 92px; color: var(--ink-3); font-size: 12px; padding-top: 2px; }
    .tk-hist .h .b { flex: 1; min-width: 0; color: var(--ink-2); }
    .tk-hist .h .b b { color: var(--ink); }
    .tk-foot .btn.icon-only { flex: 0 0 auto; width: 44px; padding: 0; }
  `);

  /* ---------- 常量 / 工具 ---------- */
  const SRC_TONE = { 客户约定: 'brand', 规则型: 'info', AI建议: 'ai', 主管分配: 'violet', 服务风险: 'danger', 本人创建: 'gray' };
  const SRC_ICON = { 客户约定: 'handshake', 规则型: 'clock', AI建议: 'sparkle', 主管分配: 'users', 服务风险: 'alert', 本人创建: 'user' };
  const TYPE_ICON = { 约访: 'calendar', 回访: 'phone', 陌拜: 'map-pin', 客诉跟进: 'alert', 勘查: 'search', 商务: 'briefcase', 承诺核对: 'contract', 辅导: 'coach', 方案: 'doc' };
  const STATUS = { todo: ['待办', 'info'], doing: ['进行中', 'warn'], done: ['已完成', 'ok'], rescheduled: ['已改期', 'gray'], cancelled: ['已取消', 'gray'] };
  const FILTERS = ['今日', '超期', '全部', '已完成'];
  const pad = (n) => String(n).padStart(2, '0');
  const addDays = (s, n) => { const d = App.dayjs((s || App.TODAY).slice(0, 10)); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const stamp = () => { const u = App.state.ui = App.state.ui || {}; u.clock = (u.clock || 0) + 1; return `${App.TODAY} 15:${pad(Math.min(59, 6 + u.clock * 2))}`; };
  const hist = (t) => (t.history = t.history || []);

  S.srcChip = (src, sm) => ui.chip(src, SRC_TONE[src] || 'gray', { sm, icon: SRC_ICON[src] });
  S.statusChip = (st, sm) => ui.chip((STATUS[st] || [st, 'gray'])[0], (STATUS[st] || [st, 'gray'])[1], { sm });
  S.isOpen = (t) => t.status === 'todo' || t.status === 'doing';
  S.isOverdue = (t) => S.isOpen(t) && t.due < App.TODAY;
  S.aiPending = (t) => t.source === 'AI建议' && !t.aiConfirmed;
  S.mine = () => { const me = App.me(); return App.state.tasks.filter((t) => App.isMgr() || t.ownerId === me.id); };
  S.filtered = function (f) {
    const all = S.mine(); let r;
    if (f === '超期') r = all.filter(S.isOverdue);
    else if (f === '已完成') r = all.filter((t) => t.status === 'done');
    else if (f === '全部') r = all.slice();
    else r = all.filter((t) => S.isOpen(t) && t.due <= App.TODAY);
    const rank = (t) => (S.isOpen(t) ? 0 : t.status === 'done' ? 1 : 2);
    return r.sort((a, b) => rank(a) - rank(b) || (a.status === 'done' ? (b.doneAt || '').localeCompare(a.doneAt || '') : (a.due || '').localeCompare(b.due || '') || (a.time || '').localeCompare(b.time || '')));
  };
  S.dueText = (t) => {
    if (t.status === 'done') return `完成 ${App.fmt.md(t.doneAt)}`;
    if (t.status === 'cancelled') return '已取消';
    return App.fmt.dueLabel(t.due) + (t.time ? ' ' + t.time : '');
  };

  /* ---------- 列表单元 ---------- */
  S.cellHtml = function (t) {
    const store = App.store(t.storeId); const over = S.isOverdue(t); const isToday = S.isOpen(t) && t.due === App.TODAY;
    const tone = over ? 'danger' : S.aiPending(t) ? 'ai' : t.status !== 'todo' && t.status !== 'doing' ? 'gray' : t.source === '服务风险' ? 'warn' : t.source === '主管分配' ? 'violet' : '';
    return `<div class="tk-cell pressable" onclick="App.go('task',{id:'${t.id}'})">
      <div class="tk-ico ${tone}">${icon(TYPE_ICON[t.type] || 'list', 20)}</div>
      <div class="tk-body">
        <div class="tk-title">${esc(t.title)}</div>
        <div class="tk-sub"><span class="st">${esc(store ? store.name : '—')}${App.isMgr() ? ' · ' + esc(t.ownerName) : ''}</span><span class="due ${over ? 'over' : isToday ? 'today' : ''}">${esc(S.dueText(t))}</span></div>
        <div class="tk-chips">${S.srcChip(t.source, true)}${S.statusChip(t.status, true)}${over ? ui.chip('逾期', 'danger', { sm: true }) : ''}${S.aiPending(t) ? ui.chip('AI 拟定 · 待确认', 'ai', { sm: true }) : ''}${t.transfer ? ui.chip('转交待确认', 'warn', { sm: true }) : ''}</div>
      </div>
      <div class="tk-right">${icon('chevron-right', 16)}</div>
    </div>`;
  };

  /* ---------- 任务列表 ---------- */
  App.register('tasks', {
    title: '任务', tab: 'today',
    prd: ['F05 回访任务与提醒', '7 页面表·任务/审批详情', '6.4 回访规则'],
    rules: ['回访日期：客户约定 > 已接受任务 > 规则周期（演示规则）', '同一商机同一周期规则任务去重', 'AI 自拟任务先待人确认', '首次逾期提醒负责人，升级阈值未配置不启用', '已有未结任务不每日复制'],
    render(params) {
      const f = FILTERS.includes(params.filter) ? params.filter : '今日';
      const all = S.mine(); const me = App.me();
      const todayN = all.filter((t) => S.isOpen(t) && t.due === App.TODAY).length;
      const overdue = all.filter(S.isOverdue).length;
      const openN = all.filter(S.isOpen).length;
      const counts = { 今日: all.filter((t) => S.isOpen(t) && t.due <= App.TODAY).length, 超期: overdue, 全部: all.length, 已完成: all.filter((t) => t.status === 'done').length };
      const list = S.filtered(f);
      const emptyMap = { 今日: ['今日无到期任务', '去客户列表选街道，安排拜访'], 超期: ['没有超期任务', '按时完成或改期都会保留记录'], 全部: ['暂无任务', '拜访确认后会生成客户约定/规则型任务'], 已完成: ['暂无已完成任务', '完成需关联拜访记录或填写说明'] };
      return `${ui.kpis([
        { label: '今日到期', value: todayN, tone: 'brand', onclick: "S_TASK.setFilter('今日')" },
        { label: '超期', value: overdue, tone: overdue ? 'danger' : '', onclick: "S_TASK.setFilter('超期')" },
        { label: '待办合计', value: openN, onclick: "S_TASK.setFilter('全部')" },
      ])}
      <div class="seg block tk-seg">${FILTERS.map((x) => `<button class="${x === f ? 'active' : ''}" onclick="S_TASK.setFilter('${x}')">${x}<span class="n">${counts[x]}</span></button>`).join('')}</div>
      <div class="tk-caption">${icon('info', 13)}<span>${App.isMgr() ? '主管视角：显示团队全部任务' : esc(me.name) + ' 的任务'} · 截止日按 客户约定 &gt; 已接受任务 &gt; 规则周期（演示规则 20%=7天 · 50%=3天 · 80%=1天）</span></div>
      ${list.length ? `<div class="list">${list.map(S.cellHtml).join('')}</div>` : ui.empty({ icon: 'inbox', title: emptyMap[f][0], sub: emptyMap[f][1], action: ui.btn('去客户列表', { tone: 'secondary', size: 'sm', onclick: "App.tab('customers')" }) })}`;
    },
  });
  S.setFilter = function (f) { const e = App.currentEntry(); if (!e) return; e.params.filter = f; App.refresh(); App._syncHash(); };

  /* ---------- 任务详情 ---------- */
  App.register('task', {
    title: '任务详情', tab: 'today',
    prd: ['F05 回访任务与提醒', '7 页面表·任务/审批详情', 'F04 建议任务含客户/商机/动作/责任人/日期/原因/预期产物'],
    rules: ['完成需要证据（拜访记录或说明）', '改期保留原因，不伪装成完成', '转交需接收人确认或主管指定', 'AI 拟定任务先待人确认', '同一商机同一周期去重'],
    render(params) {
      const t = App.task(params.id);
      if (!t) return ui.empty({ icon: 'list', title: '任务不存在或尚未生成', sub: '演示任务在商机推进卡"一次确认"后生成', action: ui.btn('返回', { tone: 'ghost', size: 'sm', onclick: 'App.back()' }) });
      const store = App.store(t.storeId); const opp = t.oppId ? App.opp(t.oppId) : null;
      const over = S.isOverdue(t); const isToday = S.isOpen(t) && t.due === App.TODAY; const aiPending = S.aiPending(t);
      const n = App.fmt.days(t.due);
      const head = `<div class="card">
        <div class="chips mb8">${S.srcChip(t.source)}${S.statusChip(t.status)}${over ? ui.chip(`逾期 ${-n} 天`, 'danger', { icon: 'alert' }) : ''}${aiPending ? ui.chip('AI 拟定 · 待确认', 'ai', { icon: 'sparkle' }) : ''}</div>
        <div class="tk-title-lg">${esc(t.title)}</div>
        <div class="muted small mt4">${esc(t.type)} · 责任人 ${esc(t.ownerName)}${t.transfer ? ` · 转交申请中（${esc(t.transfer.to)}）` : ''}</div>
        <div class="tk-due mt12">
          <div class="d"><div class="l">截止日</div><div class="v ${over ? 'over' : isToday ? 'today' : ''}">${esc(App.fmt.mdw(t.due))}${t.time ? ' ' + esc(t.time) : ''}</div></div>
          <div class="d"><div class="l">${t.status === 'done' ? '完成时间' : '提醒'}</div><div class="v ${over ? 'over' : isToday ? 'today' : ''}">${esc(t.status === 'done' ? (t.doneAt || '—') : t.status === 'cancelled' ? '已取消' : App.fmt.dueLabel(t.due))}</div></div>
        </div>
      </div>`;
      const notices = [
        aiPending ? ui.notice('ai', '<b>AI 拟定任务先待人确认</b>：确认后才进入待办提醒周期；可改期后再确认') : '',
        t.transfer ? ui.notice('info', `转交申请已提交给 <b>${esc(t.transfer.to)}</b>（${esc(t.transfer.at)}）· 待接收人确认或主管指定；生效前仍由 ${esc(t.ownerName)} 负责，历史与未结任务不丢失`) : '',
        over && S.isOpen(t) ? ui.notice('danger', `首次逾期已提醒负责人 ${esc(t.ownerName)}；主管升级阈值未配置，不自动升级`) : '',
      ].join('');
      const links = `<div class="list">
        ${store ? ui.cell({ title: esc(store.name), sub: `${esc(store.type)} · ${esc(store.street || store.district || '')}`, icon: 'store', right: ui.coopChip(store.coop), onclick: `App.go('customer',{id:'${store.id}'})` }) : ''}
        ${opp ? ui.cell({ title: `${esc(opp.kind)} · ${esc(opp.service)}`, sub: `商机推进卡 · 阶段 ${esc(opp.stage)} · 分层 ${esc(App.tierLabel(opp.tier))}`, icon: 'trend', iconTone: 'info', onclick: `App.go('opportunity',{id:'${opp.id}'})` }) : ''}
      </div>`;
      const source = `<div class="card"><div class="card-title">来源与原因</div>${ui.kv([
        ['来源', S.srcChip(t.source)],
        ['原因', t.reason ? esc(t.reason) : '<span class="muted">—</span>'],
        ['责任人', esc(t.ownerName)],
        ['截止日', `${esc(App.fmt.mdw(t.due))}${t.time ? ' ' + esc(t.time) : ''} · ${esc(App.fmt.dueLabel(t.due))}`],
        ['预期产物', t.expected ? esc(t.expected) : '<span class="muted">—</span>'],
      ])}</div>`;
      const dedup = t.dedup ? ui.notice('info', `<b>同一商机同一周期去重</b> · ${esc(t.dedup)}`) : '';
      const ev = (t.evidence || []);
      const evidence = `<div class="card"><div class="card-title">证据<span class="muted tiny" style="font-weight:400">${ev.length} 项</span></div>${ev.length ? ev.map((e) => `<div class="tk-ev">${icon('file', 16)}<div>${esc(e)}</div></div>`).join('') : '<div class="muted small">暂无证据 · 完成时需关联拜访记录或填写说明</div>'}</div>`;
      const doneCard = t.status === 'done' ? `<div class="card"><div class="card-title">${icon('check-circle', 16)}完成情况</div>${ui.kv([['完成时间', esc(t.doneAt || '—')], ['完成证据', esc(ev[ev.length - 1] || '—')], ['提醒周期', '本周期提醒已关闭，下一周期按规则/约定生成']])}</div>` : '';
      const cancelCard = t.status === 'cancelled' ? ui.notice('gray', `已取消 · 原因：${esc(t.cancelReason || '—')}`) : '';
      const h = t.history || [];
      const history = h.length ? `<div class="card"><div class="card-title">变更记录<span class="muted tiny" style="font-weight:400">改期保留原因，不伪装成完成</span></div><div class="tk-hist">${h.map((x) => `<div class="h"><div class="t">${esc(x.at)}</div><div class="b"><b>${esc(x.type)}</b>${x.from && x.to ? ` · ${esc(App.fmt.md(x.from))} → ${esc(App.fmt.md(x.to))}` : ''}${x.body ? `<div class="small">${esc(x.body)}</div>` : ''}</div></div>`).join('')}</div></div>` : '';
      return head + notices + links + source + dedup + evidence + doneCard + cancelCard + history;
    },
    footer(params) {
      const t = App.task(params.id); if (!t || !S.isOpen(t)) return '';
      const id = t.id;
      const more = `<button class="btn outline icon-only" aria-label="更多" onclick="S_TASK.more('${id}')">${icon('more', 20)}</button>`;
      if (S.aiPending(t)) {
        return `<div class="btn-row tk-foot">${more}${ui.btn('改期', { tone: 'outline', icon: 'calendar', onclick: `S_TASK.reschedule('${id}')` })}${ui.btn('确认任务', { tone: 'ai', icon: 'check', onclick: `S_TASK.confirmAi('${id}')` })}</div>`;
      }
      return `<div class="btn-row tk-foot">${more}${ui.btn('改期', { tone: 'outline', icon: 'calendar', onclick: `S_TASK.reschedule('${id}')` })}${ui.btn('完成', { icon: 'check', onclick: `S_TASK.complete('${id}')` })}</div>`;
    },
  });

  /* ---------- 操作：完成（需证据） ---------- */
  S.complete = function (id) {
    const t = App.task(id); if (!t) return;
    const v = App.visitsOf(t.storeId).filter((x) => x.status === 'synced')[0];
    App.sheet({
      title: '完成需要证据：真实客户互动结果或推进证据',
      items: [
        { label: '关联最近拜访记录', icon: 'file', sub: v ? `${v.time} · ${v.type} · ${v.result}` : '该门店暂无已确认拜访记录', onSelect: () => { if (!v) { App.toast('暂无可关联的拜访记录，请先记录拜访'); return; } S.finish(id, `拜访记录 ${App.fmt.md(v.time)} · ${v.type} · ${v.result}`); } },
        { label: '填写完成说明', icon: 'edit', sub: '电话 / 微信等互动结果', onSelect: () => App.prompt('完成说明', '例如：电话确认客户已收到方案，周四给反馈', (val) => { const s = (val || '').trim(); if (!s) { App.toast('需要填写完成说明'); return; } S.finish(id, '完成说明：' + s); }) },
        { label: '先去记录拜访', icon: 'camera', sub: '拍门头 / 口述 → 确认事实后再完成', onSelect: () => App.go('visit-capture', { storeId: t.storeId, oppId: t.oppId || undefined }) },
      ],
    });
  };
  S.finish = function (id, evidence) {
    const t = App.task(id); if (!t) return;
    const at = stamp();
    t.status = 'done'; t.doneAt = at; t.evidence = [...(t.evidence || []), evidence];
    hist(t).unshift({ type: '完成', at, body: evidence });
    App.save(); App.toast('已完成 · 已关闭本周期提醒并开启下一周期', { icon: 'check-circle', duration: 2200 }); App.refresh();
  };

  /* ---------- 改期（原因 → 新日期） ---------- */
  S.reschedule = function (id) {
    App.prompt('改期原因（保留记录，不视为完成）', '例如：客户临时有事，约到周四', (v) => {
      const reason = (v || '').trim(); if (!reason) { App.toast('改期需要填写原因'); return; }
      const t = App.task(id); if (!t) return;
      const base = t.due < App.TODAY ? App.TODAY : t.due;
      App.sheet({
        title: `选择新的截止日（原 ${App.fmt.md(t.due)}）`,
        items: [1, 3, 7].map((n) => { const d = addDays(base, n); return { label: `+${n} 天 · ${App.fmt.mdw(d)}`, icon: 'calendar', sub: n === 1 ? '明天优先处理' : n === 3 ? '50% 分层规则周期' : '20% 分层规则周期', onSelect: () => S.applyResched(id, d, reason) }; }),
      });
    });
  };
  S.applyResched = function (id, to, reason) {
    const t = App.task(id); if (!t) return;
    const at = stamp(); const from = t.due;
    hist(t).unshift({ type: '改期', at, from, to, body: '原因：' + reason });
    t.due = to; t.rescheduled = (t.rescheduled || 0) + 1; delete t.overdue;
    App.save(); App.toast('已改期 · 原因已保留，不计为完成', { icon: 'calendar', duration: 2000 }); App.refresh();
  };

  /* ---------- 更多：转交 / 取消 ---------- */
  S.more = function (id) {
    const t = App.task(id); if (!t) return;
    App.sheet({ items: [
      { label: '转交申请', icon: 'users', sub: '待接收人确认或主管指定后生效', onSelect: () => S.transfer(id) },
      { label: '查看商机推进卡', icon: 'trend', onSelect: () => (t.oppId ? App.go('opportunity', { id: t.oppId }) : App.toast('该任务未关联商机')) },
      { label: '取消任务', icon: 'x', danger: true, sub: '需填写原因', onSelect: () => S.cancel(id) },
    ] });
  };
  S.transfer = function (id) {
    App.sheet({ title: '转交给同事（保留历史责任人与未结任务）', items: [
      { label: '王磊', sub: '地推 · 华东一区', icon: 'user', onSelect: () => S.applyTransfer(id, '王磊') },
      { label: '赵敏', sub: '地推 · 华东一区', icon: 'user', onSelect: () => S.applyTransfer(id, '赵敏') },
    ] });
  };
  S.applyTransfer = function (id, to) {
    const t = App.task(id); if (!t) return;
    const at = stamp(); t.transfer = { to, at, status: '待确认' };
    hist(t).unshift({ type: '转交申请', at, body: `申请转交给 ${to}，待接收人确认或主管指定` });
    App.save(); App.toast('已提交转交申请，待接收人确认或主管指定', { icon: 'users', duration: 2200 }); App.refresh();
  };
  S.cancel = function (id) {
    App.prompt('取消原因', '例如：客户已明确不再联系（尊重不再联系要求）', (v) => {
      const reason = (v || '').trim(); if (!reason) { App.toast('取消需要填写原因'); return; }
      const t = App.task(id); if (!t) return;
      const at = stamp(); t.status = 'cancelled'; t.cancelReason = reason; t.cancelledAt = at;
      hist(t).unshift({ type: '取消', at, body: '原因：' + reason });
      App.save(); App.toast('任务已取消 · 原因已记录'); App.refresh();
    });
  };
  S.confirmAi = function (id) {
    const t = App.task(id); if (!t) return;
    const at = stamp(); t.aiConfirmed = true; t.confirmedAt = at;
    hist(t).unshift({ type: '确认', at, body: `AI 拟定任务经 ${App.me().name} 确认，进入待办` });
    App.save(); App.toast('已确认 AI 拟定任务 · 进入待办', { icon: 'check-circle' }); App.refresh();
  };
})();

</script>

  /* ---------- 通知设置 ---------- */

  });
  S.toggle = function (key) {

<script>

   ============================================================ */
(function () {
  'use strict';
  const T = window.S_TEAM = {};
