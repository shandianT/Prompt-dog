    let date = null, matched = '', before = false;
    let m;
    if ((m = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日?/))) { date = new Date(2026, +m[1] - 1, +m[2]); matched = m[0]; }
    else if ((m = text.match(/(\d{1,2})[\/.](\d{1,2})/))) { date = new Date(2026, +m[1] - 1, +m[2]); matched = m[0]; }
    else if ((m = text.match(/下下?周([一二三四五六日天])/))) { const wd = m[1] === '天' ? 0 : WD.indexOf(m[1]); const base = new Date(today); base.setDate(base.getDate() + (m[0].startsWith('下下') ? 14 : 7) - base.getDay() + (wd === 0 ? 7 : wd)); date = base; matched = m[0]; }
    else if ((m = text.match(/(本周|这周|周|星期)([一二三四五六日天])/))) { const wd = m[2] === '天' ? 0 : WD.indexOf(m[2]); const base = new Date(today); let diff = (wd === 0 ? 7 : wd) - base.getDay(); if (diff <= 0) diff += 7; base.setDate(base.getDate() + diff); date = base; matched = m[0]; }
    else if ((m = text.match(/明天|后天|大后天/))) { const n = { 明天: 1, 后天: 2, 大后天: 3 }[m[0]]; const base = new Date(today); base.setDate(base.getDate() + n); date = base; matched = m[0]; }
    else if ((m = text.match(/今天|今晚|今日/))) { date = new Date(today); matched = m[0]; }
    if (date && text.slice(text.indexOf(matched) + matched.length).match(/^\s*(前|之前|以前)/)) before = true;
    // 时间点
    let hm = '', tm;
    if ((tm = text.match(/(\d{1,2})[:：](\d{2})/))) hm = `${String(tm[1]).padStart(2, '0')}:${tm[2]}`;
    else if ((tm = text.match(/(上午|下午|晚上|早上)?\s*([一二两三四五六七八九十\d]{1,2})\s*点(半)?/))) { let h = cn2n(tm[2]); if ((tm[1] === '下午' || tm[1] === '晚上') && h < 12) h += 12; hm = `${String(h).padStart(2, '0')}:${tm[3] ? '30' : '00'}`; }
    // 动作：去掉时间词与填充词后的剩余
    let action = matched ? text.replace(matched, ' ') : text;
    action = action.replace(/(上午|下午|晚上|早上)?\s*[一二两三四五六七八九十\d]{1,2}\s*点半?/g, ' ').replace(/\d{1,2}[:：]\d{2}/g, ' ');
    ['约了', '让我', '我会', '我来', '计划', '打算', '准备', '之前', '以前', '再去', '过去', '一趟', '然后'].forEach((w) => { action = action.split(w).join(' '); });
    action = action.replace(/[，,。、；;！!\s]+/g, ' ').trim().replace(/^前\s*|\s*前$/g, '').replace(/^(再|去)\s*/, '').trim();
    const concrete = /(送|带|发|出|上门|到店|勘查|勘察|签|提交|报价|方案|电话|拜访|安排|复处理|演示|培训|试|谈|见|会议|开会|样品|资料)/;
    const vague = /^(再?联系|保持?跟进|再?跟进|沟通|看看|再说|回访|再聊|保持联系|近期跟进|近期再联系)$/;
    const hasAction = !!action && !vague.test(action) && (concrete.test(action) || action.length >= 3);
    const reasons = [];
    if (!date) reasons.push(matched ? '时间不明确' : (/(近期|尽快|有空|回头|改天|过几天|下次)/.test(text) ? '「' + text.match(/(近期|尽快|有空|回头|改天|过几天|下次)/)[1] + '」不算明确时间' : '未解析到明确时间'));
    if (!hasAction) reasons.push(action ? '「' + action + '」不算明确动作' : '缺少明确动作');
    const pass = !!date && hasAction;
    const dateText = date ? `${App.fmt.md(iso(date))} 周${WD[date.getDay()]}${hm ? ' ' + hm : ''}${before ? ' 前' : ''}` : '';
    return {
      pass, raw: text, date: date ? iso(date) : '', before, hm,
      time: date ? `${iso(date)}${hm ? ' ' + hm : ''}${before ? ' 前' : ''}（相对时间已解析）` : '未解析到明确时间',
      action: hasAction ? action : (action || '未识别到明确动作'),
      normalized: date ? `${App.fmt.md(iso(date))}${hm ? ' ' + hm : ''}${before ? ' 前' : ''} · ${hasAction ? action : ''}`.trim() : text,
      dateText,
      hint: pass ? '' : reasons.join('；') + '。例：「9月12日前送方案与报价」',
    };
  };

  /* ----------------------------------------------------------
     模块状态：当前抽取结果 + 编辑
     ---------------------------------------------------------- */
  S.init = function (storeId, version) {
    S.key = storeId + '|' + version;
    S.storeId = storeId; S.version = version;
    S.budgetAdded = false; S.nextGate = null; S.nextText = ''; S.edits = {}; S.stale = false; S.transcriptExtra = '';
    S.rebuild();
    S.score = S.evalScore();
  };
  S.ensure = function (p) {
    const storeId = p.storeId || 's_bing'; const version = p.version === 'weak' ? 'weak' : 'good';
    if (S.key !== storeId + '|' + version) S.init(storeId, version);
  };
  S.transcript = () => (D.demoTranscripts[S.version] || '') + (S.transcriptExtra || '');
  S.nextFixed = () => !!(S.nextGate && S.nextGate.pass);
  S.rebuild = function () {
    const base = D.demoExtract(S.budgetAdded ? 'good' : S.version);
    const weak = D.demoExtract('weak');
    S.fields = App.clone(base.fields);
    if (S.nextGate) {
      S.fields.下一步 = { v: S.nextGate.pass ? S.nextGate.normalized : S.nextGate.raw, src: 'manual', conf: 1, quote: S.nextGate.raw, invalid: !S.nextGate.pass };
      S.gate2 = S.nextGate;
    } else if (S.version === 'weak') { S.fields.下一步 = App.clone(weak.fields.下一步); S.gate2 = App.clone(weak.gate2); }
    else S.gate2 = App.clone(base.gate2);
    Object.keys(S.edits).forEach((k) => { const f = S.fields[k] || {}; S.fields[k] = Object.assign({}, f, { v: S.edits[k], src: 'manual', conf: 1, missing: !S.edits[k] }); });
    if (S.budgetAdded && S.fields.预计金额) S.fields.预计金额.quote = '预算一个月两千到两千五能接受';
  };
  // 评分（演示：弱样例 58；修下一步 + 补预算原话 → 71）
  S.evalScore = function () {
    const good = D.demoExtract('good').score, weak = D.demoExtract('weak').score;
    if (S.version !== 'weak') return App.clone(good);
    const n = S.nextFixed(), b = S.budgetAdded;
    if (n && b) return App.clone(good);
    if (n) return { total: 65, dims: { 逻辑结构: 14, 事实细节: 13, '客户原声/证据': 16, 沟通结论: 12, 表达清晰度: 10 }, advice: ['补充客户预算或价格预期', '补充问题发生的具体位置'] };
    if (b) return { total: 63, dims: { 逻辑结构: 13, 事实细节: 17, '客户原声/证据': 16, 沟通结论: 4, 表达清晰度: 13 }, advice: ['补充问题发生的具体位置', '补充带明确时间与动作的下一步'] };
    return App.clone(weak);
  };
  S.gate1 = () => S.score.total >= th();
  S.gateOk = () => S.gate1() && !!S.gate2.pass;
  S.blockers = function () {
    const p = [];
    if (!S.gate1()) p.push(`评分 ${S.score.total} < ${th()}`);
    if (!S.gate2.pass) p.push('下一步未通过');
    return p;
  };
  S.groups = function () {
    const auto = [], ai = [], first = [];
    Object.keys(S.fields).forEach((k) => { const f = S.fields[k]; if (f.first) first.push(k); else if (f.src === 'auto') auto.push(k); else ai.push(k); });
    return { auto, ai, first };
  };
  S.missingCount = () => Object.keys(S.fields).filter((k) => S.fields[k].missing && (!S.fields[k].first || App.state.settings.firstVisit)).length;

  /* ----------------------------------------------------------
     片段
     ---------------------------------------------------------- */
  function storeCard(store, chip, sub) {
    return `<div class="card"><div class="cf-store"><div class="n grow ellipsis">${esc(store.name)}</div>${chip}</div><div class="cf-store-m">${esc(sub)}</div></div>`;
  }
  function dimBars(score) {
    const W = weights();
    return `<div class="cf-dims">${DIMS.map((k) => { const v = score.dims[k] || 0, w = W[k] || 20, r = v / w; const tone = r < .5 ? 'bad' : (r < .75 ? 'warn' : 'ok'); return `<div class="cf-dim"><span class="l">${esc(k)}</span><span class="b"><i class="${tone}" style="width:${Math.round(r * 100)}%"></i></span><span class="v">${v}/${w}</span></div>`; }).join('')}</div>`;
  }
  function scoreCard(score, opts = {}) {
    const t = th(); const total = score.total;
    const band = total >= t ? (total >= 85 ? '优秀' : '通过') : '需重写';
    const chipTone = total >= t ? 'ok' : 'danger';
    return `<div class="card">
      <div class="row between mb8"><div class="card-title" style="margin:0">质量评分 · ${band}${opts.stale ? ui().chip('已修改 · 待重评', 'warn', { sm: true }) : ''}</div>${ui().chip(`门槛 ${t} 分`, chipTone)}</div>
      <div class="cf-score">${ui().scoreRing(total, t, 96)}${dimBars(score)}</div>
      ${score.advice && score.advice.length ? `<div class="cf-advice"><b>AI 建议：</b>${score.advice.map(esc).join('；')}</div>` : ''}
      ${opts.actions || ''}
    </div>`;
  }
  function fieldRow(k, f, opts = {}) {
    const auto = f.src === 'auto', manual = f.src === 'manual';
    const missing = !!f.missing || f.v === '';
    const val = missing ? '待补充' : esc(f.v);
    const src = auto ? '<span class="src"><i class="dot auto"></i>自动</span>'
      : manual ? '<span class="src"><i class="dot manual"></i>已人工校正</span>'
        : missing ? '<span class="src"><i class="dot miss"></i>待补充</span>'
          : `<span class="src"><i class="dot"></i>AI ${Math.round((f.conf || 0) * 100)}%</span>`;
    const req = (k === '客户名称' || k === '下一步') ? '<span class="req">*</span>' : '';
    const click = opts.readonly ? '' : (auto ? `onclick="S_CONFIRM.tapAuto()"` : `onclick="S_CONFIRM.openField('${esc(k)}')"`);
    return `<div class="field-row ${opts.readonly ? '' : 'tap'}" ${click}><span class="fl">${esc(k)}${req}</span><span class="fv ${auto ? 'auto' : ''} ${missing ? 'missing' : ''} ${f.invalid ? 'missing' : ''}">${val}</span>${src}</div>`;
  }
  function fieldGroups(fields, opts = {}) {
    const auto = [], ai = [], first = [];
    Object.keys(fields).forEach((k) => { const f = fields[k]; if (f.first) first.push(k); else if (f.src === 'auto') auto.push(k); else ai.push(k); });
    const legend = `<span class="cf-legend"><span><i class="auto"></i>自动</span><span><i></i>AI</span><span><i class="manual"></i>已校正</span><span><i class="miss"></i>待补充</span></span>`;
    let html = `<div class="list">
      <div class="cf-group"><span>16 项基础字段</span>${legend}</div>
      <div class="cf-group" style="padding-top:2px;font-size:12.5px;color:var(--ink-3);font-weight:600">自动带出 · ${auto.length} 项<span class="g-sub">由登录账号与打点带出，灰色不可改</span></div>
      ${auto.map((k) => fieldRow(k, fields[k], opts)).join('')}
      <div class="cf-group" style="font-size:12.5px;color:var(--ink-3);font-weight:600">AI 抽取 · ${ai.length} 项<span class="g-sub">${opts.readonly ? '带置信度与原文定位' : '带置信度与原文定位，点行可看原文 / 修改'}</span></div>
      ${ai.map((k) => fieldRow(k, fields[k], opts)).join('')}
    </div>`;
    if (first.length && (opts.readonly || App.state.settings.firstVisit)) {
      html += `<div class="list"><div class="cf-group"><span>首次拜访追加 · ${first.length} 项</span>${ui().chip('需人工审核', 'warn', { sm: true })}</div>${first.map((k) => fieldRow(k, fields[k], opts)).join('')}</div>`;
    }

  }
  function gateCard(g2, opts = {}) {

      <div class="cf-kv" ${opts.readonly ? '' : `onclick="S_CONFIRM.editNext()"`}><span class="k">原文</span><span class="v ${pass ? '' : 'bad'}">${esc(g2.raw || '（空）')}</span></div>

        <div class="card"><div class="row between mb8"><div class="card-title" style="margin:0">原文</div><span class="row" style="gap:6px">${manual ? ui().chip('已人工校正', 'ok', { sm: true }) : ''}${ui().chip(`热词命中 ${(v.hotwords || []).length}`, 'brand', { sm: true })}</span></div>
          <div class="vd-text">${hl(v.transcript, v.hotwords || D.hotwords)}</div></div>
        ${fieldGroups(fields, { readonly: true })}
        <div class="card"><div class="row between mb8"><div class="card-title" style="margin:0">五维评分</div>${ui().chip(`门槛 ${t} 分`, sc.total >= t ? 'ok' : 'danger')}</div>

        </div>`;
    },
  });
})();

</script>

    .pest-res .alt { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .pest-rows { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .pest-rows .pr { display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.5; }
    .pest-rows .pr .k { color: var(--ai); font-weight: 700; }
    .pest-unknown { display: flex; align-items: center; gap: 12px; }
    .pest-unknown .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); display: flex; align-items: center; justify-content: center; flex: none; }
  `);

  /* ---------- 工具 ---------- */
  const KB = () => App.state.kb || [];
  const article = (id) => KB().find((k) => k.id === id);
  const canSee = (k) => k.role !== '主管可见' || App.isMgr();
  const chat = () => { if (!App.state.ui.chat) App.state.ui.chat = []; return App.state.ui.chat; };
  const now = () => { const d = new Date(); return `${App.TODAY} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const sentence = (s, j) => { const parts = (s || '').split(/[；;。]/).filter(Boolean); return (parts[Math.min(j || 0, parts.length - 1)] || '').trim() + '。'; };
  const firstSentence = (s) => sentence(s, 0);
  const UNKNOWN_Q = '你们能保证一年不再有老鼠吗？';

  // 关键词匹配（不做语义猜测：命中数为 0 即未命中）
  function match(q) {
    // 承诺 / 保证类问题知识库无条目 → 未命中（不用相近条目冒充答案）
    if (/保证|承诺|包.*不再|永远|100%/.test(q)) return null;
    let best = null, bestN = 0;
    KB().forEach((k) => {
      const hit = (k.keywords || []).filter((w) => q.includes(w));
      const n = hit.filter((w) => !hit.some((o) => o !== w && o.includes(w))).length + (q.includes(k.q.replace(/[？?]/g, '')) ? 3 : 0);
      if (n > bestN) { best = k; bestN = n; }
    });
    return best;
  }
  // 相关 FAQ：按字符重叠度取最近 2 条（排除自身、排除无权限）
  function related(q, excludeId, n = 2) {
    const chars = new Set(q.replace(/[？?，。、\s]/g, '').split(''));
    return KB().filter((k) => k.id !== excludeId && canSee(k))
      .map((k) => ({ k, s: (k.keywords || []).filter((w) => q.includes(w)).length * 3 + k.q.split('').filter((c) => chars.has(c)).length / 4 + k.hits / 100 }))
      .sort((a, b) => b.s - a.s).slice(0, n).map((x) => x.k);
  }

  /* ---------- 渲染：气泡 ---------- */
  function bubbleAI(inner, head, headCls = '') {
    return `<div class="msg"><div class="kb-av ${headCls === 'lock' ? 'gray' : ''}">${App.icon(headCls === 'lock' ? 'lock' : 'sparkle', 16)}</div><div class="bubble">${head ? `<div class="b-head ${headCls}">${head}</div>` : ''}${inner}</div></div>`;
  }
  function renderMsg(m, i) {
    if (m.role === 'me') return `<div class="msg me"><div class="bubble">${esc(m.text)}</div></div>`;
    if (m.kind === 'thinking') return bubbleAI(`<div class="kb-think"><i></i><i></i><i></i></div>`, '日日新大模型 · 检索知识库中');
    if (m.kind === 'welcome') return bubbleAI(`你好，我是知识库随身问。客户追问虫害、药剂、保险与效果类问题时，可直接问我：答案只来自贵司知识库并带出处；库里没有的我不会编。`, '日日新大模型 · 检索范围：贵司知识库');
    if (m.kind === 'denied') {
      const k = article(m.kbId);
      return bubbleAI(`该条目「${esc(k ? k.q : '')}」仅主管可见，已提示申请权限。<div class="kb-acts">${App.ui.btn('申请查看权限', { tone: 'outline', size: 'xs', onclick: "App.toast('已向主管 李华 发送权限申请（演示）',{icon:'send'})" })}</div>`, '按角色权限 · 地推销售不可见', 'lock');
    }
    if (m.kind === 'hit') {
      const k = article(m.kbId); if (!k) return '';
      const open = m.open || {};
      const src = k.sources.map((s, j) => `<div class="si"><div class="row between" onclick="S_KB.toggleSrc(${i},${j})"><div class="grow"><b>${esc(s.title)}</b><div class="loc">${esc(s.loc)}${j === 0 ? ' · 主要依据' : ''}</div></div>${App.icon(open[j] ? 'chevron-down' : 'chevron-right', 16)}</div>${open[j] ? `<div class="quote"><div class="q-cap">原文摘录（演示）</div>${esc(sentence(k.answer, j))}</div>` : ''}</div>`).join('');
      const faq = related(k.q, k.id, 2);
      return bubbleAI(`${esc(k.answer)}<div class="kb-src"><div class="st">出处 · ${k.sources.length} 条 · 点击展开原文</div>${src}</div><div class="kb-acts">${App.ui.btn('打开条目', { tone: 'secondary', size: 'xs', icon: 'doc', onclick: `App.go('kb-article',{id:'${k.id}'})` })}${App.ui.btn('有帮助', { tone: 'ghost', size: 'xs', icon: 'thumbs', onclick: "App.toast('已反馈：有帮助',{icon:'check'})" })}${App.ui.btn('不准确', { tone: 'ghost', size: 'xs', onclick: "App.toast('已反馈：不准确，回流管理员复核',{icon:'send'})" })}</div>${faq.length ? `<div class="kb-src"><div class="st">相关 FAQ</div><div class="kb-faq">${faq.map((f) => `<button onclick="S_KB.ask('${f.id}')">${esc(f.q)}</button>`).join('')}</div></div>` : ''}`, `日日新大模型 · 依据 ${k.sources.length} 条出处 · ${esc(k.kind)}`);
    }
    if (m.kind === 'miss') {
      const faq = (m.faq || []).map(article).filter(Boolean);
      return bubbleAI(`未找到依据，不编答案。已回流管理员补充。<div class="kb-src"><div class="st">可能相关 · 按关键词就近推荐</div><div class="kb-faq">${faq.map((f) => `<button onclick="S_KB.ask('${f.id}')">${esc(f.q)}</button>`).join('')}</div></div><div class="kb-acts">${App.ui.chip('已回流管理员', 'warn', { sm: true, icon: 'send' })}${App.ui.btn('反馈给管理员', { tone: 'outline', size: 'xs', onclick: `S_KB.feedback(${i})` })}</div>`, '日日新大模型 · 未找到依据', 'miss');
    }
    return '';
  }

  /* ---------- 动作 ---------- */
  S.toggleSrc = function (i, j) {
    const m = chat()[i]; if (!m) return;
    m.open = m.open || {}; m.open[j] = !m.open[j];
    App.save(); App.refresh();
  };
  S.feedback = function () { App.toast('已附问题与时间提交管理员（演示）', { icon: 'send' }); };
  S.ask = function (id) { const k = article(id); if (k) S.send(k.q); };
  S.askUnknown = function () { S.send(UNKNOWN_Q); };
  S.mic = function () { App.toast('演示中请用文字提问', { icon: 'mic' }); };
  S.sendInput = function () {
    const el = document.getElementById('kbInput');
    const v = el ? el.value.trim() : '';
    if (!v) { App.toast('请输入问题'); return; }
    S.send(v);
  };
  S.send = function (q) {
    const c = chat();
    if (!c.length) c.push({ role: 'ai', kind: 'welcome' });
    c.push({ role: 'me', text: q, at: now() });
    c.push({ role: 'ai', kind: 'thinking' });
    App.save(); App.refresh(); scrollBottom();
    setTimeout(() => {
      const cc = chat();
      const ti = cc.findIndex((m) => m.kind === 'thinking');
      if (ti < 0) return;
      const k = match(q);
      let reply;
      if (k && !canSee(k)) reply = { role: 'ai', kind: 'denied', kbId: k.id };
      else if (k) { reply = { role: 'ai', kind: 'hit', kbId: k.id, open: {} }; k.hits = (k.hits || 0) + 1; }
      else {
        reply = { role: 'ai', kind: 'miss', faq: related(q, null, 2).map((x) => x.id) };
        App.state.kbMissLog = App.state.kbMissLog || [];
        if (!App.state.kbMissLog.find((x) => x.q === q)) App.state.kbMissLog.unshift({ q, at: now(), status: '已回流管理员' });
      }
      cc.splice(ti, 1, reply);
      App.save();
      if (App.currentEntry() && App.currentEntry().id === 'kb') { App.refresh(); scrollBottom(); }
    }, 700);
  };
  S.history = function () {
    const qs = chat().filter((m) => m.role === 'me');
    const miss = App.state.kbMissLog || [];
    const items = qs.slice().reverse().map((m) => ({ label: m.q || m.text, sub: `${m.at || ''} · 再问一次`, icon: 'history', onSelect: () => S.send(m.text) }));
    miss.forEach((x) => items.push({ label: x.q, sub: `${x.at} · ${x.status}`, icon: 'send' }));
    if (!items.length) items.push({ label: '暂无历史提问', sub: '本次演示尚未提问', icon: 'inbox' });
    App.sheet({ title: '历史提问 · 本人', items });
  };
  S.clear = function () { App.state.ui.chat = []; App.save(); App.refresh(); App.toast('已清空对话'); };
  function scrollBottom() { const e = App.currentEntry(); const c = e && e.el && e.el.querySelector('.content'); if (c) c.scrollTop = c.scrollHeight; }

  /* ---------- 页面：知识库（Tab 根） ---------- */
  App.register('kb', {
    title: '知识库', tab: 'kb',
    prd: ['deck p19 · 识虫与知识库随身问', '决策 d · 知识库按角色权限'],
    rules: ['答案带出处 ≥2 条，可展开原文', '未命中不编答案，回流管理员', '10 秒查到为设计目标'],
    demoActions: [
      { label: '演示：命中（k1）', icon: 'sparkle', run() { S.ask('k1'); } },
      { label: '演示：未命中', icon: 'alert', run() { S.askUnknown(); } },
      { label: '清空对话', icon: 'refresh', run() { S.clear(); } },
    ],
    render() {
      const me = App.me();
      const c = chat();
      const visible = KB().filter(canSee);
      const chips = KB().map((k) => `<button onclick="S_KB.ask('${k.id}')">${canSee(k) ? '' : App.icon('lock', 12)}${esc(k.q)}</button>`).join('') + `<button class="unknown" onclick="S_KB.askUnknown()">${esc(UNKNOWN_Q)}</button>`;
      const hero = `<div class="hero ai kb"><div class="h-eyebrow">知识库 · 日日新大模型检索</div><div class="h-title">知识库随身问</div><div class="h-sub">答案带出处 · 未命中不编答案 · 按角色权限（${esc(me.roleName)}）</div><div class="h-tags"><span>10 秒查到（设计目标）</span><span>条目 ${visible.length} 条可见</span><span>未命中回流管理员</span></div></div>`;
      const entries = `<div class="kb-entries"><div class="kb-entry" onclick="App.go('pest')"><div class="ei">${App.icon('camera', 20)}</div><div class="grow"><div class="et">拍照识虫</div><div class="es">种类 · 习性 · 处置</div></div>${App.icon('chevron-right', 16)}</div><div class="kb-entry" onclick="S_KB.history()"><div class="ei navy">${App.icon('history', 20)}</div><div class="grow"><div class="et">历史提问</div><div class="es">已问 ${c.filter((m) => m.role === 'me').length} · 未命中 ${(App.state.kbMissLog || []).length}</div></div>${App.icon('chevron-right', 16)}</div></div>`;
      const suggest = `<div class="section" style="margin-top:6px"><div><div class="eyebrow">${c.length ? '相关 FAQ · 继续问' : '客户常问 · 点一下就问'}</div><h3 style="font-size:15px">${c.length ? '换个问题' : '试试这些问题'}</h3></div>${c.length ? `<div class="more" onclick="S_KB.clear()">清空对话</div>` : `<div class="more">按点击热度</div>`}</div><div class="suggest wrap">${chips}</div>`;
      const body = c.length ? c.map(renderMsg).join('') : renderMsg({ role: 'ai', kind: 'welcome' });
      return `${hero}${entries}${suggest}<div class="chat kb-chat mt12" id="kbChat">${body}</div>`;
    },
    footer() {
      return `<div class="chat-input"><div class="ib ghost" onclick="S_KB.mic()">${App.icon('mic', 18)}</div><div class="in"><input id="kbInput" placeholder="客户问什么，就问什么…（Enter 发送）"></div><div class="ib" onclick="S_KB.sendInput()">${App.icon('send', 18)}</div></div>`;
    },
    mount(root) {
      const inp = root.querySelector('#kbInput');
      if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); S.sendInput(); } });
      if (chat().length) scrollBottom();
    },
  });

  /* ---------- 页面：知识条目 ---------- */
  App.register('kb-article', {
    title: '知识条目', tab: 'kb',
    prd: ['deck p19 · 答案带出处'], rules: ['出处可展开原文', '可见角色由管理后台配置', '反馈回流管理员'],
    render(p) {
      const k = article(p.id);
      if (!k) return App.ui.empty({ icon: 'inbox', title: '条目不存在', sub: '该知识条目未纳入演示' });
      if (!canSee(k)) return `<div class="card"><div class="row"><div class="kb-av gray">${App.icon('lock', 16)}</div><div class="grow"><div class="card-title" style="margin:0">仅主管可见</div><div class="small muted">该条目按角色权限限制，地推销售不可查看</div></div></div></div>${App.ui.btn('申请查看权限', { tone: 'primary', block: true, onclick: "App.toast('已向主管 李华 发送权限申请（演示）',{icon:'send'})" })}`;
      const src = k.sources.map((s, j) => `<div class="si"><div class="row between"><div class="grow"><b>${esc(s.title)}</b><div class="loc">${esc(s.loc)}</div></div>${App.ui.chip(j === 0 ? '主要依据' : '佐证', j === 0 ? 'ai' : 'gray', { sm: true })}</div><div class="quote"><div class="q-cap">原文摘录（演示）</div>${esc(sentence(k.answer, j))}</div></div>`).join('');
      return `<div class="card kb-art"><div class="row top between"><div class="kb-art-q grow">${esc(k.q)}</div>${App.ui.chip(k.kind, 'brand', { sm: true })}</div><div class="divider"></div><div class="eyebrow mb8">答案 · 来自知识库，非 AI 生成</div><div class="ans">${esc(k.answer)}</div><div class="kb-src"><div class="st">出处 · ${k.sources.length} 条</div>${src}</div></div>
      <div class="card"><div class="card-title">适用范围</div><div class="chips">${k.scope.map((s) => App.ui.chip(s, 'outline')).join('')}</div><div class="kb-meta mt12"><div class="mi"><div class="l">可见角色</div><div class="v">${esc(k.role)}</div></div><div class="mi"><div class="l">命中次数</div><div class="v">${k.hits} 次</div></div><div class="mi"><div class="l">版本</div><div class="v">v2 · 2026-08（演示）</div></div><div class="mi"><div class="l">更新</div><div class="v">管理员 · 企业管理后台</div></div></div></div>
      <div class="card"><div class="card-title">这条回答对现场有帮助吗？</div><div class="btn-row">${App.ui.btn('有帮助', { tone: 'secondary', size: 'sm', icon: 'thumbs', onclick: "App.toast('已反馈：有帮助',{icon:'check'})" })}${App.ui.btn('不准确', { tone: 'ghost', size: 'sm', onclick: "App.toast('已反馈：不准确，回流管理员复核',{icon:'send'})" })}${App.ui.btn('补充建议', { tone: 'ghost', size: 'sm', onclick: "App.prompt('补充建议','例：客户常追问药剂气味…',()=>App.toast('已提交管理员（演示）',{icon:'send'}))" })}</div></div>`;
    },
    footer(p) { return App.ui.btn('就这个问题继续问', { tone: 'primary', block: true, icon: 'message', onclick: `App.tab('kb');S_KB.ask('${esc(p.id)}')` }); },
  });

  /* ---------- 页面：拍照识虫 ---------- */
  const sample = (id) => (App.state.pestSamples || []).find((s) => s.id === id);
  S.pick = function (id) {
    const s = sample(id); if (!s) return;
    App.state.ui.pestPicked = id; App.state.ui.pestResult = null; App.save(); App.refresh();
    const close = App.loading('日日新大模型识别中…');
    setTimeout(() => { close(); App.state.ui.pestResult = id; App.save(); if (App.currentEntry() && App.currentEntry().id === 'pest') App.refresh(); }, 1000);
  };
  S.pestClear = function () { App.state.ui.pestPicked = null; App.state.ui.pestResult = null; App.state.ui.pestWritten = false; App.save(); App.refresh(); };
  S.pestWrite = function () { App.state.ui.pestWritten = true; App.save(); App.refresh(); App.toast('已作为候选写入拜访记录（非勘查结论）', { icon: 'check' }); };
  App.register('pest', {
    title: '拍照识虫', tab: 'kb',
    prd: ['deck p19 · 拍照识虫'], rules: ['识别为预置样本，需贵司样本共同验证', '给种类 / 习性 / 危害 / 处置 + 置信度', '模糊返回未知 + 补拍 / 人工协助', '写入拜访为候选，非勘查结论'],
    demoActions: [{ label: '清除结果', icon: 'refresh', run() { S.pestClear(); } }],
    render(p) {
      const st = App.state.ui; const picked = st.pestPicked; const res = st.pestResult ? sample(st.pestResult) : null;
      const store = p.storeId ? App.store(p.storeId) : null;
      const head = `<div class="pg-head"><div class="pg-t">拍照识虫</div><div class="pg-s">识别为预置样本，需贵司样本共同验证 · 结果给 种类 / 习性 / 危害 / 处置 + 置信度${store ? ` · 本次拜访：${esc(store.name)}` : ''}</div></div>`;
      const tiles = `<div class="pest-tiles">${(App.state.pestSamples || []).map((s) => `<div class="pest-tile ${picked === s.id ? 'on' : ''}" onclick="S_KB.pick('${s.id}')">${App.ui.scene(s.kind, s.label)}<div class="pt"><span>${esc(s.kind === 'blur' ? '样例 2 · 模糊' : '样例 1 · 清晰')}</span>${picked === s.id ? App.ui.chip(res ? '已识别' : '识别中', res ? 'ai' : 'gray', { sm: true }) : `<span class="muted">点击识别</span>`}</div></div>`).join('')}</div><div class="tiny muted" style="margin:8px 2px 0">演示图片 · 拍摄时靠近点位、避免逆光；真实识别能力需贵司提供样本共同验证，不给准确率</div>`;
      let result = '';
      if (res && res.unknown) {
        result = `<div class="card mt12 pest-res"><div class="pest-unknown"><div class="ico">${App.icon('eye-off', 22)}</div><div class="grow"><div class="sp">无法识别（未知）</div><div class="alt">不强制给出唯一答案 · 置信度不足</div></div></div>${App.ui.notice('warn', esc(res.note), 'alert')}<div class="btn-row">${App.ui.btn('补拍', { tone: 'primary', size: 'sm', icon: 'camera', onclick: "S_KB.pick('ps1')" })}${App.ui.btn('人工协助', { tone: 'outline', size: 'sm', icon: 'users', onclick: "App.toast('已转技术部人工识别，结果回推手机（演示）',{icon:'send'})" })}</div></div>`;
      } else if (res) {
        result = `<div class="card mt12 pest-res"><div class="row top between"><div class="grow"><div class="eyebrow">识别结果 · 日日新大模型</div><div class="sp">${esc(res.species)}</div><div class="alt">候选：${res.alt.map((a) => `${esc(a.name)} ${Math.round(a.conf * 100)}%`).join(' · ')}</div></div>${App.ui.chip(`置信度 ${Math.round(res.conf * 100)}%`, 'ai')}</div><div class="pest-rows"><div class="pr"><div class="k">习性</div><div>${esc(res.habits)}</div></div><div class="pr"><div class="k">危害</div><div>${esc(res.harm)}</div></div><div class="pr"><div class="k">处置</div><div>${esc(res.handling)}</div></div></div><div class="kb-src"><div class="st">出处</div><div class="si"><b>${esc(res.source)}</b><div class="loc">蜚蠊目 · 德国小蠊 · 与知识条目 k5 一致</div></div></div>${App.ui.notice('ai', esc(res.note) + '；写入拜访记录时标注为候选，勘查结论以技术部现场为准', 'info')}<div class="btn-row">${st.pestWritten ? App.ui.btn('已写入本次拜访', { tone: 'ghost', size: 'sm', icon: 'check', disabled: true }) : App.ui.btn('写入本次拜访记录', { tone: 'primary', size: 'sm', icon: 'check', onclick: 'S_KB.pestWrite()' })}${App.ui.btn('查看知识条目', { tone: 'outline', size: 'sm', icon: 'doc', onclick: "App.go('kb-article',{id:'k5'})" })}</div></div>`;
      } else if (picked) {
        result = `<div class="card mt12"><div class="row"><div class="kb-av">${App.icon('sparkle', 16)}</div><div class="grow"><div class="bold">日日新大模型识别中…</div><div class="small muted">比对预置样本库 · 约 1 秒</div></div></div><div class="mt8">${App.ui.progress(60, true)}</div></div>`;
      } else {
        result = `<div class="card mt12"><div class="row"><div class="kb-av gray">${App.icon('bug', 16)}</div><div class="grow"><div class="bold">选一张样例开始识别</div><div class="small muted">清晰样例 → 种类 + 置信度 + 候选；模糊样例 → 未知 + 补拍 / 人工协助</div></div></div></div>`;
      }
      return `${head}${tiles}${result}`;

    const n = Math.max(0, Math.min(999, parseInt(val, 10) || 0)); p.items[i].qty = n; p.status = p.status === '审批通过' ? 'draft' : p.status; App.save(); paint(p);
  };
  S.disc = function (pid, val) {
    const p = App.proposal(pid); if (!p) return;
    const n = Math.max(0, Math.min(60, parseFloat(val) || 0)); p.discount = n;
    if (p.status === '审批通过' && n !== 12) p.status = 'draft';
    if (p.status === '审批中' ) { /* 审批中改折扣 → 需重新提交 */ p.status = 'draft'; App.toast('折扣已变更，需重新提交审批', { icon: 'alert' }); }
    App.save(); paint(p);
  };
  // 局部重绘：保留输入焦点
  function paint(p) {
    const root = App.currentEntry() && App.currentEntry().el; if (!root) return;
    const c = calc(p);
    p.items.forEach((it, i) => { const el = root.querySelector(`#sub_${i}`); if (el) el.textContent = money(it.qty * it.price); });
    const set = (id, v) => { const el = root.querySelector('#' + id); if (el) el.innerHTML = v; };
    set('qRaw', money(c.raw)); set('qDisc', '−' + money(c.disc)); set('qTotal', money(c.total));
    const di = root.querySelector('#discIn'); if (di) di.classList.toggle('over', c.over);
    set('discNotice', discNotice(p)); set('statusChip', statusChip(p));
    const f = root.querySelector('.footer-bar'); if (f) f.innerHTML = footerHtml(p);
  }
  function discNotice(p) {
    const c = calc(p); const th = G().discountThreshold;
    if (p.status === '审批中') return App.ui.notice('info', `折扣 ${p.discount}% 超阈值 ${th}% → 已提交价格审批 · 审批人 李华 · 审批中；审批通过前不能分享正式报价`, 'clock');
    if (p.status === '审批通过') return App.ui.notice('ok', `折扣 ${p.discount}% 超阈值 ${th}% · 主管 李华 已审批通过（${esc(p.decidedAt)}）→ 可分享正式报价`, 'check-circle');
    if (c.over) return App.ui.notice('warn', `折扣 ${p.discount}% 超阈值 ${th}% → 需提交价格审批（销售端不能自批）· 阈值为演示值，由贵司提供`, 'alert');
    return App.ui.notice('ok', `折扣 ${p.discount}% 在规则内（阈值 ${th}%，演示值）→ 可直接分享预览`, 'check-circle');
  }
  function statusChip(p) {
    const c = calc(p);
    if (p.status === '审批中') return App.ui.chip('审批中', 'warn', { sm: true, dot: true });
    if (p.status === '审批通过') return App.ui.chip('审批通过', 'ok', { sm: true, dot: true });
    if (p.status === '已发送') return App.ui.chip('已发送', 'brand', { sm: true, dot: true });

  function footerHtml(p) {
    const c = calc(p); const sid = p.storeId;

    return `<div class="btn-row">${App.ui.btn('存为草稿', { tone: 'ghost', icon: 'doc', onclick: "App.toast('已存草稿 · 可在 PC 销售工作台精修',{icon:'check'})" })}${share}</div>`;
  }
  S.submit = function (pid) {
    const p = App.proposal(pid); if (!p) return; const store = App.store(p.storeId); const c = calc(p);
    App.prompt('提交价格审批 · 申请理由', `例：客户预算 ${summary(store).budget || '有限'}，竞品报价更低，申请折扣 ${p.discount}%`, (reason) => {

      App.state.team.approvals = App.state.team.approvals || [];
      const apId = 'ap_' + p.id;
      if (!App.state.team.approvals.find((a) => a.id === apId)) App.state.team.approvals.unshift({ id: apId, proposalId: p.id, storeId: p.storeId, title: `${store.name} · 报价 ${p.version}`, by: App.me().name, discount: p.discount, amount: `${money(c.total)}（演示）`, reason: p.reason, status: '审批中', submittedAt: App.TODAY });
      if (App.state.team.kpi) App.state.team.kpi.pendingApprovals = App.state.team.approvals.filter((a) => a.status === '审批中').length;

  App.register('gtm-result', {
    title: 'GTM 助手', tab: 'customers',
    prd: ['deck p20 · 生成结果 · 六段方案 + 报价单'], rules: ['改数量 / 折扣即时重算', '折扣 > 10% 需提交价格审批，销售端不能自批', '成本与毛利为占位字段，仅审批人可见', '演示单价，条款与价格口径由贵司提供'],
    demoActions: [
      { label: '折扣设为 12%（超阈值）', icon: 'percent', run() { const p = App.proposal(propId(App.currentEntry().params.storeId || 's_bing')); if (p) { p.discount = 12; p.status = p.status === '审批通过' ? '审批通过' : 'draft'; App.save(); App.refresh(); } } },
      { label: '折扣恢复 0%', icon: 'refresh', run() { const p = App.proposal(propId(App.currentEntry().params.storeId || 's_bing')); if (p) { p.discount = 0; p.status = 'draft'; App.save(); App.refresh(); } } },
    ],
    render(pa) {
      const store = App.store(pa.storeId || 's_bing');

      const p = ensureProposal(store); const c = calc(p); const sm = summary(store);
      const secs = planSections(store, latestVisit(store));

      const tpl = planTpl(p); const qtpl = quoteTpl(p);
      const plan = `<div class="card"><div class="row top between"><div class="card-title grow" style="margin:0;line-height:1.35">${esc(planTitle(store, p))}</div>${App.ui.chip(`${tpl.version} · ${secs.length} 段`, 'gray', { sm: true })}</div>${shown.map((s, i) => `<div class="plan-sec"><div class="pt">${i + 1}. ${esc(s.t)}</div><div class="pp">${esc(s.p)}</div></div>`).join('')}<button class="plan-more" onclick="S_GTM.expand()">${exp ? '收起 ▴' : `展开全部 ${secs.length} 段（${secs.slice(2).map((s) => s.t).join(' / ')}）▾`}</button><div class="plan-foot">演示模版，条款与价格口径由贵司提供 · 变量来源：${App.fmt.md(sm.date)} 留痕、识虫结果、客户类别</div></div>`;
      const rows = p.items.map((it, i) => `<tr><td><div class="qn">${esc(it.name)}</div><div class="unit">${esc(it.unit)}</div></td><td><input class="qty" type="number" min="0" value="${it.qty}" oninput="S_GTM.qty('${p.id}',${i},this.value)"></td><td class="r">${money(it.price)}</td><td class="r" id="sub_${i}">${money(it.qty * it.price)}</td></tr>`).join('');

      return `${head}${storeCard(store)}${plan}${quote}${ins}${refs}${evts}`;
    },
    footer(pa) { const store = App.store(pa.storeId || 's_bing'); if (!store) return ''; return footerHtml(ensureProposal(store)); },
  });

  /* ---------- 页面：分享与审批 ---------- */
  S.share = function (ch) { App.toast(({ wx: '已生成简版卡片并通过微信分享（演示）', mail: '已发送 PDF 到客户邮箱（演示）', pdf: '已导出 PDF · 可在 PC 精修后再发正式版' })[ch], { icon: 'send' }); };
  S.sent = function (pid) {
    const p = App.proposal(pid); if (!p) return; const c = calc(p);

      else ap = `${App.ui.notice('warn', `折扣 ${p.discount}% 超阈值 ${G().discountThreshold}% → 需提交价格审批（销售端不能自批）`, 'alert')}<div class="ap-row"><div class="k">审批人</div><div class="row">${App.ui.avatar('李华', 'sm')} 李华 · 销售主管</div></div><div class="ap-row"><div class="k">状态</div><div>${statusChip(p)} <span class="small muted">尚未提交</span></div></div><div class="mt8">${App.ui.btn('返回提交价格审批', { tone: 'secondary', size: 'sm', block: true, icon: 'upload', onclick: 'App.back()' })}</div>`;
      const apCard = `${App.ui.section('审批状态', '')}<div class="card">${ap}</div>`;
      const pc = App.ui.notice('gray', '精修、成本与毛利、正式导出在 PC 销售工作台完成；小程序只发简版', 'info');
      return `${head}${storeCard(store, true)}${cover}${tiles}${apCard}${pc}`;
    },
    footer(pa) {
      const store = App.store(pa.storeId || 's_bing'); if (!store) return ''; const p = ensureProposal(store); const c = calc(p);
      const blocked = c.over && p.status !== '审批通过' && p.status !== '已发送';

    },
  });
})();

</script>

  .tm-form textarea { min-height: 78px; resize: none; }
  .tm-form textarea:focus, .tm-form input:focus { border-color: var(--brand); }

  .tm-form .fseg button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-3); font-weight: 600; }
  .tm-form .fseg button small { display: block; font-size: 10.5px; color: var(--ink-4); font-weight: 400; margin-top: 1px; }

  .tm-form .fnote { font-size: 11.5px; color: var(--ink-3); text-align: center; margin-top: 8px; }
  `);

  /* ----------------------------------------------------------
     数据帮手
     ---------------------------------------------------------- */
  const team = () => App.state.team;
  const me = () => App.me();
  const isMe = (id) => id === me().id;
  S.member = (id) => team().members.find((m) => m.id === id) || null;
  S.memberByName = (name) => team().members.find((m) => m.name === name) || null;
  S.memberName = (id) => { const m = S.member(id); if (m) return m.name; const u = Object.values(App.state.users).find((x) => x.id === id); return u ? u.name : id; };
  S.addDays = (s, n) => { const d = App.dayjs(s); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  // 演示时钟：从 10:30 起每次操作 +1 分钟
  S.stamp = function () { const ui = App.state.ui; ui.tmClock = (ui.tmClock || 30) + 1; const m = ui.tmClock; return `${TODAY} ${m >= 60 ? '11' : '10'}:${String(m % 60).padStart(2, '0')}`; };
  S.isOverdue = (t) => t.due && t.due < TODAY && !['已完成', '已拒绝'].includes(t.status);
  S.kindTone = (kind) => ({ 催办: 'warn', 辅导: 'brand', 报价: 'ai', 下发: 'navy', 任务: 'gray' }[kind] || 'gray');
  S.kindGlyph = (kind) => ({ 催办: '催', 辅导: '辅', 报价: '价', 下发: '发', 任务: '建' }[kind] || (kind || '任').slice(0, 1));
  S.kindLabel = (kind) => ({ 催办: '催办', 辅导: '辅导任务', 报价: '报价待办', 下发: '下发客户', 任务: '主管任务' }[kind] || kind);
  S.statusChip = (st, opts) => ({ 待接受: App.ui.chip('待接受', 'warn', opts), 执行中: App.ui.chip('执行中', 'info', opts), 已完成: App.ui.chip('已完成', 'ok', opts), 已拒绝: App.ui.chip('已拒绝', 'gray', opts) }[st] || App.ui.chip(st, 'gray', opts));
  S.dueText = (due) => `${App.fmt.md(due)}（${App.fmt.dueLabel(due)}）`;
  S.initiator = (t) => t.fromRole === 'sys' ? null : (t.fromRole === 'mgr' ? 'u_mgr' : (t.fromRole === 'ka' ? 'u_ka' : (t.fromRole === 'dj' ? 'u_dj' : null)));
  S.pendingApprovalCount = () => team().approvals.filter((a) => a.status === '审批中').length + (App.state.proposals || []).filter((p) => p.status === '审批中').length;
  S.avatar = (m, cls = '') => `<div class="tm-av ${cls}" style="background:${esc(m.color || '#1e5bd8')}">${esc(App.initials(m.name))}</div>`;
  S.tile = (t) => `<div class="tm-tile ${S.kindTone(t.kind)}">${esc(S.kindGlyph(t.kind))}</div>`;

  // 创建任务（任意角色可发；接收方接受 / 拒绝须填意见，结果推回发起人）
  S.createTask = function ({ kind, title, toId, due, source, body, storeId, visitId }) {
    const u = me();
    const t = {
      id: App.uid('t'), kind, title, from: `${u.name}（${u.roleName.replace('销售', '') === '主管' ? '主管' : u.roleName}）`, fromRole: App.state.role, toId, due: due || TODAY,
      status: '待接受', source: source || '主管创建', body: body || '', storeId: storeId || null, visitId: visitId || null,
      createdAt: S.stamp(), history: [],
    };
    t.history.push({ t: t.createdAt, e: `${u.roleName === '销售主管' ? '主管 ' : ''}${u.name} 发起 · ${source || '主管创建'}` });
    App.state.tasks.unshift(t);
    App.save();
    return t;
  };
  S.taskCell = function (t, opts = {}) {
    const to = S.memberName(t.toId);
    const sub = opts.showTo ? `发给 ${esc(to)} · ${esc(t.source || t.from)} · 截止 ${App.fmt.md(t.due)}` : `${esc(t.source || t.from)} · 截止 ${App.fmt.md(t.due)}（${App.fmt.rel(t.due)}）`;
    const right = S.isOverdue(t) ? App.ui.chip('逾期', 'danger', { sm: true }) + S.statusChip(t.status, { sm: true }) : S.statusChip(t.status, { sm: true });
    return `<div class="cell pressable" onclick="App.go('task',{id:'${t.id}'})">${S.tile(t)}<div class="cell-body"><div class="cell-title ellipsis">${esc(t.title)}</div><div class="cell-sub ellipsis">${sub}</div></div><div class="cell-right">${right}${App.icon('chevron-right', 16)}</div></div>`;
  };

  /* ----------------------------------------------------------
     表单浮层（接收人 / 内容 / 截止）
     ---------------------------------------------------------- */
  S._form = null;
  S.form = function ({ title, fields, submit = '发起', note, onSubmit }) {
    App.closeOverlay();
    const ov = App.q('#overlay');
    const mask = document.createElement('div'); mask.className = 'mask'; mask.onclick = App.closeOverlay;
    const sh = document.createElement('div'); sh.className = 'sheet tm-form';
    const vals = {}; fields.forEach((f) => { vals[f.key] = f.value != null ? f.value : (f.type === 'member' ? null : ''); });
    S._form = { vals, fields };
    const rows = fields.map((f) => {
      let ctl = '';
      if (f.type === 'member') ctl = `<div class="fchips" data-key="${f.key}">${f.options.map((m) => `<div class="fchip ${vals[f.key] === m.id ? 'on' : ''}" data-v="${m.id}"><span class="av" style="background:${esc(m.color)}">${esc(App.initials(m.name))}</span>${esc(m.name)}<span class="muted tiny">${esc(m.role)}</span></div>`).join('')}</div>`;
      else if (f.type === 'seg') ctl = `<div class="fseg" data-key="${f.key}">${f.options.map((o) => `<button type="button" class="${vals[f.key] === o.v ? 'on' : ''}" data-v="${esc(o.v)}">${esc(o.l)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}</div>`;
      else if (f.type === 'select') ctl = `<select data-key="${f.key}">${f.options.map((o) => `<option value="${esc(o.v)}" ${vals[f.key] === o.v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
      else if (f.type === 'textarea') ctl = `<textarea data-key="${f.key}" placeholder="${esc(f.placeholder || '')}">${esc(vals[f.key])}</textarea>`;
      else if (f.type === 'static') ctl = `<div style="font-size:14.5px">${f.html || esc(vals[f.key])}</div>`;
      else ctl = `<input type="text" data-key="${f.key}" placeholder="${esc(f.placeholder || '')}" value="${esc(vals[f.key])}">`;
      return `<div class="frow"><div class="fl ${f.required ? 'req' : ''}">${esc(f.label)}</div>${ctl}</div>`;
    }).join('');
    sh.innerHTML = `<div class="sheet-handle"></div><div class="ft">${esc(title)}</div><div class="fb">${rows}</div><div class="ff">${App.ui.btn(submit, { tone: 'primary', block: true, cls: 'tm-submit' })}<div class="fnote">${note ? esc(note) : '发起后接收方「待接受」；接受 / 拒绝（附意见）结果推回发起人'}</div></div>`;
    // 绑定
    App.qa('.fchips', sh).forEach((box) => App.qa('.fchip', box).forEach((c) => { c.onclick = () => { vals[box.dataset.key] = c.dataset.v; App.qa('.fchip', box).forEach((x) => x.classList.toggle('on', x === c)); }; }));
    App.qa('.fseg', sh).forEach((box) => App.qa('button', box).forEach((b) => { b.onclick = () => { vals[box.dataset.key] = b.dataset.v; App.qa('button', box).forEach((x) => x.classList.toggle('on', x === b)); }; }));
    App.qa('select, textarea, input', sh).forEach((n) => { n.oninput = n.onchange = () => { vals[n.dataset.key] = n.value; }; });
    App.q('.tm-submit', sh).onclick = () => {
      for (const f of fields) {
        if (f.required && !(vals[f.key] && String(vals[f.key]).trim())) { App.toast(`请填写${f.label}`, { bottom: true, icon: 'alert' }); return; }
      }
      App.closeOverlay(); S._form = null;
      onSubmit(vals);
    };
    ov.appendChild(mask); ov.appendChild(sh);
    const ta = App.q('textarea', sh); if (ta && !ta.value) setTimeout(() => ta.focus(), 80);
  };
  const DUE_OPTS = [{ v: S.addDays(TODAY, 1), l: '明天', sub: App.fmt.md(S.addDays(TODAY, 1)) }, { v: S.addDays(TODAY, 3), l: '3 天后', sub: App.fmt.md(S.addDays(TODAY, 3)) }, { v: '2026-09-11', l: '本周五', sub: '9月11日' }];
  S.afterCreate = function (t) {
    App.refresh();
    App.toast(`已发起 · 等待 ${S.memberName(t.toId)} 接受 / 拒绝，结果推回`, { icon: 'send', duration: 2000 });
  };

  /* ---------- 四个主管动作 ---------- */
  // 一键催办：对今日已打点未留痕的成员
  S.urge = function (memberId, storeId) {
    const p = team().pendingTrace.find((x) => (!memberId || x.memberId === memberId) && (!storeId || x.storeId === storeId)) || team().pendingTrace[0];
    if (!p) { App.toast('今日全部已留痕，无需催办', { icon: 'check-circle' }); return; }
    const store = App.store(p.storeId) || { name: '门店' };
    const exists = App.state.tasks.find((t) => t.kind === '催办' && t.toId === p.memberId && t.storeId === p.storeId && !['已完成', '已拒绝'].includes(t.status)) || App.state.tasks.find((t) => t.id === 't_cuiban' && t.toId === p.memberId && !['已完成', '已拒绝'].includes(t.status));
    if (exists) { S.pushHistory(exists, `${me().name} 再次催办`); App.save(); App.refresh(); App.toast(`已催办过 · 已再次提醒 ${p.name}（待办「${exists.title.slice(0, 10)}…」仍${exists.status}）`, { icon: 'bell', duration: 2000 }); return; }
    const t = S.createTask({ kind: '催办', title: `催办：${store.name.replace(/（.*?）/g, '')}今日已打点未留痕`, toId: p.memberId, due: TODAY, source: '主管催办', body: `${p.checkin} 打点${store.route && store.route.checkout ? `、${store.route.checkout} 离店` : ''}，尚未留痕；请今天内补录（30 秒留痕 · 设计目标）。`, storeId: p.storeId });
    App.refresh();
    App.toast(`已催办：${p.name} 的待办里出现「${t.title.slice(0, 10)}…」`, { icon: 'bell', duration: 2000 });
  };
  S.urgeForm = function () {
    const p = team().pendingTrace;
    if (!p.length) { App.toast('今日全部已留痕，无需催办', { icon: 'check-circle' }); return; }
    S.form({
      title: '一键催办 · 已打点未留痕', submit: '发起催办',
      fields: [
        { key: 'toId', label: '接收人', type: 'member', required: true, value: p[0].memberId, options: team().members.filter((m) => p.some((x) => x.memberId === m.id)) },
        { key: 'body', label: '内容', type: 'textarea', required: true, value: `${(App.store(p[0].storeId) || {}).name || ''} ${p[0].checkin} 打点，尚未留痕；请今天内补录。` },

  S.findAsk = function (q) {
    const list = team().ask;
    const exact = list.find((a) => a.q === q); if (exact) return exact;
    const s = q.replace(/\s/g, '');
    if (/留痕率/.test(s)) return list.find((a) => a.kind === 'stat') || null;
    if (/街道/.test(s)) return list.find((a) => /街道/.test(a.q)) || null;
    if (/类型|转化/.test(s)) return list.find((a) => /类型/.test(a.q)) || null;
    if (/每天|每日|按天|周几/.test(s)) return list.find((a) => /每天/.test(a.q)) || null;
    return null;
  };
  S.askLog = () => { const ui = App.state.ui; if (!Array.isArray(ui.askLog)) ui.askLog = []; return ui.askLog; };
  S.ask = function (q) {
    q = (q || '').trim(); if (!q) return;
    const log = S.askLog();
    log.push({ q, at: S.stamp() });
    if (log.length > 6) log.splice(0, log.length - 6);
    App.save();
    const cur = App.currentEntry();
    if (cur && cur.id === 'ask') { App.refresh(); S.scrollAskBottom(); } else App.go('ask');

  S.approvalList = function () {
    const list = team().approvals.map((a) => Object.assign({ _src: 'team' }, a));
    (App.state.proposals || []).forEach((p) => {
      if (p.status !== '审批中' && p.status !== '已通过' && p.status !== '已驳回') return;
      if (list.some((a) => a.id === p.id)) return;
      const s = App.store(p.storeId);
      list.push({ _src: 'proposal', id: p.id, title: p.title || `${s ? s.name.replace(/（.*?）/g, '') : '客户'} · 报价 ${p.version || 'v1'}`, by: p.by || (s ? s.ownerName : '王小明'), discount: p.discount != null ? p.discount : (p.discountPct || 0), amount: p.amount || (p.total != null ? App.fmt.money(p.total) : '—'), reason: p.reason || '折扣超阈值（10%）提交价格审批', status: p.status, submittedAt: p.submittedAt || TODAY, history: p.history || [] });
    });
    return list;
  };
  S.approvalStatusChip = (st) => ({ 审批中: App.ui.chip('审批中', 'warn'), 已通过: App.ui.chip('已通过', 'ok'), 已驳回: App.ui.chip('已驳回', 'danger') }[st] || App.ui.chip(st, 'gray'));
  S.selectApproval = function (id) { App.state.ui.apprSel = id; App.save(); App.refresh(); };
  S.findApproval = function (id) { return team().approvals.find((a) => a.id === id) || (App.state.proposals || []).find((p) => p.id === id) || null; };
  S.decide = function (id, ok, comment) {
    const a = S.findApproval(id); if (!a) return;
    a.status = ok ? '已通过' : '已驳回';
    a.decidedAt = S.stamp(); a.comment = comment || (ok ? '同意，按规则内执行' : '');
    a.history = a.history || [];
    a.history.push({ t: a.decidedAt, e: `主管 李华 ${ok ? '通过' : '驳回'}${comment ? `：${comment}` : ''}` });
    const byM = S.memberByName(a.by);
    const toId = byM ? byM.id : 'u_dj';
    const opp = App.state.opportunities.find((o) => o.approval === '审批中' && (a.title || '').includes((o.name || '').split(' ')[0].replace(/（.*?）/g, '').slice(0, 4)));
    if (opp) opp.approval = a.status;
    if (ok) {
      S.createTask({ kind: '报价', title: `发送正式报价 · ${(a.title || '').replace(/ · 报价.*$/, '')}（审批已通过）`, toId, due: S.addDays(TODAY, 1), source: '审批通过自动生成', body: `折扣 ${a.discount}%，主管审批已通过，请发送正式报价单。${a.comment ? `审批意见：${a.comment}` : ''}` });

      const cnt = (s) => all.filter((t) => t.status === s).length;

      const sent = list.filter((t) => !isMe(t.toId));
      const head = `<div class="row between" style="padding:4px 2px 10px"><div><div style="font-size:22px;font-weight:800;letter-spacing:-.01em">待办 · ${all.filter((t) => ['待接受', '执行中'].includes(t.status)).length}</div><div class="muted small">${esc(me().name)} · 收到 ${all.filter((t) => isMe(t.toId) && ['待接受', '执行中'].includes(t.status)).length} · 发出 ${all.filter((t) => !isMe(t.toId) && ['待接受', '执行中'].includes(t.status)).length}${cnt('已拒绝') ? ` · 已拒绝 ${cnt('已拒绝')}` : ''}</div></div>${App.isMgr() ? App.ui.btn('创建任务', { tone: 'secondary', size: 'sm', icon: 'plus', onclick: 'S_TEAM.taskForm()' }) : App.ui.btn('回访提醒', { tone: 'ghost', size: 'sm', icon: 'bell', onclick: "App.go('reminders')" })}</div>`;
      const segHtml = `<div class="seg block mb12">${segs}</div>`;

      return `${head}${segHtml}${amber}${body}${rejected}<div class="tm-foot">回访提醒（分层规则 / 上次约定）在「路线 → 回访提醒与待办」；本页为任务闭环：接受 / 拒绝附意见 / 完成 / 延期</div>`;
    },
  });
})();

      const acc = `<div class="me-acc"><div class="top">${App.ui.avatar(me.name, 'lg')}<div class="grow"><div class="nm"><span>${esc(me.name)}</span><span class="fic">虚构</span></div><div class="rl">${esc(me.roleName)} · ${esc(me.org)}</div><div class="rl" style="opacity:.7;font-size:12px">${esc(me.phone || '')}</div></div><button class="sw" onclick="S_ME.switchAccount()">${App.icon('refresh', 13)}切换账号</button></div>
        <div class="stats">${stats.map((x) => `<div class="m"><div class="v">${esc(x.v)}</div><div class="l">${esc(x.l)}</div></div>`).join('')}</div></div>`;
      const permRows = PERMS.map((x) => `<div class="me-perm"><div class="pi ${x.tone}">${App.icon(x.icon, 18)}</div><div class="grow"><div class="pt">${esc(x.title)}${p[x.key] ? App.ui.chip('已授权', 'ok', { sm: true, dot: true }) : App.ui.chip('未授权', 'gray', { sm: true, dot: true })}</div><div class="ps">${esc(x.sub)}</div></div><div class="me-switch ${p[x.key] ? 'on' : ''}" role="switch" aria-checked="${!!p[x.key]}" onclick="S_ME.togglePerm('${x.key}')"></div></div>`).join('');
      const perms = `<div class="me-grp">授权状态</div><div class="list">${permRows}<div class="me-note">${App.icon('shield', 13)}<span>只在拜访期间打点，结束即停止；录音原文与音频保存在贵司租户内。用途说明见 <a class="link" onclick="App.go('auth')">授权页 ›</a></span></div></div>`;
      const cells1 = `<div class="me-grp">账号与范围</div><div class="list">
        ${App.ui.cell({ title: '数据范围', sub: esc(me.scope), icon: 'shield', iconTone: 'info', onclick: 'S_ME.scope()' })}
        ${App.ui.cell({ title: '消息与晨报', sub: `晨报 07:30 ${n.brief ? '开' : '关'} · 回访提醒 ${n.remind ? '开' : '关'} · 任务通知 ${n.task ? '开' : '关'}`, icon: 'bell', iconTone: 'warn', onclick: 'S_ME.notif()' })}
        ${App.ui.cell({ title: '切换演示账号', sub: '地推销售 王小明 / KA 销售 陈奕辰 / 销售主管 李华（均虚构）', icon: 'users', iconTone: '', onclick: 'S_ME.switchAccount()', badge: App.ui.chip(me.roleName, 'brand', { sm: true }) })}
        ${App.ui.cell({ title: '管理员请使用企业管理后台', sub: '字段 · 门槛 · 分层规则 · 模版 · 知识库 · 热词 · CRM 对接', icon: 'settings', iconTone: 'gray', onclick: 'S_ME.admin()' })}
      </div>`;
      const cells2 = `<div class="me-grp">帮助</div><div class="list">
        ${App.ui.cell({ title: '演示规则说明', sub: '门槛 60 分 · 五维权重 · 分层阈值为演示值 · 热词', icon: 'doc', iconTone: 'ai', onclick: 'S_ME.rules()' })}
        ${App.ui.cell({ title: '帮助与反馈', sub: '常见问题 · 反馈给管理员', icon: 'question', iconTone: 'info', onclick: 'S_ME.help()' })}
        ${App.ui.cell({ title: '关于', sub: '销售智助（暂用名）· v1.0 演示', icon: 'info', iconTone: 'gray', onclick: 'S_ME.about()' })}
        ${App.ui.cell({ title: '重置演示数据', sub: '恢复到演示初始状态', icon: 'refresh', iconTone: 'warn', onclick: 'S_ME.resetData()' })}
      </div>`;
      const logout = `<div class="list">${App.ui.cell({ title: '<span style="color:var(--danger);font-weight:600">退出登录</span>', icon: 'logout', iconTone: 'danger', onclick: 'S_ME.logout()', arrow: false })}</div>`;
      const ver = `<div class="me-ver">销售智助 v1.0 演示 · 商汤 AI 销售管理平台 · 商汤科技 · 大模型生态渠道部<br>语音、识别、抽取、问答与生成由日日新大模型能力承担（原型为规则模拟）</div>`;
      return acc + perms + cells1 + cells2 + logout + ver;
    },
    demoActions: [
      { label: '一键开启三项授权', icon: 'shield', run() { App.state.perms = { mic: true, geo: true, cam: true }; App.save(); App.refresh(); App.toast('三项授权已开启', { icon: 'shield' }); } },
      { label: '切到主管账号', icon: 'users', run() { App.setRole('mgr'); App.tab('me'); } },
    ],
  });
})();

</script>
<script>App.boot();</script>
