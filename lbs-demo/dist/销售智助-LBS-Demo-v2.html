/* ============================================================
   商汤 AI 销售管理平台 · 小程序「销售智助」LBS Demo — 设计系统（藏青 + 企业蓝，与汇报 deck 一致）
   纯前端演示，微信小程序视觉语言（iOS 风格）
   ============================================================ */

:root {
  /* 画布 */
  --canvas: #1b2430;
  --canvas-2: #0f172a;

  /* 页面 */
  --bg: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #f1f5fa;
  --surface-3: #eef3fa;

  /* 文字 */
  --ink: #13223f;
  --ink-2: #3d4a63;
  --ink-3: #7b8798;
  --ink-4: #9aa5b5;
  --line: #e6ebf2;
  --line-2: #d9e0ea;

  /* 品牌：企业蓝（主操作 / 已确认事实） */
  --brand: #1e5bd8;
  --brand-2: #3b7cf0;
  --brand-3: #0f3a85;
  --brand-soft: #e8f0fc;
  --brand-soft-2: #c6d8f3;

  /* AI 派生（青绿，与事实区分） */
  --ai: #0b7d93;
  --ai-2: #1596ad;
  --ai-soft: #e1f2f5;
  --ai-soft-2: #c9e6ec;

  /* 语义 */
  --warn: #b9770e; --warn-soft: #fbf0da;
  --danger: #b8433a; --danger-soft: #f5dedb;
  --info: #1e5bd8; --info-soft: #e8f0fc;
  --ok: #1f8a4c; --ok-soft: #e3f3e9;
  --gray: #6b7280; --gray-soft: #eef0f3;
  --violet: #7c3aed; --violet-soft: #f1e9ff;

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  --shadow-xs: 0 1px 2px rgba(16, 24, 40, .04);
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 18px rgba(16, 24, 40, .06);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .12);

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --phone-w: 390px;
  --phone-h: 844px;
  --tabbar-h: 84px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
}
button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
svg { display: block; }
svg.ico { display: inline-block; vertical-align: -0.18em; flex: none; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ============================================================
   页面布局：左侧演示导览 + 右侧手机
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100vh;
  height: 100dvh;
}
.stage-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(900px 500px at 70% -10%, rgba(30, 91, 216, .18), transparent 60%),
    radial-gradient(700px 500px at 20% 110%, rgba(11, 125, 147, .14), transparent 60%),
    linear-gradient(180deg, var(--canvas), var(--canvas-2));
}
.stage-caption {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  color: #8fa1bd; font-size: 12px; letter-spacing: .04em; white-space: nowrap;
}

/* 手机壳 */
.phone {
  width: var(--phone-w);
  height: var(--phone-h);
  border-radius: 56px;
  background: #0b0f14;
  padding: 11px;
  box-shadow:
    0 0 0 2px #2b3138,
    0 0 0 4px #0b0f14,
    0 40px 90px rgba(10, 20, 40, .35),
    0 10px 30px rgba(10, 20, 40, .18);
  position: relative;
  flex: none;
}
.phone::before { /* 侧键 */
  content: ""; position: absolute; left: -6px; top: 180px; width: 4px; height: 96px; border-radius: 3px; background: #23282e;
}
.phone::after {
  content: ""; position: absolute; right: -6px; top: 210px; width: 4px; height: 64px; border-radius: 3px; background: #23282e;
}
.phone-screen {
  position: relative;
  height: 100%;
  border-radius: 46px;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 118px; height: 34px; border-radius: 20px; background: #0b0f14; z-index: 60;
}
.statusbar {
  height: 54px; flex: none;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 30px 6px 34px;
  font-size: 15px; font-weight: 600; letter-spacing: .01em;
  position: relative; z-index: 50;
  background: transparent;
}
.statusbar .right { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.stage { position: relative; flex: 1; overflow: hidden; }

/* ============================================================
   屏幕（每个页面自带导航栏 / 内容 / 可选 TabBar）
   ============================================================ */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
  will-change: transform;
}
.screen.under { visibility: hidden; }
.screen.enter { transform: translateX(100%); }
.screen.enter-active { transform: translateX(0); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.screen.leave { transform: translateX(0); transition: transform .28s cubic-bezier(.4, 0, .8, .6); }
.screen.leave-active { transform: translateX(100%); }
.screen.fade { animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

.navbar {
  height: 44px; flex: none; position: relative;
  display: flex; align-items: center;
  background: var(--bg);
  z-index: 5;
}
.navbar.solid { background: var(--surface); border-bottom: .5px solid var(--line-2); }
.navbar .nav-left {
  position: absolute; left: 6px; top: 0; height: 44px; display: flex; align-items: center; gap: 2px;
  padding: 0 6px; color: var(--ink);
}
.navbar .nav-left button { display: flex; align-items: center; height: 32px; padding: 0 4px; border-radius: 8px; }
.navbar .nav-left button:active { background: rgba(0, 0, 0, .06); }
.navbar .nav-title {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  height: 44px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 600; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.capsule {
  position: absolute; right: 7px; top: 6px;
  width: 87px; height: 32px; border-radius: 16px;
  border: 1px solid rgba(0, 0, 0, .08);
  background: rgba(255, 255, 255, .72);
  display: flex; align-items: center;
  backdrop-filter: blur(10px);
}
.capsule > span { flex: 1; display: flex; align-items: center; justify-content: center; height: 100%; color: #111; }
.capsule > span + span { border-left: 1px solid rgba(0, 0, 0, .08); }

.content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 8px 14px 28px;
  overscroll-behavior: contain;
}
.content.has-tab { padding-bottom: 20px; }
.content.flush { padding: 0; }

/* TabBar：五 Tab，中间「客户」凸起 */
.tabbar {
  flex: none; height: var(--tabbar-h);
  background: rgba(255, 255, 255, .97);
  border-top: .5px solid var(--line-2);
  display: flex; padding: 6px 4px 0;
  position: relative;
}
.tabbar .tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--ink-3); font-size: 10.5px; font-weight: 500; padding-top: 2px;
  position: relative;
}
.tabbar .tab .tab-ico { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); color: var(--ink-4); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
.tabbar .tab.active { color: var(--brand); }
.tabbar .tab.active .tab-ico { background: var(--brand); color: #fff; }
.tabbar .tab.center .tab-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 22px; margin-top: -30px; box-shadow: 0 10px 22px rgba(30, 91, 216, .38); border: 3px solid #fff; }
.tabbar .tab.center.active .tab-ico { background: var(--brand-3); }
.tabbar .tab .badge {
  position: absolute; top: -2px; left: calc(50% + 8px);
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
/* 演示标注条（每页固定，位于 TabBar 上方） */
.demo-note { flex: none; display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); background: var(--surface-2); border-top: .5px solid var(--line); padding: 3px 36px; letter-spacing: .02em; }
.home-indicator {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px; background: #111; opacity: .9; z-index: 70; pointer-events: none;
}

/* ============================================================
   通用组件
   ============================================================ */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-xs);
  border: 1px solid rgba(17, 24, 39, .04);
  margin-bottom: 12px;
}
.card.tight { padding: 10px 12px; }
.card.flush { padding: 0; overflow: hidden; }
.card.pressable { transition: transform .12s ease, box-shadow .12s ease; }
.card.pressable:active { transform: scale(.985); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.card-sub { color: var(--ink-3); font-size: 12.5px; }

.section { display: flex; align-items: flex-end; justify-content: space-between; margin: 18px 2px 10px; }
.section:first-child { margin-top: 6px; }
.section h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.section .eyebrow { color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.section .more { color: var(--ink-3); font-size: 13px; display: flex; align-items: center; gap: 2px; }
.section .more.brand { color: var(--brand); }

.eyebrow { color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11px; }
.bold { font-weight: 600; }
.strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 4px; }
.grow { flex: 1; min-width: 0; }
.mt4 { margin-top: 4px } .mt8 { margin-top: 8px } .mt12 { margin-top: 12px } .mt16 { margin-top: 16px }
.mb8 { margin-bottom: 8px } .mb12 { margin-bottom: 12px }
.gap4 { gap: 4px } .gap6 { gap: 6px } .gap12 { gap: 12px }
.divider { height: .5px; background: var(--line-2); margin: 10px 0; }
.hr { height: .5px; background: var(--line-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* Chip / 状态标签 */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;
  background: var(--gray-soft); color: var(--gray);
}
.chip svg { width: 12px; height: 12px; }
.chip.sm { height: 18px; padding: 0 6px; font-size: 10.5px; }
.chip.brand { background: var(--brand-soft); color: var(--brand-3); }
.chip.ai { background: var(--ai-soft); color: var(--ai); }
.chip.warn { background: var(--warn-soft); color: #b45309; }
.chip.danger { background: var(--danger-soft); color: #b91c1c; }
.chip.info { background: var(--info-soft); color: #1d4ed8; }
.chip.ok { background: var(--ok-soft); color: #15803d; }
.chip.violet { background: var(--violet-soft); color: #6d28d9; }
.chip.gray { background: var(--gray-soft); color: var(--gray); }
.chip.outline { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* 列表单元 */
.cell {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--surface);
  min-height: 52px;
}
.cell + .cell { border-top: .5px solid var(--line); }
.cell .cell-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--brand-soft); color: var(--brand); }
.cell .cell-icon.ai { background: var(--ai-soft); color: var(--ai); }
.cell .cell-icon.warn { background: var(--warn-soft); color: var(--warn); }
.cell .cell-icon.danger { background: var(--danger-soft); color: var(--danger); }
.cell .cell-icon.info { background: var(--info-soft); color: var(--info); }
.cell .cell-icon.gray { background: var(--gray-soft); color: var(--gray); }
.cell .cell-body { flex: 1; min-width: 0; }
.cell .cell-title { font-size: 15px; font-weight: 500; }
.cell .cell-title > .ellipsis { flex: 0 1 auto; min-width: 0; }
.cell .cell-title > .chip { flex: none; }
.cell .cell-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.cell .cell-right { color: var(--ink-3); font-size: 13px; display: flex; align-items: center; gap: 4px; flex: none; }
.cell.pressable:active { background: var(--surface-2); }
.list { background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px; border: 1px solid rgba(17, 24, 39, .04); }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 18px; border-radius: 12px;
  font-size: 15px; font-weight: 600; line-height: 1;
  transition: transform .1s ease, opacity .1s ease, background .15s ease;
  user-select: none; white-space: nowrap;
}
.btn:active { transform: scale(.98); opacity: .92; }
.btn.primary { background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(30, 91, 216, .28); }
.btn.secondary { background: var(--brand-soft); color: var(--brand-3); }
.btn.ghost { background: var(--surface-3); color: var(--ink-2); }
.btn.outline { background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: #b91c1c; }
.btn.ai { background: var(--ai); color: #fff; box-shadow: 0 6px 16px rgba(11, 125, 147, .28); }
.btn.block { display: flex; width: 100%; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn.xs { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.lg { height: 50px; font-size: 16px; border-radius: 14px; }
.btn[disabled], .btn.disabled { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.link { color: var(--brand); font-weight: 500; }
.link.ai { color: var(--ai); }

/* 底部固定操作区 */
.footer-bar {
  flex: none; padding: 10px 14px 24px; background: rgba(255, 255, 255, .96);
  border-top: .5px solid var(--line-2); backdrop-filter: blur(12px);
}

/* 分段控件 */
.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { height: 30px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
.seg.block { display: flex; } .seg.block button { flex: 1; }

/* 筛选条 */
.filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.filter-bar .fchip {
  flex: none; height: 30px; padding: 0 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line-2);
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 4px;
}
.filter-bar .fchip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.filter-bar .fchip .count { opacity: .7; font-size: 11px; }

/* 搜索 */
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink-3); font-size: 14px; }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis.four { grid-template-columns: repeat(4, 1fr); }
.kpi { background: var(--surface); border-radius: 14px; padding: 12px 10px; border: 1px solid rgba(17, 24, 39, .04); }
.kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.kpi .s { font-size: 11px; margin-top: 3px; }
.kpi.warn .v { color: var(--warn); } .kpi.danger .v { color: var(--danger); } .kpi.brand .v { color: var(--brand); } .kpi.ai .v { color: var(--ai); } .kpi.info .v { color: var(--info); }

/* 头像 */
.avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; background: linear-gradient(135deg, #5b8deb, #1e5bd8); }
.avatar.sm { width: 26px; height: 26px; font-size: 11px; }
.avatar.lg { width: 56px; height: 56px; font-size: 20px; }
.avatar.ai { background: var(--ai); }
.avatar.gray { background: linear-gradient(135deg, #cbd5e1, #94a3b8); }
.avatar.warm { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.avatar.blue { background: linear-gradient(135deg, #60a5fa, #2563eb); }

/* AI 卡（派生数据，视觉上与事实区分） */
.ai-card {
  position: relative;
  background: linear-gradient(160deg, #f2fafc 0%, #e1f2f5 100%);
  border: 1px solid #c9e6ec;
  border-radius: var(--radius-lg);
  padding: 14px 16px; margin-bottom: 12px;
}
.ai-card .ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ai-card .ai-head .ai-logo { width: 26px; height: 26px; border-radius: 8px; background: var(--ai); color: #fff; display: flex; align-items: center; justify-content: center; }
.ai-card .ai-head .t { font-weight: 700; font-size: 14px; color: #085f70; }
.ai-card .ai-head .m { font-size: 11px; color: #4d8a97; }
.ai-card .ai-body { font-size: 14px; color: #1f3a45; }
.ai-card ul { padding-left: 16px; }
.ai-card li { margin: 4px 0; }
.ai-note { font-size: 11.5px; color: #4d8a97; margin-top: 8px; display: flex; align-items: center; gap: 4px; }

/* 事实/派生标识 */
.fact-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; letter-spacing: .02em; }
.fact-tag.fact { background: var(--brand-soft); color: var(--brand-3); }
.fact-tag.derived { background: var(--ai-soft); color: var(--ai); }
.fact-tag.pending { background: var(--warn-soft); color: #b45309; }
.fact-tag.official { background: #e6f0ff; color: #1d4ed8; }

/* 提示条 */
.notice { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; margin-bottom: 12px; }
.notice svg { flex: none; margin-top: 1px; }
.notice.warn { background: var(--warn-soft); color: #92400e; }
.notice.danger { background: var(--danger-soft); color: #991b1b; }
.notice.info { background: var(--info-soft); color: #1e3a8a; }
.notice.ok { background: var(--ok-soft); color: #14532d; }
.notice.ai { background: var(--ai-soft); color: #085f70; }
.notice.gray { background: var(--surface-3); color: var(--ink-2); }

/* 步骤 / 状态机 */
.stepper { display: flex; align-items: flex-start; }
.stepper .step { flex: 1; position: relative; text-align: center; font-size: 10.5px; color: var(--ink-3); padding-top: 27px; line-height: 1.2; }
.stepper .step::before { content: ""; position: absolute; top: 7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); z-index: 1; }
.stepper .step::after { content: ""; position: absolute; top: 13px; left: 50%; right: -50%; height: 2px; background: var(--line-2); }
.stepper .step:last-child::after { display: none; }
.stepper .step.done { color: var(--brand-3); }
.stepper .step.done::before { background: var(--brand); border-color: var(--brand); }
.stepper .step.done::after { background: var(--brand); }
.stepper .step.current { color: var(--ink); font-weight: 700; }
.stepper .step.current::before { background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.stepper .step.error::before { background: var(--danger); border-color: var(--danger); }
.stepper .step.error { color: var(--danger); }

/* 垂直时间线 */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line-2); }
.timeline .tl-item { position: relative; padding: 0 0 16px; }
.timeline .tl-item::before { content: ""; position: absolute; left: -19px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--brand-soft-2); }
.timeline .tl-item.ai::before { background: var(--ai); box-shadow: 0 0 0 2px var(--ai-soft-2); }
.timeline .tl-item.warn::before { background: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
.timeline .tl-item.gray::before { background: var(--ink-4); box-shadow: 0 0 0 2px var(--gray-soft); }
.timeline .tl-time { font-size: 11.5px; color: var(--ink-3); margin-bottom: 2px; }
.timeline .tl-title { font-size: 14px; font-weight: 600; }
.timeline .tl-body { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

/* 进度条 */
.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--brand-2), var(--brand)); transition: width .4s ease; }
.progress.ai > i { background: linear-gradient(90deg, var(--ai-2), var(--ai)); }

/* 空态 */
.empty { text-align: center; padding: 36px 20px; color: var(--ink-3); }
.empty > .ico { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; color: var(--ink-4); }
.empty .t { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.empty .s { font-size: 13px; margin-top: 4px; }

/* 表单 */
.form-item { padding: 12px 14px; background: var(--surface); display: flex; align-items: center; gap: 12px; }
.form-item + .form-item { border-top: .5px solid var(--line); }
.form-item label { width: 84px; flex: none; font-size: 14px; color: var(--ink-2); }
.form-item .fv { flex: 1; min-width: 0; font-size: 15px; }
.form-item .fv input, .form-item .fv textarea { width: 100%; border: 0; outline: 0; background: transparent; font-size: 15px; }
.form-item .fv textarea { resize: none; min-height: 60px; line-height: 1.5; }
.form-item .fv .placeholder { color: var(--ink-4); }
.form-item.required label::before { content: "*"; color: var(--danger); margin-right: 2px; }
.form-item.missing { background: #fffaf0; }
.form-item.missing label { color: #b45309; }
.textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; min-height: 92px; resize: none; outline: 0; background: var(--surface); font-size: 14px; line-height: 1.5; }
.textarea:focus { border-color: var(--brand); }

/* 键值 */
.kv { display: grid; grid-template-columns: 86px 1fr; gap: 8px 10px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { color: var(--ink); min-width: 0; }

/* 照片格 */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-3); display: flex; align-items: center; justify-content: center; }
.photo.wide { aspect-ratio: 4 / 3; }
.photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 10.5px; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, .6)); }
.photo .mark { position: absolute; top: 6px; left: 6px; }
.photo.add { border: 1.5px dashed var(--line-2); color: var(--ink-3); flex-direction: column; gap: 4px; font-size: 12px; background: var(--surface); }
.photo svg.scene { width: 100%; height: 100%; }

/* 大按钮入口（宫格） */
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; background: var(--surface); border: 1px solid rgba(17, 24, 39, .04); font-size: 12px; color: var(--ink-2); font-weight: 500; }
.quick .qi { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.quick .qi.brand { background: var(--brand-soft); color: var(--brand); }
.quick .qi.ai { background: var(--ai-soft); color: var(--ai); }
.quick .qi.warn { background: var(--warn-soft); color: var(--warn); }
.quick .qi.info { background: var(--info-soft); color: var(--info); }
.quick .qi.danger { background: var(--danger-soft); color: var(--danger); }
.quick .qi.violet { background: var(--violet-soft); color: var(--violet); }
.quick:active { background: var(--surface-2); }

/* 头部大卡（渐变） */
.hero {
  border-radius: 20px; padding: 16px 16px 14px; color: #fff; margin-bottom: 12px;
  background: linear-gradient(135deg, #16355f 0%, #0f2444 60%, #0b1a33 100%);
  box-shadow: 0 10px 24px rgba(15, 36, 68, .28);
  position: relative; overflow: hidden;
}
.hero::after { content: ""; position: absolute; right: -40px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255, 255, 255, .08); }
.hero .h-eyebrow { font-size: 11px; opacity: .8; letter-spacing: .08em; font-weight: 600; }
.hero .h-title { font-size: 20px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
.hero .h-sub { font-size: 13px; opacity: .85; margin-top: 4px; }
.hero .h-metrics { display: flex; gap: 18px; margin-top: 12px; }
.hero .h-metrics .m .v { font-size: 22px; font-weight: 700; line-height: 1; }
.hero .h-metrics .m .l { font-size: 11px; opacity: .8; margin-top: 4px; }
.hero.ai { background: linear-gradient(135deg, #1596ad 0%, #0b7d93 60%, #085f70 100%); box-shadow: 0 10px 24px rgba(11, 125, 147, .25); }
.hero.dark { background: linear-gradient(135deg, #1f2937, #111827); box-shadow: 0 10px 24px rgba(17, 24, 39, .3); }

/* 简单条形图 */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.bar-row .bl { width: 64px; color: var(--ink-2); flex: none; text-align: right; }
.bar-row .bt { flex: 1; height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.bar-row .bt > i { display: block; height: 100%; border-radius: 5px; background: var(--brand); }
.bar-row .bt > i.ai { background: var(--ai); } .bar-row .bt > i.warn { background: var(--warn); } .bar-row .bt > i.info { background: var(--info); }
.bar-row .bv { width: 40px; flex: none; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* 聊天气泡 */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg.me { flex-direction: row-reverse; }
.msg .bubble { max-width: 82%; padding: 10px 12px; border-radius: 16px; font-size: 14px; line-height: 1.5; background: var(--surface); border: 1px solid rgba(17, 24, 39, .04); }
.msg.me .bubble { background: var(--brand); color: #fff; border-color: transparent; border-top-right-radius: 6px; }
.msg:not(.me) .bubble { border-top-left-radius: 6px; }
.msg .bubble .src { margin-top: 8px; padding-top: 8px; border-top: .5px solid var(--line-2); font-size: 12px; color: var(--ink-3); }
.msg .bubble .src b { color: var(--ink-2); }
.chat-input { display: flex; align-items: center; gap: 8px; }
.chat-input .in { flex: 1; height: 40px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line-2); padding: 0 14px; display: flex; align-items: center; color: var(--ink-4); font-size: 14px; }
.chat-input .ib { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--brand); color: #fff; flex: none; }
.chat-input .ib.ghost { background: var(--surface); border: 1px solid var(--line-2); color: var(--ink-2); }
.suggest { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
.suggest button { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); }

/* 录音波形 */
.wave { display: flex; align-items: center; gap: 3px; height: 40px; }
.wave i { width: 3px; border-radius: 2px; background: var(--brand); animation: wave 1s ease-in-out infinite; }
.wave i:nth-child(2n) { animation-delay: .15s } .wave i:nth-child(3n) { animation-delay: .3s } .wave i:nth-child(5n) { animation-delay: .45s }
@keyframes wave { 0%, 100% { height: 8px } 50% { height: 32px } }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .4) } 60% { box-shadow: 0 0 0 16px rgba(220, 38, 38, 0) } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

/* 骨架 */
.skeleton { background: linear-gradient(90deg, var(--surface-3) 25%, #f9fafb 50%, var(--surface-3) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

/* 表格（小） */
.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th, .table td { padding: 8px 6px; text-align: left; border-bottom: .5px solid var(--line); }
.table th { color: var(--ink-3); font-weight: 600; font-size: 11.5px; }
.table td.r, .table th.r { text-align: right; font-variant-numeric: tabular-nums; }
.table tr:last-child td { border-bottom: 0; }

/* P1 预览水印 */
.p1-banner { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #fff7ed; color: #9a3412; font-size: 12px; margin-bottom: 12px; border: 1px dashed #fdba74; }

/* ============================================================
   浮层：Toast / ActionSheet / Modal
   ============================================================ */
#overlay { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
.toast {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
  background: rgba(17, 24, 39, .92); color: #fff; padding: 14px 18px; border-radius: 14px;
  font-size: 14px; text-align: center; min-width: 130px; max-width: 260px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  animation: fadeIn .15s ease; pointer-events: none;
}
.toast.bottom { top: auto; bottom: 110px; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; flex-direction: row; }
.mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); pointer-events: auto; animation: fadeIn .18s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface);
  border-radius: 22px 22px 0 0; padding: 8px 0 30px; pointer-events: auto;
  animation: slideUp .26s cubic-bezier(.2, .8, .2, 1); max-height: 78%; display: flex; flex-direction: column;
}
.sheet .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 4px auto 8px; }
.sheet .sheet-title { text-align: center; font-size: 13px; color: var(--ink-3); padding: 6px 16px 10px; }
.sheet .sheet-body { overflow-y: auto; padding: 0 14px; }
.sheet .sheet-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-size: 16px; border-top: .5px solid var(--line); }
.sheet .sheet-item .si-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.sheet .sheet-item.danger { color: var(--danger); }
.sheet .sheet-item:active { background: var(--surface-2); }
.sheet .sheet-cancel { margin: 8px 14px 0; height: 48px; border-radius: 14px; background: var(--surface-3); font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.modal {
  position: absolute; left: 30px; right: 30px; top: 50%; transform: translateY(-50%);
  background: var(--surface); border-radius: 18px; padding: 22px 20px 16px; pointer-events: auto;
  animation: popIn .2s cubic-bezier(.2, .8, .2, 1);
}
.modal .m-title { font-size: 17px; font-weight: 700; text-align: center; }
.modal .m-body { font-size: 14px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
.modal .m-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal .m-actions .btn { flex: 1; }
@keyframes popIn { from { opacity: 0; transform: translateY(-50%) scale(.94) } to { opacity: 1; transform: translateY(-50%) scale(1) } }

/* ============================================================
   演示导览面板（左侧）
   ============================================================ */
.presenter {
  background: #0b1220; color: #e2e8f0; display: flex; flex-direction: column;
  border-right: 1px solid rgba(255, 255, 255, .06); overflow: hidden;
}
.presenter .p-head { padding: 22px 20px 14px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.presenter .p-brand { display: flex; align-items: center; gap: 10px; }
.presenter .p-brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #5b8deb, #1e5bd8); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; letter-spacing: -.02em; }
.presenter .p-brand .t { font-weight: 700; font-size: 15px; }
.presenter .p-brand .s { font-size: 11.5px; color: #94a3b8; margin-top: 1px; }
.presenter .p-scroll { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
.presenter .p-sec { margin-bottom: 20px; }
.presenter .p-sec h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #64748b; margin-bottom: 8px; font-weight: 700; }
.presenter .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.presenter .role { padding: 8px 6px; border-radius: 10px; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .06); text-align: center; font-size: 12px; color: #cbd5e1; }
.presenter .role .r-av { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
.presenter .role.active { background: rgba(30, 91, 216, .22); border-color: rgba(91, 141, 235, .7); color: #fff; }
.presenter .steps { display: flex; flex-direction: column; gap: 4px; }
.presenter .step-item { display: flex; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 13px; color: #cbd5e1; cursor: pointer; align-items: flex-start; border: 1px solid transparent; }
.presenter .step-item:hover { background: rgba(255, 255, 255, .05); }
.presenter .step-item.active { background: rgba(30, 91, 216, .18); border-color: rgba(91, 141, 235, .5); color: #fff; }
.presenter .step-item .n { width: 20px; height: 20px; border-radius: 6px; background: rgba(255, 255, 255, .08); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; color: #94a3b8; }
.presenter .step-item.active .n { background: #1e5bd8; color: #fff; }
.presenter .step-item .sub { font-size: 11px; color: #64748b; margin-top: 1px; }
.presenter .prd-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.presenter .prd-chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, .08); }
.presenter .prd-chip.rule { background: rgba(11, 125, 147, .25); color: #9fdfec; border-color: rgba(11, 125, 147, .5); }
.presenter .p-actions { display: flex; flex-direction: column; gap: 6px; }
.presenter .p-btn { height: 34px; border-radius: 9px; background: rgba(255, 255, 255, .06); color: #e2e8f0; font-size: 12.5px; font-weight: 600; border: 1px solid rgba(255, 255, 255, .08); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.presenter .p-btn:hover { background: rgba(255, 255, 255, .1); }
.presenter .p-btn.danger { color: #fca5a5; }
.presenter .p-foot { padding: 12px 16px; border-top: 1px solid rgba(255, 255, 255, .06); font-size: 11px; color: #64748b; line-height: 1.5; }
.presenter .cur-screen { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 6px; }
.presenter .cur-screen small { color: #64748b; font-weight: 500; margin-left: 6px; }

.presenter-toggle {
  display: none; position: fixed; left: 12px; top: 12px; z-index: 200;
  width: 40px; height: 40px; border-radius: 12px; background: #0b1220; color: #fff; align-items: center; justify-content: center; box-shadow: var(--shadow-lg);
}

/* ============================================================
   响应式：小屏 → 手机全屏
   ============================================================ */
@media (max-width: 1023px) {
  .app { grid-template-columns: 1fr; }
  .presenter { position: fixed; inset: 0; z-index: 190; width: 320px; transform: translateX(-100%); transition: transform .25s ease; }
  .presenter.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .presenter-toggle { display: flex; }
}
@media (max-height: 900px) and (min-width: 1024px) {
  .phone { transform: scale(.92); }
}
@media (max-height: 820px) and (min-width: 1024px) {
  .phone { transform: scale(.84); }
}
@media (max-width: 480px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; }
  .stage-wrap { align-items: stretch; background: var(--bg); }
  .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; transform: none; }
  .phone::before, .phone::after, .island, .home-indicator, .stage-caption { display: none; }
  .phone-screen { border-radius: 0; }
  .statusbar { height: env(safe-area-inset-top, 20px); padding: 0; }
  .statusbar > * { display: none; }
  .tabbar { height: calc(56px + env(safe-area-inset-bottom, 12px)); }
}

/* ============================================================
   阶段进度条（录音 → 结构化 → 确认 → 归档）
   ============================================================ */
.phasebar { display: flex; gap: 6px; margin: 2px 0 12px; }
.phasebar .ph { flex: 1; }
.phasebar .ph i { display: block; height: 6px; border-radius: 3px; background: var(--line-2); }
.phasebar .ph.on i { background: var(--brand); }
.phasebar .ph span { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-3); }
.phasebar .ph.on span { color: var(--brand); font-weight: 600; }
/* 大入口卡（首页三入口） */
.entry-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.entry { background: var(--surface); border-radius: 16px; padding: 14px 8px 12px; text-align: center; box-shadow: var(--shadow-xs); border: 1px solid rgba(17, 24, 39, .04); }
.entry .ei { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; color: #fff; background: var(--brand); }
.entry .ei.em { background: var(--ai); } .entry .ei.navy { background: #0f2444; } .entry .ei.amber { background: var(--warn); }
.entry .et { font-size: 15px; font-weight: 700; } .entry .es { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.entry:active { transform: scale(.98); }
/* 橙色提示条（已打点未留痕） */
.amber-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; margin-bottom: 12px; border-left: 4px solid var(--warn); }
.amber-bar .pill { background: var(--warn); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
/* 字段行（置信度 + 原文定位） */
.field-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; background: var(--surface); }
.field-row + .field-row { border-top: .5px solid var(--line); }
.field-row .fl { font-size: 13px; color: var(--ink-2); }
.field-row .fv { font-size: 14.5px; min-width: 0; }
.field-row .fv.auto { color: var(--ink-3); }
.field-row .fv.missing { color: var(--warn); font-weight: 600; }
.field-row .src { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.field-row .src .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.field-row .src .dot.auto { background: var(--ink-4); } .field-row .src .dot.manual { background: var(--ok); }

  App.icon = function (name, size = 20, cls = '') {
    const d = ICONS[name] || ICONS.info;
    return `<svg class="ico ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  };

  /* ----------------------------------------------------------
     工具
     ---------------------------------------------------------- */
  App.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  App.uid = (p = 'id') => p + '_' + (++App._seq) + '_' + Math.random().toString(36).slice(2, 6);
  App.clone = (o) => JSON.parse(JSON.stringify(o));
  App.by = (arr, key, val) => (arr || []).find((x) => x[key] === val);
  App.q = (sel, root) => (root || document).querySelector(sel);
  App.qa = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  // 页面级样式注入（每个 id 只注入一次），供各页面文件自带专属样式，避免多处修改 app.css
  App.css = function (id, text) {
    const key = 'css-' + id;
    if (document.getElementById(key)) return;
    const st = document.createElement('style'); st.id = key; st.textContent = text;
    document.head.appendChild(st);
  };

  // 固定演示日期：2026-09-07（周一）
  App.TODAY = '2026-09-07';
  App.dayjs = function (s) { return new Date(s + (s.length === 10 ? 'T00:00:00' : '')); };
  App.fmt = {
    md(s) { if (!s) return ''; const d = App.dayjs(s); return `${d.getMonth() + 1}月${d.getDate()}日`; },
    mdw(s) { if (!s) return ''; const d = App.dayjs(s); return `${d.getMonth() + 1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`; },
    ymd(s) { return s ? s.slice(0, 10) : ''; },
    hm(s) { return s && s.length >= 16 ? s.slice(11, 16) : ''; },
    days(s) { if (!s) return null; return Math.round((App.dayjs(s.slice(0, 10)) - App.dayjs(App.TODAY)) / 86400000); },
    rel(s) {
      const n = App.fmt.days(s);
      if (n === null) return '';
      if (n === 0) return '今天'; if (n === 1) return '明天'; if (n === -1) return '昨天';
      if (n < 0) return `${-n}天前`; return `${n}天后`;
    },
    dueLabel(s) {
      const n = App.fmt.days(s);
      if (n === null) return '';
      if (n < 0) return `逾期${-n}天`; if (n === 0) return '今天到期'; if (n === 1) return '明天到期'; return `${App.fmt.md(s)} 到期`;
    },
    money(n) { if (n == null) return '—'; return '¥' + Number(n).toLocaleString('zh-CN'); },
    pct(n) { return n == null ? '—' : Math.round(n * 100) + '%'; },
  };
  App.initials = (name) => (name || '?').replace(/[（(].*$/, '').slice(0, 1);

  /* ----------------------------------------------------------
     状态
     ---------------------------------------------------------- */
  const LS_KEY = 'lbs-demo-state-v1';
  App.freshState = () => App.clone(window.DATA.initial());
  App.load = function () {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const s = JSON.parse(raw); if (s && s.version === window.DATA.VERSION) return s; }
    } catch (e) { /* ignore */ }
    return App.freshState();
  };
  App.save = function () { try { localStorage.setItem(LS_KEY, JSON.stringify(App.state)); } catch (e) { /* ignore */ } };
  App.reset = function (silent) {
    App.state = App.freshState();
    App.save();
    App.tab('home');
    if (!silent) App.toast('演示数据已重置', { icon: 'refresh' });
  };
  App.me = () => App.state.users[App.state.role];
  App.isMgr = () => App.state.role === 'mgr';
  App.setRole = function (role) {
    if (!App.state.users[role]) return;
    App.state.role = role;
    App.save();
    App.tab('home');
    App.toast(`已切换为 ${App.me().name} · ${App.me().roleName}`, { icon: 'user' });
  };
  // 便捷取数
  App.store = (id) => App.by(App.state.stores, 'id', id);
  App.opp = (id) => App.by(App.state.opportunities, 'id', id);
  App.task = (id) => App.by(App.state.tasks, 'id', id);
  App.visit = (id) => App.by(App.state.visits, 'id', id);
  App.proposal = (id) => App.by(App.state.proposals, 'id', id);
  App.oppsOf = (storeId) => App.state.opportunities.filter((o) => o.storeId === storeId);
  App.visitsOf = (storeId) => App.state.visits.filter((v) => v.storeId === storeId).sort((a, b) => (a.time < b.time ? 1 : -1));
  App.tasksOf = (storeId) => App.state.tasks.filter((t) => t.storeId === storeId);
  App.primaryOpp = (storeId) => { const s = App.store(storeId); return App.opp(s && s.primaryOppId) || App.oppsOf(storeId)[0] || null; };
  // 四象限分层（贵司现有分层标准；阈值为演示值）：A 主攻 / B 培育 / C 维护 / D 观察 / 待判定
  App.TIERS = { A: { label: 'A · 主攻', tone: 'brand', cycle: 7 }, B: { label: 'B · 培育', tone: 'ai', cycle: 14 }, C: { label: 'C · 维护', tone: 'ok', cycle: 30 }, D: { label: 'D · 观察', tone: 'gray', cycle: 60 }, pending: { label: '待判定', tone: 'outline', cycle: null } };
  App.tierLabel = (t) => (App.TIERS[t] || App.TIERS.pending).label;
  App.tierTone = (t) => (App.TIERS[t] || App.TIERS.pending).tone;
  App.tierCycle = (t) => (App.TIERS[t] || App.TIERS.pending).cycle;

  /* ----------------------------------------------------------
     浮层：toast / sheet / modal
     ---------------------------------------------------------- */
  let toastTimer = null;
  App.toast = function (msg, opts = {}) {
    const ov = App.q('#overlay');
    App.qa('.toast', ov).forEach((n) => n.remove());
    const el = document.createElement('div');
    el.className = 'toast' + (opts.bottom ? ' bottom' : '');
    el.innerHTML = (opts.icon ? App.icon(opts.icon, opts.bottom ? 16 : 28) : '') + `<span>${App.esc(msg)}</span>`;
    ov.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), opts.duration || 1600);
  };
  App.loading = function (msg = '处理中…') {
    const ov = App.q('#overlay');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `${App.icon('refresh', 28, 'spin')}<span>${App.esc(msg)}</span>`;
    ov.appendChild(el);
    return () => el.remove();
  };
  App.closeOverlay = function () {
    const ov = App.q('#overlay');
    App.qa('.mask, .sheet, .modal', ov).forEach((n) => n.remove());
  };
  App.sheet = function ({ title, items = [], cancel = '取消' }) {
    App.closeOverlay();
    const ov = App.q('#overlay');
    const mask = document.createElement('div'); mask.className = 'mask'; mask.onclick = App.closeOverlay;
    const sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = `<div class="sheet-handle"></div>${title ? `<div class="sheet-title">${App.esc(title)}</div>` : ''}<div class="sheet-body">${items.map((it, i) => `<div class="sheet-item ${it.danger ? 'danger' : ''}" data-i="${i}">${it.icon ? App.icon(it.icon, 20) : ''}<div class="grow"><div>${App.esc(it.label)}</div>${it.sub ? `<div class="si-sub">${App.esc(it.sub)}</div>` : ''}</div>${it.right ? `<div class="muted small">${App.esc(it.right)}</div>` : ''}</div>`).join('')}</div><div class="sheet-cancel">${App.esc(cancel)}</div>`;
    sh.querySelector('.sheet-cancel').onclick = App.closeOverlay;
    App.qa('.sheet-item', sh).forEach((n) => { n.onclick = () => { App.closeOverlay(); const it = items[+n.dataset.i]; it.onSelect && it.onSelect(); }; });
    ov.appendChild(mask); ov.appendChild(sh);
  };
  App.modal = function ({ title, body, actions }) {
    App.closeOverlay();
    const ov = App.q('#overlay');
    const mask = document.createElement('div'); mask.className = 'mask';
    const m = document.createElement('div'); m.className = 'modal';
    const acts = actions || [{ label: '知道了', tone: 'primary' }];
    m.innerHTML = `<div class="m-title">${App.esc(title)}</div><div class="m-body">${body || ''}</div><div class="m-actions">${acts.map((a, i) => `<button class="btn ${a.tone || 'ghost'}" data-i="${i}">${App.esc(a.label)}</button>`).join('')}</div>`;
    App.qa('button', m).forEach((b) => { b.onclick = () => { App.closeOverlay(); const a = acts[+b.dataset.i]; a.onClick && a.onClick(); }; });
    ov.appendChild(mask); ov.appendChild(m);
  };
  App.confirm = (title, body, onOk, okLabel = '确认') => App.modal({ title, body, actions: [{ label: '取消', tone: 'ghost' }, { label: okLabel, tone: 'primary', onClick: onOk }] });
  App.prompt = function (title, placeholder, onOk, okLabel = '确定') {
    App.modal({
      title, body: `<textarea class="textarea" id="promptInput" placeholder="${App.esc(placeholder || '')}"></textarea>`,
      actions: [{ label: '取消', tone: 'ghost' }, { label: okLabel, tone: 'primary', onClick: () => onOk(App._promptVal || '') }],
    });
    const ta = App.q('#promptInput'); App._promptVal = '';
    if (ta) { ta.oninput = () => { App._promptVal = ta.value; }; setTimeout(() => ta.focus(), 50); }
  };

  /* ----------------------------------------------------------
     UI 片段（返回 HTML 字符串）
     ---------------------------------------------------------- */
  const ui = App.ui = {};
  ui.chip = (text, tone = 'gray', opts = {}) => `<span class="chip ${tone} ${opts.sm ? 'sm' : ''} ${opts.dot ? 'dot' : ''} ${opts.cls || ''}">${opts.icon ? App.icon(opts.icon, 12) : ''}${App.esc(text)}</span>`;
  ui.section = (title, right = '', eyebrow = '') => `<div class="section"><div>${eyebrow ? `<div class="eyebrow">${App.esc(eyebrow)}</div>` : ''}<h3>${App.esc(title)}</h3></div>${right ? `<div class="more">${right}</div>` : ''}</div>`;
  ui.cell = ({ title, sub, right, icon, iconTone = '', onclick, arrow = true, cls = '', badge }) => `<div class="cell ${onclick ? 'pressable' : ''} ${cls}" ${onclick ? `onclick="${onclick}"` : ''}>${icon ? `<div class="cell-icon ${iconTone}">${App.icon(icon, 20)}</div>` : ''}<div class="cell-body"><div class="cell-title row"><span class="ellipsis">${title}</span>${badge || ''}</div>${sub ? `<div class="cell-sub">${sub}</div>` : ''}</div><div class="cell-right">${right || ''}${arrow && onclick ? App.icon('chevron-right', 16) : ''}</div></div>`;
  ui.empty = ({ icon = 'inbox', title, sub, action }) => `<div class="empty"><div class="ico">${App.icon(icon, 30)}</div><div class="t">${App.esc(title)}</div>${sub ? `<div class="s">${App.esc(sub)}</div>` : ''}${action ? `<div class="mt12">${action}</div>` : ''}</div>`;
  ui.kpis = (items, four) => `<div class="kpis ${four ? 'four' : ''}">${items.map((k) => `<div class="kpi ${k.tone || ''}" ${k.onclick ? `onclick="${k.onclick}" style="cursor:pointer"` : ''}><div class="v">${k.value}</div><div class="l">${App.esc(k.label)}</div>${k.sub ? `<div class="s muted">${k.sub}</div>` : ''}</div>`).join('')}</div>`;
  ui.avatar = (name, cls = '') => `<div class="avatar ${cls}">${App.esc(App.initials(name))}</div>`;
  ui.stepper = (steps, current, opts = {}) => `<div class="stepper">${steps.map((s, i) => `<div class="step ${i < current ? 'done' : ''} ${i === current ? (opts.error ? 'error' : 'current') : ''}">${App.esc(s)}</div>`).join('')}</div>`;
  ui.progress = (pct, ai) => `<div class="progress ${ai ? 'ai' : ''}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
  ui.notice = (tone, text, icon) => `<div class="notice ${tone}">${App.icon(icon || ({ warn: 'alert', danger: 'alert', info: 'info', ok: 'check-circle', ai: 'sparkle', gray: 'info' }[tone] || 'info'), 16)}<div>${text}</div></div>`;
  ui.aiCard = ({ title = 'AI 建议', meta = '派生数据 · 不改正式值', body, note }) => `<div class="ai-card"><div class="ai-head"><div class="ai-logo">${App.icon('sparkle', 15)}</div><div class="grow"><div class="t">${App.esc(title)}</div><div class="m">${App.esc(meta)}</div></div></div><div class="ai-body">${body}</div>${note ? `<div class="ai-note">${App.icon('info', 12)}${note}</div>` : ''}</div>`;
  ui.factTag = (kind) => ({ fact: '<span class="fact-tag fact">已确认事实</span>', derived: '<span class="fact-tag derived">AI 派生</span>', pending: '<span class="fact-tag pending">待核实</span>', official: '<span class="fact-tag official">正式值</span>' }[kind] || '');
  ui.btn = (label, { tone = 'primary', onclick = '', block = false, size = '', icon = '', disabled = false, cls = '' } = {}) => `<button class="btn ${tone} ${block ? 'block' : ''} ${size} ${cls}" ${disabled ? 'disabled' : ''} ${onclick ? `onclick="${onclick}"` : ''}>${icon ? App.icon(icon, 18) : ''}${App.esc(label)}</button>`;
  ui.kv = (pairs) => `<dl class="kv">${pairs.map(([k, v]) => `<dt>${App.esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;
  ui.bars = (rows, tone = '') => { const max = Math.max(1, ...rows.map((r) => r.value)); return `<div class="bars">${rows.map((r) => `<div class="bar-row"><div class="bl ellipsis">${App.esc(r.label)}</div><div class="bt"><i class="${r.tone || tone}" style="width:${Math.round((r.value / max) * 100)}%"></i></div><div class="bv">${r.display != null ? r.display : r.value}</div></div>`).join('')}</div>`; };
  ui.timeline = (items) => `<div class="timeline">${items.map((it) => `<div class="tl-item ${it.tone || ''}"><div class="tl-time">${App.esc(it.time)}${it.tag ? ` · ${it.tag}` : ''}</div><div class="tl-title">${it.title}</div>${it.body ? `<div class="tl-body">${it.body}</div>` : ''}</div>`).join('')}</div>`;
  ui.p1Banner = (text = '包 B / P1 预览 · 依赖报价规则、合同模板与审批接口，首期不承诺') => `<div class="p1-banner">${App.icon('flag', 14)}<span>${App.esc(text)}</span></div>`;
  // 状态芯片：合作状态 / 客诉 / 商机阶段
  ui.coopChip = (s) => ({ active: ui.chip('服务中', 'brand', { dot: true }), paused: ui.chip('停做', 'danger', { dot: true }), none: ui.chip('未合作', 'gray', { dot: true }) }[s] || '');
  ui.complaintChip = (c) => {
    if (!c) return '';
    if (c.status === 'open') return ui.chip('未结客诉', 'danger', { icon: 'alert' });
    if (c.status === 'not_connected') return ui.chip('客诉未接入', 'gray', { icon: 'cloud-off' });
    if (c.status === 'stale') return ui.chip('数据待更新', 'warn', { icon: 'clock' });
    if (c.status === 'closed') return ui.chip('客诉已结', 'gray');
    return '';
  };
  ui.stageChip = (stage) => ui.chip(stage, ({ 线索: 'gray', 意向: 'info', 方案: 'warn', 报价: 'warn', 审批中: 'warn', 待签约: 'brand', 已成交: 'ok', 已流失: 'danger', 待触达: 'gray', 已触达: 'info', 需求确认: 'info', 方案沟通: 'warn', 报价商务: 'warn', 已赢单: 'ok', 已丢单: 'danger', 暂停培育: 'gray' }[stage] || 'gray'));
  // 留痕状态：done 已留痕 / running 进行中 / pending 已打点未留痕 / todo 未去
  ui.traceChip = (st, opts) => ui.chip(({ done: '已留痕', running: '进行中', pending: '未留痕', todo: '未去', draft: '草稿' }[st] || st), ({ done: 'ok', running: 'info', pending: 'warn', todo: 'gray', draft: 'gray' }[st] || 'gray'), opts);
  // 评分环（0–100，门槛）
  ui.scoreRing = (score, threshold = 60, size = 92) => { const r = (size - 10) / 2, c = 2 * Math.PI * r, pct = Math.max(0, Math.min(100, score)) / 100, col = score >= threshold ? 'var(--ok)' : 'var(--warn)'; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="9"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-size="${size * .3}" font-weight="700" fill="${col}">${score}</text></svg>`; };
  // 阶段进度条（录音 → 结构化 → 确认 → 归档）
  ui.phaseBar = (labels, current) => `<div class="phasebar">${labels.map((l, i) => `<div class="ph ${i <= current ? 'on' : ''}"><i></i><span>${App.esc(l)}</span></div>`).join('')}</div>`;
  ui.tierChip = (t, opts) => ui.chip(App.tierLabel(t), App.tierTone(t), opts);
  ui.taskStatusChip = (st) => ui.chip(({ todo: '待办', doing: '进行中', done: '已完成', rescheduled: '已改期', cancelled: '已取消' }[st] || st), ({ todo: 'info', doing: 'warn', done: 'ok', rescheduled: 'gray', cancelled: 'gray' }[st] || 'gray'));
  ui.visitStatusChip = (st, opts) => ui.chip(({ draft: '本地草稿', uploading: '上传中', ai: 'AI处理中', pending_confirm: '待确认', saved: '已保存/待同步', synced: '同步成功', failed: '同步失败' }[st] || st), ({ draft: 'gray', uploading: 'info', ai: 'ai', pending_confirm: 'warn', saved: 'info', synced: 'ok', failed: 'danger' }[st] || 'gray'), opts);
  // 简单 SVG 场景（门头 / 后厨），用于照片占位
  ui.scene = (kind = 'storefront', label = '') => {
    const scenes = {
      storefront: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs><rect width="160" height="120" fill="url(#sk)"/><rect x="0" y="86" width="160" height="34" fill="#cbd5e1"/><rect x="14" y="30" width="132" height="60" fill="#f8fafc" stroke="#94a3b8"/><rect x="14" y="30" width="132" height="16" fill="#b91c1c"/><rect x="40" y="35" width="80" height="6" rx="2" fill="#fee2e2"/><rect x="24" y="52" width="36" height="34" fill="#93c5fd"/><rect x="66" y="52" width="28" height="34" fill="#7f1d1d"/><rect x="100" y="52" width="36" height="34" fill="#93c5fd"/><rect x="18" y="46" width="124" height="4" fill="#ef4444"/><circle cx="130" cy="18" r="8" fill="#fde68a"/></svg>`,
      kitchen: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#e7e5e4"/><rect x="0" y="70" width="160" height="50" fill="#a8a29e"/><rect x="10" y="40" width="60" height="34" fill="#d6d3d1" stroke="#78716c"/><rect x="80" y="30" width="70" height="44" fill="#e5e7eb" stroke="#9ca3af"/><rect x="88" y="36" width="54" height="8" fill="#9ca3af"/><rect x="0" y="0" width="160" height="14" fill="#57534e"/><circle cx="34" cy="92" r="5" fill="#44403c"/><path d="M28 96 q6 -6 12 0" stroke="#292524" stroke-width="2" fill="none"/><rect x="118" y="82" width="22" height="24" fill="#78716c"/></svg>`,
      corner: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#d6d3d1"/><path d="M0 0 L80 40 L80 120 L0 120z" fill="#a8a29e"/><path d="M160 0 L80 40 L80 120 L160 120z" fill="#c7c2bd"/><rect x="62" y="84" width="36" height="20" fill="#57534e"/><circle cx="70" cy="110" r="3" fill="#292524"/><circle cx="78" cy="113" r="2" fill="#292524"/><circle cx="86" cy="110" r="2.5" fill="#292524"/></svg>`,
      pest: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#f5f5f4"/><rect x="0" y="80" width="160" height="40" fill="#e7e5e4"/><ellipse cx="80" cy="66" rx="22" ry="12" fill="#3f3f46"/><circle cx="102" cy="62" r="7" fill="#3f3f46"/><path d="M58 66 q-20 8 -34 4" stroke="#3f3f46" stroke-width="2" fill="none"/><path d="M70 76 l-4 8 M90 76 l4 8 M76 56 l-3 -8 M86 56 l3 -8" stroke="#3f3f46" stroke-width="2"/></svg>`,
      pest2: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#fafaf9"/><rect x="0" y="0" width="160" height="120" fill="#e7e5e4" opacity=".5"/><ellipse cx="80" cy="62" rx="9" ry="16" fill="#7c2d12"/><ellipse cx="80" cy="46" rx="6" ry="6" fill="#7c2d12"/><path d="M71 56 l-14 -6 M71 64 l-16 2 M71 72 l-12 8 M89 56 l14 -6 M89 64 l16 2 M89 72 l12 8" stroke="#7c2d12" stroke-width="2"/><path d="M76 40 l-6 -12 M84 40 l6 -12" stroke="#7c2d12" stroke-width="1.5"/></svg>`,
      blur: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><defs><filter id="bl"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="160" height="120" fill="#e5e7eb"/><g filter="url(#bl)"><rect x="20" y="30" width="60" height="50" fill="#9ca3af"/><circle cx="110" cy="60" r="24" fill="#6b7280"/></g></svg>`,
      doc: `<svg class="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="#f1f5f9"/><rect x="30" y="10" width="100" height="120" fill="#fff" stroke="#cbd5e1"/><rect x="42" y="22" width="60" height="6" fill="#0e8f6e"/><rect x="42" y="36" width="76" height="3" fill="#cbd5e1"/><rect x="42" y="44" width="70" height="3" fill="#cbd5e1"/><rect x="42" y="52" width="76" height="3" fill="#cbd5e1"/><rect x="42" y="64" width="34" height="24" fill="#dbeafe"/><rect x="82" y="64" width="34" height="24" fill="#e7e5e4"/><rect x="42" y="96" width="76" height="3" fill="#cbd5e1"/></svg>`,
    };
    return `<div class="photo ${label ? '' : ''}">${scenes[kind] || scenes.storefront}${label ? `<div class="cap">${App.esc(label)}</div>` : ''}</div>`;
  };

  /* ----------------------------------------------------------
     导航
     ---------------------------------------------------------- */
  App.register = function (id, def) { App.screens[id] = Object.assign({ id }, def); };
  App.currentEntry = () => App.stack[App.stack.length - 1];
  App.currentTab = () => (App.stack[0] ? App.stack[0].id : 'home');

  function navbarHtml(entry, def, ctx) {
    const nav = (typeof def.nav === 'function' ? def.nav(entry.params, ctx) : def.nav) || {};
    const title = nav.title != null ? nav.title : (def.title || '');
    const showBack = App.stack.length > 1;
    const left = showBack
      ? `<button onclick="App.back()" aria-label="返回">${App.icon('chevron-left', 24)}</button>${nav.left || ''}`
      : (nav.left || '');
    return `<div class="navbar ${nav.solid ? 'solid' : ''}"><div class="nav-left">${left}</div><div class="nav-title">${App.esc(title)}</div><div class="capsule"><span>${App.icon('more', 18)}</span><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>`;
  }
  function tabbarHtml(active) {
    const badges = (window.DATA.tabBadges && window.DATA.tabBadges(App.state)) || {};
    return `<div class="demo-note"><span>演示数据</span><span>不代表真实客户</span></div><div class="tabbar">${TABS.map((t) => `<div class="tab ${t.center ? 'center' : ''} ${t.id === active ? 'active' : ''}" onclick="App.tab('${t.id}')"><div class="tab-ico">${t.glyph}</div><span>${t.label}</span>${badges[t.id] ? `<span class="badge">${badges[t.id]}</span>` : ''}</div>`).join('')}</div>`;
  }
  App.renderEntry = function (entry) {
    const def = App.screens[entry.id];
    const ctx = { params: entry.params, state: App.state, entry };
    let body = '';
    try { body = def.render(entry.params, ctx) || ''; } catch (e) { console.error(e); body = `<div class="notice danger">页面渲染失败：${App.esc(e.message)}</div>`; }
    const isTabRoot = TAB_ROOTS.includes(entry.id);
    const footer = typeof def.footer === 'function' ? (def.footer(entry.params, ctx) || '') : '';
    entry.el.innerHTML = `${navbarHtml(entry, def, ctx)}<div class="content ${isTabRoot ? 'has-tab' : ''} ${def.flush ? 'flush' : ''}">${body}</div>${footer ? `<div class="footer-bar">${footer}</div>` : ''}${isTabRoot ? tabbarHtml(entry.id) : ''}`;
    try { def.mount && def.mount(entry.el, entry.params, ctx); } catch (e) { console.error(e); }
  };
  App._mount = function (entry, anim) {
    const stage = App.q('#stage');
    const el = document.createElement('div');
    el.className = 'screen';
    el.dataset.key = entry.key;
    entry.el = el;
    stage.appendChild(el); // 先入 DOM 再渲染，保证 mount 内可读取布局
    App.renderEntry(entry);
    const prev = App.stack[App.stack.length - 2];
    if (anim === 'push' && prev) {
      el.classList.add('enter');
      // 强制回流后启动过渡
      void el.offsetWidth;
      el.classList.add('enter-active');
      setTimeout(() => { el.classList.remove('enter', 'enter-active'); if (prev.el) prev.el.classList.add('under'); }, 330);
    } else {
      el.classList.add('fade');
      if (prev && prev.el) prev.el.classList.add('under');
    }
    App._syncHash();
    App._updatePresenter();
  };
  App.go = function (id, params = {}) {
    if (!App.screens[id]) { console.warn('unknown screen', id); App.toast('该页面尚未纳入演示'); return; }
    App.closeOverlay();
    const entry = { id, params: params || {}, key: ++App._seq };
    App.stack.push(entry);
    App._mount(entry, 'push');
  };
  App.replace = function (id, params = {}) {
    const top = App.stack.pop();
    if (top && top.el) top.el.remove();
    const entry = { id, params: params || {}, key: ++App._seq };
    App.stack.push(entry);
    App._mount(entry, 'none');
  };
  App.back = function (n = 1) {
    App.closeOverlay();
    if (App.stack.length <= 1) return;
    while (n-- > 1 && App.stack.length > 2) { const mid = App.stack.splice(App.stack.length - 2, 1)[0]; if (mid.el) mid.el.remove(); }
    const top = App.stack.pop();
    const next = App.stack[App.stack.length - 1];
    if (next.el) { next.el.classList.remove('under'); App.renderEntry(next); }
    if (top.el) {
      top.el.classList.add('leave');
      void top.el.offsetWidth;
      top.el.classList.add('leave-active');
      setTimeout(() => top.el && top.el.remove(), 300);
    }
    App._syncHash();
    App._updatePresenter();
  };
  App.popTo = function (id) {
    while (App.stack.length > 1 && App.currentEntry().id !== id) {
      const top = App.stack.pop(); if (top.el) top.el.remove();
    }
    const next = App.currentEntry();
    if (next && next.el) { next.el.classList.remove('under'); App.renderEntry(next); }
    App._syncHash(); App._updatePresenter();
  };
  App.tab = function (tabId, params = {}) {
    if (!App.screens[tabId]) { console.warn('unknown tab', tabId); tabId = TAB_ROOTS[0]; }
    App.closeOverlay();
    App.stack.forEach((e) => e.el && e.el.remove());
    App.stack = [];
    const entry = { id: tabId, params: params || {}, key: ++App._seq };
    App.stack.push(entry);
    App._mount(entry, 'none');
  };
  // 原地刷新当前页（保留滚动位置）
  App.refresh = function () {
    const top = App.currentEntry();
    if (!top || !top.el) return;
    const c = top.el.querySelector('.content');
    const st = c ? c.scrollTop : 0;
    App.renderEntry(top);
    const c2 = top.el.querySelector('.content');
    if (c2) c2.scrollTop = st;
    App._updatePresenter();
  };
  App.scrollTop = function () { const c = App.currentEntry() && App.currentEntry().el.querySelector('.content'); if (c) c.scrollTop = 0; };

  // hash：#/screen?a=1&b=2
  App._syncHash = function () {
    const top = App.currentEntry();
    if (!top) return;
    const qs = Object.keys(top.params).filter((k) => typeof top.params[k] !== 'object').map((k) => `${encodeURIComponent(k)}=${encodeURIComponent(top.params[k])}`).join('&');
    const next = `#/${top.id}${qs ? '?' + qs : ''}`;
    App._lastHash = next;
    // replaceState 不触发 hashchange，避免自写 hash 引起的重入循环
    try { history.replaceState(null, '', next); } catch (e) { App._ignoreHash = true; location.hash = next; setTimeout(() => { App._ignoreHash = false; }, 0); }
  };
  App.openFromHash = function () {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) { App.tab('home'); return; }
    const [id, qs] = h.split('?');
    const params = {};
    (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    if (params.role && App.state.users[params.role]) { App.state.role = params.role; App.save(); }
    const def = App.screens[id];
    if (!def) { App.tab('home'); return; }
    if (TAB_ROOTS.includes(id)) { App.tab(id, params); return; }
    App.tab(def.tab || 'home');
    App.go(id, params);
  };

  /* ----------------------------------------------------------
     演示导览面板
     ---------------------------------------------------------- */
  App._updatePresenter = function () {
    const p = App.q('#presenter'); if (!p) return;
    const top = App.currentEntry(); const def = top ? App.screens[top.id] : null;
    const roles = Object.keys(App.state.users);
    const guide = window.DATA.GUIDE || [];
    const curIdx = guide.findIndex((g) => g.screen === (top && top.id) && (!g.match || g.match(top.params)));
    App.q('#p-roles').innerHTML = roles.map((r) => { const u = App.state.users[r]; return `<div class="role ${App.state.role === r ? 'active' : ''}" onclick="App.setRole('${r}')"><div class="r-av" style="background:${u.color}">${App.esc(App.initials(u.name))}</div><div>${App.esc(u.roleName)}</div></div>`; }).join('');
    App.q('#p-steps').innerHTML = guide.map((g, i) => `<div class="step-item ${i === curIdx ? 'active' : ''}" onclick="App.guideGo(${i})"><div class="n">${i + 1}</div><div><div>${App.esc(g.title)}</div>${g.sub ? `<div class="sub">${App.esc(g.sub)}</div>` : ''}</div></div>`).join('');
    const prd = (def && def.prd) || []; const rules = (def && def.rules) || [];
    App.q('#p-cur').innerHTML = def ? `<div class="cur-screen">${App.esc(def.title || def.id)}<small>${App.esc(def.id)}</small></div><div class="prd-chips">${prd.map((x) => `<span class="prd-chip">${App.esc(x)}</span>`).join('')}${rules.map((x) => `<span class="prd-chip rule">${App.esc(x)}</span>`).join('')}</div>` : '';
    const acts = (def && def.demoActions) || [];
    App.q('#p-demo-actions').innerHTML = acts.length ? acts.map((a, i) => `<button class="p-btn" onclick="App.runDemoAction(${i})">${App.icon(a.icon || 'play', 14)}${App.esc(a.label)}</button>`).join('') : '<div class="muted tiny">当前页面无额外演示动作</div>';
  };
  App.guideGo = function (i) {
    const g = (window.DATA.GUIDE || [])[i]; if (!g) return;
    if (g.role && App.state.role !== g.role) { App.state.role = g.role; }
    if (g.prepare) { try { g.prepare(App.state); } catch (e) { console.error(e); } }
    App.save();
    const def = App.screens[g.screen]; if (!def) return;
    if (TAB_ROOTS.includes(g.screen)) App.tab(g.screen); else { App.tab(def.tab || 'home'); if (g.via) g.via.forEach((v) => App.go(v.screen, v.params || {})); App.go(g.screen, g.params || {}); }
    if (g.after) setTimeout(() => g.after(), 350);
    App.togglePresenter(false);
  };
  App.runDemoAction = function (i) {
    const def = App.screens[App.currentEntry().id]; const a = def && def.demoActions && def.demoActions[i];
    if (a) a.run();
  };
  App.togglePresenter = function (force) {
    const p = App.q('#presenter'); if (!p) return;
    const open = force == null ? !p.classList.contains('open') : !!force;
    p.classList.toggle('open', open);
  };

  /* ----------------------------------------------------------
     启动
     ---------------------------------------------------------- */
  App.boot = function () {
    App.state = App.load();
    // 状态栏时间
    const sb = App.q('#statusbar');
    if (sb) sb.innerHTML = `<span>10:30</span><span class="right">${App.icon('signal', 15)}<span>5G</span>${App.icon('battery', 22)}</span>`;
    window.addEventListener('hashchange', () => { if (!App._ignoreHash && location.hash !== App._lastHash) App.openFromHash(); });
    App.openFromHash();
  };
})();

</script>

  /* ----------------------------------------------------------

  const TODAY = App.TODAY;
  const isMe = (id) => id === App.me().id;
  S.routeStores = function () {
    const st = App.state, me = App.me();
    return st.stores.filter((s) => s.route && (st.role === 'dj' || s.ownerId === me.id)).sort((a, b) => a.route.order - b.route.order);
  };
  S.checked = (list) => list.filter((s) => ['done', 'pending', 'running'].includes(s.route.trace));
  S.traced = (list) => list.filter((s) => s.route.trace === 'done');
  S.pendingStores = (list) => list.filter((s) => s.route.trace === 'pending');
  S.myTasks = () => App.state.tasks.filter((t) => isMe(t.toId) && (t.status === '待接受' || t.status === '执行中'));
  S.dueReminders = () => App.state.reminders.filter((r) => { const s = App.store(r.storeId); return r.status !== 'done' && r.due <= TODAY && s && isMe(s.ownerId); }).sort((a, b) => (a.due < b.due ? -1 : 1));
  S.greeting = function () {
    if (App.state.ui.evening) return '今天辛苦了';
    const h = 10; // 演示时钟 10:30
    if (h < 12) return '早上好'; if (h < 18) return '下午好'; return '晚上好';
  };
  S.kindTone = (kind) => ({ 催办: 'navy', 辅导: 'brand', 报价: 'ai', 下发: 'warn' }[kind] || 'gray');
  S.kindGlyph = (kind) => ({ 催办: '主管', 辅导: '辅导', 报价: '报价', 下发: '下发' }[kind] || (kind || '任务').slice(0, 2));
  S.taskChip = (st) => ({ 待接受: App.ui.chip('待接受', 'warn'), 执行中: App.ui.chip('执行中', 'info'), 已完成: App.ui.chip('已完成', 'ok'), 已拒绝: App.ui.chip('已拒绝', 'gray') }[st] || App.ui.chip(st, 'gray'));

  S.taskCell = (t) => `<div class="cell pressable" onclick="App.go('task',{id:'${t.id}'})"><div class="hm-tile ${S.kindTone(t.kind)}">${esc(S.kindGlyph(t.kind))}</div><div class="cell-body"><div class="cell-title ellipsis">${esc(t.title)}</div><div class="cell-sub">${S.taskSub(t)}</div></div><div class="cell-right">${S.taskChip(t.status)}</div></div>`;
  S.reminderCell = function (r) {
    const s = App.store(r.storeId) || { name: '—', tier: 'pending' };
    const n = App.fmt.days(r.due);
    const dueChip = n < 0 ? App.ui.chip(`逾期 ${-n} 天`, 'danger', { sm: true }) : App.ui.chip('今天', 'warn', { sm: true });
    const src = r.source + (r.tier ? ` · ${App.tierLabel(r.tier)} · ${r.cycle} 天` : (r.note ? ` · ${r.note}` : ''));
    return `<div class="cell pressable" onclick="App.go('reminders')"><div class="hm-tile ${n < 0 ? 'danger' : 'warn'}">${esc(App.initials(s.name))}</div><div class="cell-body"><div class="cell-title ellipsis">${esc(s.name)}</div><div class="cell-sub ellipsis">${esc(src)}</div></div><div class="cell-right">${dueChip}${App.icon('chevron-right', 16)}</div></div>`;

    { key: 'mic', title: '录音', sub: '语音留痕', icon: 'mic', tone: 'rose', purpose: '拜访后说一句话，由日日新大模型转写为文字并抽取字段；原文与音频保存在贵司租户内。', scope: '留痕转写，仅在你点击「开始」后录制，不做后台录音。', when: '点击麦克风时' },
    { key: 'geo', title: '定位', sub: '到店打点与扫街辅助', icon: 'map-pin', tone: 'brand', purpose: '开始拜访时记录到店位置与时间；进入街道时列出该街道客户。', scope: '仅在拜访期间打点，结束即停止；不记录额外轨迹。', when: '开始拜访 / 打开路线时' },

  };

  App.register('auth', {
    title: '隐私与授权', tab: 'home',
    prd: ['deck p12 · 授权与出发', '录音 / 定位 / 相机三项用途'],

    const rems = S.dueReminders();

  function streetData(name) {
    const st = App.state;
    const stores = st.stores.filter((s) => s.street === name);
    const isNew = (s) => !!s.isNew;
    const isCoop = (s) => s.coop === 'active';
    const dueSoon = (s) => { if (!s.nextDue) return false; const n = App.fmt.days(s.nextDue); return n <= 7; };
    const newOpen = stores.filter(isNew);
    const partners = stores.filter((s) => !isNew(s) && isCoop(s));
    const due = stores.filter((s) => !isNew(s) && !isCoop(s) && dueSoon(s));
    const others = stores.filter((s) => !newOpen.includes(s) && !partners.includes(s) && !due.includes(s));
    return { name, stores, newOpen, partners, due, others, street: App.by(st.streets, 'name', name) || { name, district: '' } };
  }

  }
  function bucket(r) { const n = App.fmt.days(r.due); if (n < 0) return 'overdue'; if (n === 0) return 'today'; if (n <= 7) return 'week'; return 'later'; }
  S.defer = (id) => {

    App.prompt('延期原因（必填）', '例：客户老板出差，改约下周', (reason) => {
      reason = (reason || '').trim();
      if (!reason) { App.toast('延期须填写原因', { icon: 'alert' }); return; }
      const apply = (due) => { r.deferred = { from: r.due, reason, at: TODAY() }; r.due = due; r.status = 'todo'; App.save(); App.refresh(); App.toast(`已延期至 ${App.fmt.md(due)} · 原因已留痕`, { icon: 'calendar' }); };
      App.sheet({ title: `延期到哪天？（原因：${reason}）`, items: [
        { label: '+1 天', sub: App.fmt.mdw(addDays(r.due, 1)), icon: 'calendar', onSelect: () => apply(addDays(r.due, 1)) },
        { label: '+3 天', sub: App.fmt.mdw(addDays(r.due, 3)), icon: 'calendar', onSelect: () => apply(addDays(r.due, 3)) },
        { label: '自选日期', sub: '输入 YYYY-MM-DD', icon: 'edit', onSelect: () => App.prompt('延期至（YYYY-MM-DD）', addDays(TODAY(), 7), (v) => { v = (v || '').trim(); if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { App.toast('日期格式：2026-09-12', { icon: 'alert' }); return; } apply(v); }) },
      ] });

  };

      const all = myReminders();
      const open = all.filter((r) => r.status !== 'done');
      // 同店同周期合并：带 dedupNote 的提醒并入同店另一条未完成提醒
      const merged = new Set(); const mergeMap = {};
      open.forEach((r) => { if (!r.dedupNote) return; const host = open.find((x) => x.storeId === r.storeId && x.id !== r.id && !x.dedupNote); if (host) { merged.add(r.id); (mergeMap[host.id] = mergeMap[host.id] || []).push(r); } });
      const shown = open.filter((r) => !merged.has(r.id)).sort((a, b) => (a.due < b.due ? -1 : 1));
      const groups = { overdue: [], today: [], week: [], later: [] };
      shown.forEach((r) => groups[bucket(r)].push(r));
      const doneList = all.filter((r) => r.status === 'done');
      const myTasks = st.tasks.filter((t) => t.toId === meId() && t.status !== '已完成').length;

      const head = `<div class="rt-head"><div class="row between"><div class="rt-h1">回访提醒与待办</div><button class="link small" style="flex:none" onclick="App.go('tasks')">${App.icon('list', 14)} 待办 ${myTasks} ›</button></div><div class="rt-h2 tight">按分层自动生成回访周期（规则由贵司配置）· 延期须填原因</div></div>`;
      const kpis = `<div class="kpis rm-kpis">${[['overdue', '逾期'], ['today', '今天'], ['week', '本周']].map(([k, l]) => `<div class="kpi ${k}"><div class="v">${groups[k].length}</div><div class="l">${l}</div></div>`).join('')}</div>`;
      const g = (k, title) => groups[k].length ? `<div class="rt-group"><b>${title} · ${groups[k].length}</b>${k === 'overdue' ? '<span>优先处理</span>' : ''}</div><div class="list">${groups[k].map((r) => reminderItem(r, mergeMap[r.id] || [])).join('')}</div>` : '';
      const body = shown.length ? g('overdue', '逾期') + g('today', '今天') + g('week', '本周') + g('later', '之后') : ui().empty({ icon: 'bell', title: '暂无回访提醒', sub: '归档留痕后按分层规则自动生成' });
      const done = doneList.length ? `<div class="rt-group"><b>已完成 · ${doneList.length}</b><span>本周期已关闭</span></div><div class="list">${doneList.slice(0, 3).map((r) => reminderItem(r, [])).join('')}</div>` : '';
      const foot = `<div class="st-dept">${App.icon('info', 14)}<div>分层由规则计算不可手改（${esc(st.settings.tierRule)}）；周期 A 7 天 / B 14 天 / C 30 天 / D 60 天为演示值。</div></div>`;
      return head + kpis + body + done + foot;
    },
  });
})();

  };
})();
