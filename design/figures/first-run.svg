<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
  <rect width="1440" height="420" fill="#f7f8fa"/>
  <text x="40" y="42" font-size="22" font-weight="800" fill="#1e232b">从 0 到 1 · 第一周把一条流程跑起来</text>
  <text x="40" y="66" font-size="13" fill="#68707c">用户每一步只做纠错：说编号。琥珀边 = 停下来等你的地方；绿虚线 = 数据回到图上，下一只狗从图上来。示例：投标流程。</text>
  <g font-size="13" fill="#1e232b">
    <rect x="40" y="110" width="250" height="190" rx="12" fill="#ffffff" stroke="#e5e8ee"/>
    <circle cx="66" cy="136" r="12" fill="#16a34a"/><text x="66" y="141" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="86" y="141" font-weight="800" font-size="14">画出现状</text>
    <text x="56" y="168" font-size="12" fill="#68707c">你做：说一段流程，丢材料</text>
    <text x="56" y="190" font-size="12.5">得到：泳道图 · 五问数字</text><text x="56" y="208" font-size="12.5">诊断清单 · 打包建议</text>
    <text x="56" y="236" font-size="11.5" fill="#68707c">屏幕 01 → 07 · 30 分钟</text>
    <rect x="56" y="252" width="150" height="26" rx="6" fill="#fef3e2" stroke="#d97706"/><text x="131" y="270" font-size="11.5" fill="#d97706" font-weight="700" text-anchor="middle">停在「按这个建」</text>

    <rect x="320" y="110" width="250" height="190" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="346" cy="136" r="12" fill="#d97706"/><text x="346" y="141" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="366" y="141" font-weight="800" font-size="14">建第一只狗</text>
    <text x="336" y="168" font-size="12" fill="#68707c">你做：点「按这个建」</text>
    <text x="336" y="190" font-size="12.5">得到：资产包 · 验收清单.json</text><text x="336" y="208" font-size="12.5">最多问 1–2 题，其余按 ★</text>
    <text x="336" y="236" font-size="11.5" fill="#68707c">屏幕 02 → 03 → 04 · 30 分钟</text>
    <rect x="336" y="252" width="150" height="26" rx="6" fill="#fef3e2" stroke="#d97706"/><text x="411" y="270" font-size="11.5" fill="#d97706" font-weight="700" text-anchor="middle">停在「入犬舍」</text>

    <rect x="600" y="110" width="250" height="190" rx="12" fill="#ffffff" stroke="#e5e8ee"/>
    <circle cx="626" cy="136" r="12" fill="#ffffff" stroke="#9aa4af" stroke-dasharray="3 2"/><text x="626" y="141" font-size="12" font-weight="800" fill="#68707c" text-anchor="middle">3</text>
    <text x="646" y="141" font-weight="800" font-size="14">上岗一次</text>
    <text x="616" y="168" font-size="12" fill="#68707c">你做：用真实材料跑启动指令</text>
    <text x="616" y="190" font-size="12.5">得到：三件套落盘 输出/</text><text x="616" y="208" font-size="12.5">日志开始累积</text>
    <text x="616" y="236" font-size="11.5" fill="#68707c">屏幕 05 · 1 小时</text>
    <rect x="616" y="252" width="190" height="26" rx="6" fill="#fef3e2" stroke="#d97706"/><text x="711" y="270" font-size="11.5" fill="#d97706" font-weight="700" text-anchor="middle">只在递交前停（待确认）</text>

    <rect x="880" y="110" width="250" height="190" rx="12" fill="#ffffff" stroke="#e5e8ee"/>
    <circle cx="906" cy="136" r="12" fill="#ffffff" stroke="#9aa4af" stroke-dasharray="3 2"/><text x="906" y="141" font-size="12" font-weight="800" fill="#68707c" text-anchor="middle">4</text>
    <text x="926" y="141" font-weight="800" font-size="14">复盘</text>
    <text x="896" y="168" font-size="12" fill="#68707c">你做：说「复盘」</text>
    <text x="896" y="190" font-size="12.5">得到：日志 → 已知规律</text><text x="896" y="208" font-size="12.5">说环节号只改那一处</text>
    <text x="896" y="236" font-size="11.5" fill="#68707c">屏幕 04 → 10 · 15 分钟</text>
    <rect x="896" y="252" width="150" height="26" rx="6" fill="#fef3e2" stroke="#d97706"/><text x="971" y="270" font-size="11.5" fill="#d97706" font-weight="700" text-anchor="middle">停在「改版 / 不改版」</text>

    <rect x="1160" y="110" width="250" height="190" rx="12" fill="#f0faf2" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="1186" cy="136" r="12" fill="#ffffff" stroke="#16a34a"/><text x="1186" y="141" font-size="12" font-weight="800" fill="#16a34a" text-anchor="middle">5</text>
    <text x="1206" y="141" font-weight="800" font-size="14">回到图上</text>
    <text x="1176" y="168" font-size="12" fill="#68707c">你做：切「对照现状」</text>
    <text x="1176" y="190" font-size="12.5">得到：卡点 2 → 0 的变化</text><text x="1176" y="208" font-size="12.5">下一只狗的打包建议</text>
    <text x="1176" y="236" font-size="11.5" fill="#68707c">屏幕 07 汇报模式 · 10 分钟</text>
    <rect x="1176" y="252" width="150" height="26" rx="6" fill="#fef3e2" stroke="#d97706"/><text x="1251" y="270" font-size="11.5" fill="#d97706" font-weight="700" text-anchor="middle">停在「下一只建谁」</text>
  </g>
  <g fill="none" stroke="#9aa4af" stroke-width="1.6" marker-end="url(#a)">
    <path d="M290 205H318"/><path d="M570 205H598"/><path d="M850 205H878"/><path d="M1130 205H1158"/>
  </g>
  <path d="M1285 300V330C1285 342 1277 350 1265 350H185C173 350 165 342 165 330V302" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <text x="520" y="344" font-size="11.5" fill="#16a34a">第二周从图上建第二只狗，打通一个系统；第一个月流程图上 AI 段 ≥ 50%，卡点归零</text>
  <text x="40" y="400" font-size="11.5" fill="#68707c">你需要准备的：一句话或一段流程（必需）· 材料（可选，决定八成质量）· 你自己的 Claude Code 或 Codex（引擎）· 一份真实样例（上岗用）。不用先写 PRD，不用等材料整理完整，不用一次建很多只狗。</text>
</svg>
